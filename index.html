<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Backrooms</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{display:block}

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.68) 0%,
        rgba(0,0,0,.27) 37%,
        rgba(0,0,0,0) 70%
    );
}

#startContent{
    position:absolute;
    top:34px;
    left:34px;
    max-width:560px;
    pointer-events:auto;
}

#title{
    margin:0;
    color:#eee7b0;
    font-weight:300;
    font-size:clamp(42px,6vw,92px);
    letter-spacing:12px;
    text-shadow:0 0 18px rgba(255,240,160,.18);
}

#subtitle{
    margin-top:18px;
    color:rgba(255,255,255,.78);
    line-height:1.55;
    font-size:17px;
}

#controlsText{
    margin-top:18px;
    color:rgba(255,255,255,.62);
    font-family:monospace;
    line-height:1.55;
}

#startButton,
#wakeButton,
#restartButton{
    margin-top:22px;
    padding:15px 34px;
    border:1px solid rgba(240,232,180,.85);
    background:rgba(0,0,0,.58);
    color:white;
    font-size:16px;
    letter-spacing:5px;
    cursor:pointer;
}

#startButton:hover,
#wakeButton:hover,
#restartButton:hover{
    background:rgba(78,72,40,.72);
}

.cinematicBar{
    position:fixed;
    left:0;
    width:100%;
    height:8%;
    background:#000;
    z-index:120;
    display:none;
    pointer-events:none;
}

#topBar{top:0}
#bottomBar{bottom:0}

#cutsceneCaption{
    position:fixed;
    left:34px;
    bottom:11%;
    z-index:130;
    color:rgba(255,255,255,.78);
    font-family:monospace;
    letter-spacing:3px;
    font-size:14px;
    opacity:0;
    transition:opacity .4s;
    pointer-events:none;
}

#fadeLayer{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    z-index:150;
    pointer-events:none;
    transition:opacity .25s;
}

#wakeScreen{
    position:fixed;
    inset:0;
    z-index:160;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    color:white;
    background:radial-gradient(
        circle,
        rgba(0,0,0,.15),
        rgba(0,0,0,.72)
    );
}

#wakeText{
    color:rgba(255,255,255,.78);
    letter-spacing:3px;
    line-height:1.7;
    font-size:14px;
}

#hud{
    position:fixed;
    inset:0;
    z-index:40;
    display:none;
    pointer-events:none;
}

#objective{
    position:absolute;
    top:26px;
    right:26px;
    padding:14px 34px;
    border:1px solid rgba(255,255,255,.24);
    background:rgba(0,0,0,.37);
    color:white;
    font-family:monospace;
    font-size:16px;
    letter-spacing:6px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    opacity:.76;
}

#crosshair::before{
    content:"";
    position:absolute;
    left:0;
    top:7px;
    width:16px;
    height:2px;
    background:white;
}

#crosshair::after{
    content:"";
    position:absolute;
    left:7px;
    top:0;
    width:2px;
    height:16px;
    background:white;
}

#staminaBox{
    position:absolute;
    left:35px;
    bottom:30px;
    width:360px;
}

#staminaLabel{
    margin-bottom:10px;
    color:white;
    font-size:15px;
    letter-spacing:6px;
}

#staminaOuter{
    height:24px;
    padding:3px;
    border:2px solid rgba(255,255,255,.92);
    background:rgba(0,0,0,.35);
}

#staminaInner{
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        #ddca59,
        #fff1a2
    );
}

#pauseText{
    display:none;
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    padding:15px 22px;
    background:rgba(0,0,0,.72);
    color:white;
    letter-spacing:4px;
}

#vignette{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    box-shadow:inset 0 0 180px 40px rgba(0,0,0,.68);
}

#grain{
    position:fixed;
    inset:0;
    z-index:21;
    pointer-events:none;
    opacity:.065;
    background-image:
        repeating-radial-gradient(
            circle at 22% 21%,
            rgba(255,255,255,.22) 0px,
            rgba(255,255,255,.04) 1px,
            transparent 2px,
            transparent 4px
        );
    mix-blend-mode:soft-light;
    animation:grainMove .12s infinite;
}

@keyframes grainMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-2px)}
    75%{transform:translate(1px,2px)}
    100%{transform:translate(0,0)}
}

#danger{
    position:fixed;
    inset:0;
    z-index:22;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(75,0,0,.72)
        );
}

#endScreen{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:#020202;
    color:white;
}

#endTitle{
    font-size:clamp(40px,8vw,88px);
    font-weight:300;
    letter-spacing:9px;
}

#endSub{
    margin-top:13px;
    color:#8a8a8a;
    letter-spacing:2px;
}

@media(max-width:700px){
    #startContent{
        top:20px;
        left:20px;
    }

    #title{
        letter-spacing:7px;
    }

    #objective{
        top:auto;
        right:18px;
        bottom:110px;
        font-size:12px;
        padding:12px 20px;
    }

    #staminaBox{
        left:20px;
        right:20px;
        bottom:20px;
        width:auto;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    <div id="startContent">

        <h1 id="title">
            THE BACKROOMS
        </h1>

        <div id="subtitle">
            It was supposed to be a normal night.<br>
            You stayed at the office a little too late.
        </div>

        <div id="controlsText">
            WASD = MOVE<br>
            SHIFT = SPRINT<br>
            MOUSE = LOOK
        </div>

        <button id="startButton">
            BEGIN
        </button>

    </div>
</div>

<div id="topBar" class="cinematicBar"></div>
<div id="bottomBar" class="cinematicBar"></div>

<div id="cutsceneCaption">
    11:53 PM — OFFICE FLOOR 3
</div>

<div id="fadeLayer"></div>

<div id="wakeScreen">

    <div id="wakeText">
        YOU HIT THE FLOOR.<br><br>
        THIS IS NOT THE OFFICE.
    </div>

    <button id="wakeButton">
        GET UP
    </button>

</div>

<div id="hud">

    <div id="objective">
        FIND THE EXIT
    </div>

    <div id="crosshair"></div>

    <div id="staminaBox">

        <div id="staminaLabel">
            STAMINA
        </div>

        <div id="staminaOuter">
            <div id="staminaInner"></div>
        </div>

    </div>

    <div id="pauseText">
        CLICK TO CONTINUE
    </div>

</div>

<div id="vignette"></div>
<div id="grain"></div>
<div id="danger"></div>

<div id="endScreen">

    <div id="endTitle"></div>

    <div id="endSub"></div>

    <button id="restartButton">
        RESTART
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* ============================================================
   SETTINGS
============================================================ */

const GRID_WIDTH = 16;
const GRID_HEIGHT = 16;

const CELL = 6;

const WALL_HEIGHT = 3.7;
const WALL_THICKNESS = 0.18;

const PLAYER_HEIGHT = 1.66;
const PLAYER_RADIUS = 0.32;

const WALK_SPEED = 3.1;
const SPRINT_SPEED = 5.45;

const MONSTER_SPEED = 2.0;

const EXTRA_WALL_REMOVAL = 0.42;


/* ============================================================
   UI
============================================================ */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const topBar =
    document.getElementById("topBar");

const bottomBar =
    document.getElementById("bottomBar");

const cutsceneCaption =
    document.getElementById("cutsceneCaption");

const fadeLayer =
    document.getElementById("fadeLayer");

const wakeScreen =
    document.getElementById("wakeScreen");

const wakeButton =
    document.getElementById("wakeButton");

const hud =
    document.getElementById("hud");

const staminaInner =
    document.getElementById("staminaInner");

const pauseText =
    document.getElementById("pauseText");

const danger =
    document.getElementById("danger");

const endScreen =
    document.getElementById("endScreen");

const endTitle =
    document.getElementById("endTitle");

const endSub =
    document.getElementById("endSub");

const restartButton =
    document.getElementById("restartButton");


/* ============================================================
   THREE
============================================================ */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        72,
        window.innerWidth / window.innerHeight,
        0.08,
        220
    );


camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.7
    )
);


renderer.outputEncoding =
    THREE.sRGBEncoding;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    0.78;


document.body.insertBefore(
    renderer.domElement,
    document.body.firstChild
);


/* ============================================================
   GROUPS
============================================================ */

const officeGroup =
    new THREE.Group();


const backroomsGroup =
    new THREE.Group();


scene.add(
    officeGroup
);


scene.add(
    backroomsGroup
);


backroomsGroup.visible =
    false;


/* ============================================================
   ATMOSPHERE
============================================================ */

function setOfficeAtmosphere() {

    scene.background =
        new THREE.Color(
            0x23272d
        );


    scene.fog =
        new THREE.Fog(
            0x23272d,
            12,
            42
        );

}


function setBackroomsAtmosphere() {

    scene.background =
        new THREE.Color(
            0x5b572d
        );


    scene.fog =
        new THREE.Fog(
            0x625d34,
            12,
            56
        );

}


/* ============================================================
   WALLPAPER
============================================================ */

function makeWallpaperTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#b4aa4f";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let x = 0;
        x < 256;
        x += 32
    ) {

        ctx.fillStyle =
            "rgba(60,55,18,.14)";


        ctx.fillRect(
            x,
            0,
            2,
            256
        );


        for (
            let y = 0;
            y < 256;
            y += 32
        ) {

            ctx.strokeStyle =
                "rgba(66,60,22,.23)";


            ctx.lineWidth =
                2;


            ctx.beginPath();

            ctx.moveTo(
                x + 9,
                y + 22
            );

            ctx.lineTo(
                x + 16,
                y + 9
            );

            ctx.lineTo(
                x + 23,
                y + 22
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                x + 11,
                y + 27
            );

            ctx.lineTo(
                x + 16,
                y + 18
            );

            ctx.lineTo(
                x + 21,
                y + 27
            );

            ctx.stroke();

        }

    }


    for (
        let i = 0;
        i < 3500;
        i++
    ) {

        const value =
            Math.random() >
            .5
                ? 255
                : 0;


        ctx.fillStyle =
            `rgba(${value},${value},${value},${Math.random() * .025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1.8,
        1.8
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   CARPET
============================================================ */

function makeCarpetTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#4e482d";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let i = 0;
        i < 18000;
        i++
    ) {

        const value =
            60 +
            Math.floor(
                Math.random() *
                50
            );


        ctx.fillStyle =
            `rgba(${value},${value - 8},${value - 28},.14)`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            Math.random() * 2 + .2,
            Math.random() * 4 + .4
        );

    }


    for (
        let i = 0;
        i < 26;
        i++
    ) {

        const x =
            Math.random() *
            256;


        const y =
            Math.random() *
            256;


        const radius =
            Math.random() *
            18 +
            4;


        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                radius
            );


        gradient.addColorStop(
            0,
            "rgba(15,12,7,.08)"
        );


        gradient.addColorStop(
            1,
            "rgba(15,12,7,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        28,
        28
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   CEILING
============================================================ */

function makeCeilingTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#a59e67";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    ctx.strokeStyle =
        "rgba(42,38,20,.55)";


    ctx.lineWidth =
        3;


    ctx.beginPath();

    ctx.moveTo(
        128,
        0
    );

    ctx.lineTo(
        128,
        256
    );

    ctx.moveTo(
        0,
        128
    );

    ctx.lineTo(
        256,
        128
    );

    ctx.stroke();


    for (
        let i = 0;
        i < 2000;
        i++
    ) {

        ctx.fillStyle =
            `rgba(0,0,0,${Math.random() * .025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        GRID_WIDTH * 1.5,
        GRID_HEIGHT * 1.5
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   MONSTER SKIN
============================================================ */

function createEntitySkinTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        512;


    canvas.height =
        512;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#958878";


    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    for (
        let i = 0;
        i < 900;
        i++
    ) {

        const x =
            Math.random() *
            512;


        const y =
            Math.random() *
            512;


        const radius =
            4 +
            Math.random() *
            30;


        const red =
            92 +
            Math.floor(
                Math.random() *
                70
            );


        const green =
            72 +
            Math.floor(
                Math.random() *
                55
            );


        const blue =
            62 +
            Math.floor(
                Math.random() *
                45
            );


        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                radius
            );


        gradient.addColorStop(
            0,
            `rgba(${red},${green},${blue},${.07 + Math.random() * .15})`
        );


        gradient.addColorStop(
            1,
            `rgba(${red},${green},${blue},0)`
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    for (
        let i = 0;
        i < 38000;
        i++
    ) {

        const darkness =
            Math.floor(
                Math.random() *
                50
            );


        ctx.fillStyle =
            `rgba(${darkness},${darkness},${darkness},${Math.random() * .055})`;


        ctx.fillRect(
            Math.random() * 512,
            Math.random() * 512,
            Math.random() * 2 + .4,
            Math.random() * 2 + .4
        );

    }


    for (
        let i = 0;
        i < 100;
        i++
    ) {

        ctx.fillStyle =
            `rgba(95,42,35,${.025 + Math.random() * .055})`;


        ctx.beginPath();

        ctx.arc(
            Math.random() * 512,
            Math.random() * 512,
            4 + Math.random() * 18,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1.25,
        1.25
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   MONSTER BUMP
============================================================ */

function createEntityBumpTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");

        "#808080";


    ctx.fillRect(
        0,
        0,

    );


    for (

    ) {

            Math.floor(

            );


        ctx.fillStyle =
            `rgb(${gray},${gray},${gray})`;


        ctx.fillRect(

        );

    }


    const texture =
        new THREE.CanvasTexture(

        );


    texture.wrapS =

    texture.wrapT =

    );

}


/* ============================================================
   MONSTER BODY TEXTURE
============================================================ */

function createEntityBodyTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#11110f";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let i = 0;
        i < 19000;
        i++
    ) {

        const value =
            10 +
            Math.floor(
                Math.random() *
                35
            );


        ctx.fillStyle =
            `rgba(${value},${value},${Math.max(0,value - 2)},${Math.random() * .13})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            Math.random() * 3 + .4,
            Math.random() * 5 + .4
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        2,
        3
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   OFFICE
============================================================ */

const officeLights =
    [];


function buildOffice() {

    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x4a4d51,
            roughness: 1
        });


    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xd4d1c9,
            roughness: .95
        });


    const ceilingMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xcfcbbf,
            roughness: .92
        });


    const doorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x5a564d,
            roughness: .9
        });


    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                12,
                56
            ),
            floorMaterial
        );


    floor.rotation.x =
        -Math.PI / 2;


    officeGroup.add(
        floor
    );


    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                12,
                56
            ),
            ceilingMaterial
        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.4;


    officeGroup.add(
        ceiling
    );


    const leftWall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .22,

const maze =
    [];


for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
) {

    maze[y] =
        [];


    for (
        let x = 0;
        x < GRID_WIDTH;
        x++
    ) {

        maze[y][x] = {
            visited: false,

            walls: {
                north: true,
                south: true,
                east: true,
                west: true
            }
        };

    }

}


function openBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;


    const dy =
        y2 - y1;


    if (
        dx === 1
    ) {

        maze[y1][x1].walls.east =
            false;


        maze[y2][x2].walls.west =
            false;

    }

    else if (
        dx === -1
    ) {

        maze[y1][x1].walls.west =
            false;


        maze[y2][x2].walls.east =
            false;

    }

    else if (
        dy === 1
    ) {

        maze[y1][x1].walls.south =
            false;


        maze[y2][x2].walls.north =
            false;

    }

    else if (
        dy === -1
    ) {

        maze[y1][x1].walls.north =
            false;


        maze[y2][x2].walls.south =
            false;

    }

}


function generateMaze() {

    const stack =
        [];


    let current = {
        x: 0,
        y: 0
    };


    maze[0][0].visited =
        true;


    let count =
        1;


    const total =
        GRID_WIDTH *
        GRID_HEIGHT;


    while (
        count <
        total
    ) {

        const options =
            [];


        const x =
            current.x;


        const y =
            current.y;


        if (
            y > 0 &&
            !maze[y - 1][x].visited
        ) {

            options.push({
                x,
                y: y - 1
            });

        }


        if (
            y <
            GRID_HEIGHT - 1 &&
            !maze[y + 1][x].visited
        ) {

            options.push({
                x,
                y: y + 1
            });

        }


        if (
            x > 0 &&
            !maze[y][x - 1].visited
        ) {

            options.push({
                x: x - 1,
                y
            });

        }


        if (
            x <
            GRID_WIDTH - 1 &&
            !maze[y][x + 1].visited
        ) {

            options.push({
                x: x + 1,
                y
            });

        }


        if (
            options.length
        ) {

            const next =
                options[
                    Math.floor(
                        Math.random() *
                        options.length
                    )
                ];


            stack.push({
                x,
                y
            });


            openBetween(
                x,
                y,
                next.x,
                next.y
            );


            current =
                next;


            maze[
                current.y
            ][
                current.x
            ].visited =
                true;


            count++;

        }

        else {

            current =
                stack.pop();

        }

    }


    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            if (
                x <
                GRID_WIDTH - 1 &&
                Math.random() <
                EXTRA_WALL_REMOVAL
            ) {

                maze[y][x].walls.east =
                    false;


                maze[y][x + 1].walls.west =
                    false;

            }


            if (
                y <
                GRID_HEIGHT - 1 &&
                Math.random() <
                EXTRA_WALL_REMOVAL
            ) {

                maze[y][x].walls.south =
                    false;


                maze[y + 1][x].walls.north =
                    false;

            }

        }

    }

}


/* ============================================================

============================================================ */

function cellToWorld(
    x,
    y
) {

    return {
        x:
            (
                x -
                GRID_WIDTH / 2 +
                .5
            ) *
            CELL,

        z:
            (
                y -
                GRID_HEIGHT / 2 +
                .5
            ) *
            CELL
    };

}


function worldToCell(
    x,
    z
) {

    let cellX =
        Math.floor(
            x / CELL +
            GRID_WIDTH / 2
        );


    let cellY =
        Math.floor(
            z / CELL +
            GRID_HEIGHT / 2
        );


    cellX =
        Math.max(
            0,
            Math.min(
                GRID_WIDTH - 1,
                cellX
            )
        );


    cellY =
        Math.max(
            0,
            Math.min(
                GRID_HEIGHT - 1,
                cellY
            )
        );


    return {
        x: cellX,
        y: cellY
    };

}

function getNeighbors(
    x,
    y
) {

    const cell =
        maze[y][x];


    const neighbors =
        [];


    if (
        !cell.walls.north &&
        y > 0
    ) {

        neighbors.push({
            x,
            y: y - 1
        });

    }


    if (
        !cell.walls.south &&
        y <
        GRID_HEIGHT - 1
    ) {

        neighbors.push({
            x,
            y: y + 1
        });

    }


    if (
        !cell.walls.east &&
        x <
        GRID_WIDTH - 1
    ) {

        neighbors.push({
            x: x + 1,
            y
        });

    }


    if (
        !cell.walls.west &&
        x > 0
    ) {

        neighbors.push({
            x: x - 1,
            y
        });

    }


    return neighbors;

}


function findFarthestCell() {

    const queue =
        [{
            x: 0,
            y: 0,
            distance: 0
        }];


    const visited =
        new Set([
            "0,0"
        ]);


    let farthest =
        queue[0];


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.distance >
            farthest.distance
        ) {

            farthest =
                current;

        }


        for (
            const neighbor of
            getNeighbors(
                current.x,
                current.y
            )
        ) {

            const key =
                neighbor.x +
                "," +
                neighbor.y;


            if (
                visited.has(
                    key
                )
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({
                x: neighbor.x,
                y: neighbor.y,
                distance:
                    current.distance + 1
            });

        }

    }


    return farthest;

}


function buildBackrooms() {

    generateMaze();


    const worldWidth =
        GRID_WIDTH *
        CELL;


    const worldDepth =
        GRID_HEIGHT *
        CELL;


    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                worldWidth,
                worldDepth
            ),
            floorMaterial
        );


    floor.rotation.x =
        -Math.PI / 2;


    backroomsGroup.add(
        floor
    );


    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                worldWidth,
                worldDepth
            ),
            ceilingMaterial
        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        WALL_HEIGHT;


    backroomsGroup.add(
        ceiling
    );


    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            const cell =
                maze[y][x];


            const position =
                cellToWorld(
                    x,
                    y
                );


            if (
                cell.walls.north
            ) {

                createWall(
                    position.x,
                    position.z - CELL / 2,
                    CELL + WALL_THICKNESS,
                    WALL_THICKNESS
                );

            }


            if (
                cell.walls.west
            ) {

                createWall(
                    position.x - CELL / 2,
                    position.z,
                    WALL_THICKNESS,
                    CELL + WALL_THICKNESS
                );

            }


            if (
                y ===
                GRID_HEIGHT - 1 &&
                cell.walls.south
            ) {

                createWall(
                    position.x,
                    position.z + CELL / 2,
                    CELL + WALL_THICKNESS,
                    WALL_THICKNESS
                );

            }


            if (
                x ===
                GRID_WIDTH - 1 &&
                cell.walls.east
            ) {

                createWall(
                    position.x + CELL / 2,
                    position.z,
                    WALL_THICKNESS,
                    CELL + WALL_THICKNESS
                );

            }

        }

    }


    for (
        let y = 1;
        y < GRID_HEIGHT - 1;
        y += 2
    ) {

        for (
            let x = 1;
            x < GRID_WIDTH - 1;
            x += 2
        ) {

            if (
                Math.random() <
                .24
            ) {

                const position =
                    cellToWorld(
                        x,
                        y
                    );


                createColumn(
                    position.x + CELL / 2,
                    position.z + CELL / 2
                );

            }

        }

    }


    backroomsGroup.add(
        new THREE.HemisphereLight(
            0xbeb46a,
            0x27230f,
            .58
        )
    );


    backroomsGroup.add(
        new THREE.AmbientLight(
            0x5d5628,
            .5
        )
    );


    for (
        let y = 0;
        y < GRID_HEIGHT;
        y += 3
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x += 3
        ) {

            const position =
                cellToWorld(
                    x,
                    y
                );


            createFluorescent(
                position.x,
                position.z,
                Math.random() >
                .5
                    ? 0
                    : Math.PI / 2
            );

        }

    }

}

function createEntityLimb(
    x,
    y,
    upperLength,
    lowerLength,
    upperRadius,
    lowerRadius,
    lowerMaterial
) {

    const upperPivot =
        new THREE.Group();


    upperPivot.position.set(
        x,
        y,
        0
    );


    monsterRig.add(
        upperPivot
    );


    const upper =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                upperRadius * .82,
                upperRadius,
                upperLength,
                10
            ),
            entityBodyMaterial
        );


    upper.position.y =
        -upperLength / 2;


    upperPivot.add(
        upper
    );


    const joint =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                upperRadius * .92,
                10,
                8
            ),
            entityBodyMaterial
        );


    joint.position.y =
        -upperLength;


    upperPivot.add(
        joint
    );


    const lowerPivot =
        new THREE.Group();


    lowerPivot.position.y =
        -upperLength;


    upperPivot.add(
        lowerPivot
    );


    const lower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                lowerRadius * .78,
                lowerRadius,
                lowerLength,
                10
            ),
            lowerMaterial
        );


    lower.position.y =
        -lowerLength / 2;


    lowerPivot.add(
        lower
    );


    return {
        upperPivot,
        lowerPivot,
        upper,
        lower
    };

}

/* ============================================================
   PATHFINDING
============================================================ */

function findPath(
    start,
    target
) {

    const queue =
        [{
            x: start.x,
            y: start.y,
            path: []
        }];


    const visited =
        new Set([
            `${start.x},${start.y}`
        ]);


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.x ===
            target.x &&
            current.y ===
            target.y
        ) {

            return current.path;

        }


        for (
            const neighbor of
            getNeighbors(
                current.x,
                current.y
            )
        ) {

            const key =
                `${neighbor.x},${neighbor.y}`;


            if (
                visited.has(
                    key
                )
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({
                x: neighbor.x,
                y: neighbor.y,

                path: [
                    ...current.path,
                    neighbor
                ]
            });

        }

    }


    return [];

}

let audioContext =
    null;


function startAudio() {

    if (
        audioContext
    ) {

        return;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    const master =
        audioContext.createGain();


    master.gain.value =
        .027;


    master.connect(
        audioContext.destination
    );


    const hum =
        audioContext.createOscillator();


    hum.type =
        "sine";


    hum.frequency.value =
        60;


    hum.connect(
        master
    );


    hum.start();


    const highHum =
        audioContext.createOscillator();


    const highGain =
        audioContext.createGain();


    highHum.type =
        "sine";


    highHum.frequency.value =
        119.6;


    highGain.gain.value =
        .18;


    highHum.connect(
        highGain
    );


    highGain.connect(
        master
    );


    highHum.start();

}

function updateCutscene(
    delta
) {

    cutsceneTime +=
        delta;


    if (
        cutsceneTime <
        3.8
    ) {

        camera.position.z =
            14 -
            cutsceneTime *
            2.5;


        camera.position.y =
            1.72 +
            Math.sin(
                cutsceneTime *
                8
            ) *
            .02;


        camera.rotation.x =
            Math.sin(
                cutsceneTime *
                1.4
            ) *
            .006;


        camera.rotation.z =
            0;


        if (
            cutsceneTime >
            2.1
        ) {

            cutsceneCaption.style.opacity =
                "0";

        }

    }


    if (
        cutsceneTime >
        3.3 &&
        cutsceneTime <
        4.25
    ) {

        if (
            Math.random() <
            .35
        ) {

            const light =
                officeLights[
                    Math.floor(
                        Math.random() *
                        officeLights.length
                    )
                ];


            if (
                light
            ) {

                const original =
                    light.intensity;


                light.intensity =
                    Math.random() <
                    .5
                        ? .05
                        : .65;


                setTimeout(
                    () => {
                        light.intensity =
                            original;
                    },
                    50
                );

            }

        }


        camera.rotation.z =
            (
                Math.random() -
                .5
            ) *
            .008;

    }


    if (
        cutsceneTime >=
        4.25 &&
        cutsceneTime <
        5.05
    ) {

        const fall =
            (
                cutsceneTime -
                4.25
            ) /
            .8;


        camera.position.y =
            1.72 -
            fall *
            5.3;


        camera.rotation.x =
            fall *
            .9;


        camera.rotation.z =
            fall *
            .15;


        fadeLayer.style.opacity =
            String(
                Math.min(
                    1,
                    fall *
                    1.4
                )
            );

    }


    if (
        cutsceneTime >=
        5.05 &&
        !cutsceneFinished
    ) {

        cutsceneFinished =
            true;


        setTimeout(
            wakeInBackrooms,
            600
        );

    }

}

    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement ||
            mode !==

        ) {

            return;

        }


        const sensitivity =
            .0019;


        yaw -=
            event.movementX *
            sensitivity;


        pitch -=
            event.movementY *

        pitch =
            Math.max(
                -1.42,
                Math.min(
                    1.42,
                    pitch
                )
            );


        camera.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;


        camera.rotation.z =
            0;

    }
);


/* ============================================================
   COLLISION
============================================================ */

function hitsWall(
    x,
    z
) {

    for (
        const wall of
        collisionWalls
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}


/* ============================================================
   PLAYER UPDATE
============================================================ */

function updatePlayer(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {

        return;

    }


    let forward =
        0;


    let sideways =
        0;


    if (
        keys.KeyW
    ) {
        forward++;
    }


    if (
        keys.KeyS
    ) {
        forward--;
    }


    if (
        keys.KeyD
    ) {
        sideways++;
    }


    if (
        keys.KeyA
    ) {
        sideways--;
    }


    const moving =
        forward !== 0 ||
        sideways !== 0;


    const sprinting =
        moving &&
        forward > 0 &&
        stamina > 0 &&
        (
            keys.ShiftLeft ||
            keys.ShiftRight
        );


    const speed =
        sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;


    if (
        sprinting
    ) {

        stamina -=
            delta *
            21;

    }

    else {

        stamina +=
            delta *
            13;

    }


    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );


    staminaInner.style.width =
        stamina +
        "%";


    const targetFov =
        sprinting
            ? 77
            : 72;


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) *
        Math.min(
            delta *
            7,
            1
        );


    camera.updateProjectionMatrix();


    camera.rotation.z =
        0;


    if (
        !moving
    ) {

        camera.position.y +=
            (
                PLAYER_HEIGHT -
                camera.position.y
            ) *
            Math.min(
                delta *
                8,
                1
            );


        return;

    }


    const length =
        Math.sqrt(
            forward *
            forward +
            sideways *
            sideways
        );


    forward /=
        length;


    sideways /=
        length;


    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const dx =
        (
            -sin *
            forward +
            cos *
            sideways
        ) *
        speed *
        delta;


    const dz =
        (
            -cos *
            forward -
            sin *
            sideways
        ) *
        speed *
        delta;


    const nextX =
        camera.position.x +
        dx;


    if (
        !hitsWall(
            nextX,
            camera.position.z
        )
    ) {

        camera.position.x =
            nextX;

    }


    const nextZ =
        camera.position.z +
        dz;


    if (
        !hitsWall(
            camera.position.x,
            nextZ
        )
    ) {

        camera.position.z =
            nextZ;

    }


    movementTime +=
        delta *
        (
            sprinting
                ? 12
                : 8
        );


    camera.position.y =
        PLAYER_HEIGHT +
        Math.sin(
            movementTime
        ) *
        (
            sprinting
                ? .045
                : .027
        );

}


/* ============================================================
   MONSTER UPDATE
============================================================ */

function updateMonster(
    delta
) {

    monsterActiveTimer -=
        delta;


    if (
        monsterActiveTimer >
        0
    ) {

        return;

    }


    monster.visible =
        true;


    const playerCell =
        worldToCell(
            camera.position.x,
            camera.position.z
        );


    const monsterCell =
        worldToCell(
            monster.position.x,
            monster.position.z
        );


    monsterPathTimer -=
        delta;


    if (
        monsterPathTimer <=
        0
    ) {

        monsterPathTimer =
            .45;


        monsterPath =
            findPath(
                monsterCell,
                playerCell
            );

    }


    let moving =
        false;


    if (
        monsterPath.length
    ) {

        const next =
            monsterPath[0];


        const target =
            cellToWorld(
                next.x,
                next.y
            );


        const dx =
            target.x -
            monster.position.x;


        const dz =
            target.z -
            monster.position.z;


        const distance =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        if (
            distance <
            .13
        ) {

            monsterPath.shift();

        }

        else {

            moving =
                true;


            const directionX =
                dx /
                distance;


            const directionZ =
                dz /
                distance;


            monster.position.x +=
                directionX *
                MONSTER_SPEED *
                delta;


            monster.position.z +=
                directionZ *
                MONSTER_SPEED *
                delta;


            monster.rotation.y =
                Math.atan2(
                    directionX,
                    directionZ
                ) +
                Math.PI;

        }

    }


    const time =
        performance.now() *
        .001;


    const walk =
        Math.sin(
            time *
            6.1
        ) *
        (
            moving
                ? 1
                : .025
        );


    monsterRig.position.y =
        Math.sin(
            time *
            3.1
        ) *
        .008;


    monsterRig.rotation.z =
        Math.sin(
            time *
            .7
        ) *
        .009;


    monsterRig.rotation.x =
        .055 +
        Math.sin(
            time *
            .75
        ) *
        .006;


    leftLeg.upperPivot.rotation.x =
        -walk *
        .23;


    rightLeg.upperPivot.rotation.x =
        walk *
        .23;


    leftLeg.lowerPivot.rotation.x =
        Math.max(
            0,
            walk
        ) *
        .15;


    rightLeg.lowerPivot.rotation.x =
        Math.max(
            0,
            -walk
        ) *
        .15;


    leftArm.upperPivot.rotation.x =
        .055 +
        walk *
        .19;


    rightArm.upperPivot.rotation.x =
        .035 -
        walk *
        .22;


    leftArm.lowerPivot.rotation.x =
        -.05 +
        Math.max(
            0,
            -walk
        ) *
        .08;


    rightArm.lowerPivot.rotation.x =
        -.035 +
        Math.max(
            0,
            walk
        ) *
        .09;


    monsterHeadPivot.rotation.z =
        Math.sin(
            time *
            .67
        ) *
        .032;


    monsterHeadPivot.rotation.x =
        -.05 +
        Math.sin(
            time *
            .53
        ) *
        .018;


    monsterHeadPivot.rotation.y =
        Math.sin(
            time *
            .43
        ) *
        .035;


    const twitch =
        Math.pow(
            Math.max(
                0,
                Math.sin(
                    time *
                    .81
                )
            ),
            42
        );


    monsterHeadPivot.rotation.y +=
        twitch *
        .12;


    const dx =
        monster.position.x -
        camera.position.x;


    const dz =
        monster.position.z -
        camera.position.z;


    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    let dangerAmount =
        0;


    if (
        distance <
        12
    ) {

        dangerAmount =
            1 -
            distance /
            12;

    }


    danger.style.opacity =
        String(
            dangerAmount *
            .53
        );


    if (
        distance <
        .92
    ) {

        loseGame();

    }

}


/* ============================================================
   LIGHT FLICKER
============================================================ */

let flickerTimer =
    0;


function updateLights(
    delta
) {

    flickerTimer -=
        delta;


    if (
        flickerTimer >
        0
    ) {

        return;

    }


    flickerTimer =
        .1 +
        Math.random() *
        1.7;


    if (
        Math.random() >
        .22
    ) {

        return;

    }


    const light =
        fluorescentLights[
            Math.floor(
                Math.random() *
                fluorescentLights.length
            )
        ];


    if (
        !light
    ) {

        return;

    }


    const original =
        light.intensity;


    light.intensity =
        .02;


    setTimeout(
        () => {
            light.intensity =
                original;
        },
        50 +
        Math.random() *
        100
    );

}


/* ============================================================
   EXIT
============================================================ */

function checkExit() {

    const dx =
        camera.position.x -
        exitGroup.position.x;


    const dz =
        camera.position.z -
        exitGroup.position.z;


    if (
        dx * dx +
        dz * dz <
        2.2
    ) {

        winGame();

    }

}


/* ============================================================
   END STATES
============================================================ */

function winGame() {

    if (
        mode ===
        "end"
    ) {

        return;

    }


    mode =
        "end";


    document.exitPointerLock();


    hud.style.display =
        "none";


    endScreen.style.display =
        "flex";


    endTitle.textContent =
        "YOU ESCAPED";


    endTitle.style.color =
        "#d9ffc7";


    endSub.textContent =
        "At least... you think you did.";

}


function loseGame() {

    if (
        mode ===
        "end"
    ) {

        return;

    }


    mode =
        "end";


    document.exitPointerLock();


    danger.style.opacity =
        ".85";


    setTimeout(
        () => {

            hud.style.display =
                "none";


            endScreen.style.display =
                "flex";


            endTitle.textContent =
                "YOU WERE FOUND";


            endTitle.style.color =
                "#912727";


            endSub.textContent =
                "Something almost human was wandering the halls.";

        },
        280
    );

}


/* ============================================================
   BUTTONS
============================================================ */

startButton.addEventListener(
    "click",
    beginCutscene
);


wakeButton.addEventListener(
    "click",
    startPlaying
);


restartButton.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/* ============================================================
   POINTER LOCK
============================================================ */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            mode ===
            "playing" &&
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        if (
            mode !==
            "playing"
        ) {

            return;

        }


        pauseText.style.display =
            document.pointerLockElement ===
            renderer.domElement
                ? "none"
                : "block";

    }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ============================================================
   INITIAL STATE
============================================================ */

officeGroup.visible =
    true;


backroomsGroup.visible =
    false;


setOfficeAtmosphere();


setOfficePreviewCamera();


/* ============================================================
   MAIN LOOP
============================================================ */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        mode ===
        "title"
    ) {

        camera.position.x =
            Math.sin(
                performance.now() *
                .00035
            ) *
            .12;


        camera.position.y =
            1.72 +
            Math.sin(
                performance.now() *
                .001
            ) *
            .01;


        const titleYaw =
            Math.sin(
                performance.now() *
                .00045
            ) *
            .02;


        camera.rotation.set(
            0,
            titleYaw,
            0
        );

    }


    if (
        mode ===
        "cutscene"
    ) {

        updateCutscene(
            delta
        );

    }


    if (
        mode ===
        "playing"
    ) {

        updatePlayer(
            delta
        );


        updateMonster(
            delta
        );


        updateLights(
            delta
        );


        checkExit();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
</body>
</html>
