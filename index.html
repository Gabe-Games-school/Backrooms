<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Backrooms</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
    }

    /* =========================================================
       INTRO
    ========================================================= */

    #intro {
        position: fixed;
        inset: 0;
        z-index: 100;

        pointer-events: none;

        background:
            linear-gradient(
                90deg,
                rgba(0,0,0,0.58) 0%,
                rgba(0,0,0,0.18) 37%,
                transparent 65%
            );
    }

    #introContent {
        position: absolute;
        left: 32px;
        top: 31px;

        color: white;

        pointer-events: auto;
    }

    #introTitle {
        margin: 0;

        font-size: clamp(32px, 4vw, 58px);

        font-weight: 300;

        letter-spacing: 14px;

        color: #f2e9a4;

        text-shadow:
            0 0 12px rgba(255,238,130,0.28);
    }

    #introText {
        margin-top: 14px;

        font-size: 15px;

        line-height: 1.55;

        color: rgba(255,255,255,0.82);

        letter-spacing: 0.5px;
    }

    #controls {
        margin-top: 16px;

        font-family: monospace;

        letter-spacing: 1px;

        color: rgba(255,255,255,0.78);
    }

    #enterButton {
        margin-top: 19px;

        width: 258px;
        height: 56px;

        border: 1px solid rgba(255,239,150,0.9);

        background: rgba(5,5,2,0.63);

        color: #f0e6a2;

        font-size: 22px;

        letter-spacing: 8px;

        cursor: pointer;

        transition:
            background 0.18s,
            transform 0.18s;
    }

    #enterButton:hover {
        background: rgba(70,63,25,0.72);
        transform: translateY(-1px);
    }

    /* =========================================================
       HUD
    ========================================================= */

    #hud {
        position: fixed;
        inset: 0;

        z-index: 30;

        pointer-events: none;
    }

    #objective {
        position: absolute;

        top: 28px;
        right: 28px;

        min-width: 295px;

        text-align: center;

        padding: 14px 24px;

        border: 1px solid rgba(240,230,170,0.35);

        background: rgba(0,0,0,0.47);

        color: rgba(255,255,255,0.9);

        font-family: monospace;

        letter-spacing: 6px;

        font-size: 16px;
    }

    #crosshair {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 16px;
        height: 16px;

        transform: translate(-50%, -50%);

        opacity: 0.72;
    }

    #crosshair::before {
        content: "";

        position: absolute;

        width: 16px;
        height: 2px;

        left: 0;
        top: 7px;

        background: white;
    }

    #crosshair::after {
        content: "";

        position: absolute;

        width: 2px;
        height: 16px;

        top: 0;
        left: 7px;

        background: white;
    }

    #staminaHolder {
        position: absolute;

        left: 38px;
        bottom: 35px;

        width: 370px;
    }

    #staminaLabel {
        color: white;

        font-size: 16px;

        letter-spacing: 6px;

        margin-bottom: 12px;
    }

    #staminaOuter {
        width: 100%;
        height: 25px;

        border: 2px solid rgba(255,255,255,0.88);

        padding: 3px;

        background: rgba(0,0,0,0.25);
    }

    #staminaInner {
        width: 100%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                #f5dd68,
                #fff2a6
            );
    }

    #pauseText {
        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        display: none;

        background: rgba(0,0,0,0.7);

        color: white;

        padding: 17px 26px;

        letter-spacing: 4px;
    }

    /* =========================================================
       EFFECTS
    ========================================================= */

    #vignette {
        position: fixed;

        inset: 0;

        z-index: 20;

        pointer-events: none;

        box-shadow:
            inset 0 0 160px 25px rgba(0,0,0,0.68);
    }

    #grain {
        position: fixed;

        inset: 0;

        z-index: 21;

        pointer-events: none;

        opacity: 0.095;

        background-image:
            repeating-radial-gradient(
                circle at 17% 22%,
                rgba(255,255,255,0.28) 0px,
                rgba(255,255,255,0.08) 1px,
                transparent 2px,
                transparent 4px
            );

        mix-blend-mode: soft-light;

        animation: grainMove 0.12s infinite;
    }

    @keyframes grainMove {
        0% {
            transform: translate(0,0);
        }

        25% {
            transform: translate(-3px,2px);
        }

        50% {
            transform: translate(2px,-2px);
        }

        75% {
            transform: translate(3px,1px);
        }

        100% {
            transform: translate(0,0);
        }
    }

    #danger {
        position: fixed;

        inset: 0;

        z-index: 22;

        pointer-events: none;

        opacity: 0;

        background:
            radial-gradient(
                circle at center,
                transparent 35%,
                rgba(105,0,0,0.75)
            );
    }

    /* =========================================================
       END SCREEN
    ========================================================= */

    #endScreen {
        position: fixed;

        inset: 0;

        z-index: 300;

        display: none;

        align-items: center;
        justify-content: center;

        flex-direction: column;

        background: #030302;

        color: white;

        text-align: center;
    }

    #endTitle {
        font-size: clamp(42px, 8vw, 100px);

        letter-spacing: 9px;

        font-weight: 300;
    }

    #endSub {
        margin-top: 12px;

        color: #999;

        letter-spacing: 2px;
    }

    #restartButton {
        margin-top: 30px;

        padding: 15px 32px;

        border: 1px solid #aaa;

        background: #111;

        color: white;

        font-size: 15px;

        letter-spacing: 4px;

        cursor: pointer;
    }

    @media(max-width: 700px) {

        #introContent {
            left: 20px;
            top: 20px;
        }

        #introTitle {
            letter-spacing: 7px;
        }

        #objective {
            top: auto;
            bottom: 110px;
            right: 20px;

            min-width: 0;

            font-size: 12px;
        }

        #staminaHolder {
            width: calc(100% - 40px);
            left: 20px;
            bottom: 20px;
        }
    }
</style>
</head>

<body>

<div id="intro">

    <div id="introContent">

        <h1 id="introTitle">
            THE BACKROOMS
        </h1>

        <div id="introText">
            You don't remember how you got here.<br>
            Find the exit.<br>
            Do not let it find you.
        </div>

        <div id="controls">
            WASD = MOVE &nbsp; | &nbsp;
            SHIFT = SPRINT &nbsp; | &nbsp;
            MOUSE = LOOK
        </div>

        <button id="enterButton">
            ENTER
        </button>

    </div>

</div>


<div id="hud">

    <div id="objective">
        FIND THE EXIT
    </div>

    <div id="crosshair"></div>

    <div id="staminaHolder">

        <div id="staminaLabel">
            STAMINA
        </div>

        <div id="staminaOuter">

            <div id="staminaInner"></div>

        </div>

    </div>

    <div id="pauseText">
        CLICK TO CONTINUE
    </div>

</div>


<div id="vignette"></div>
<div id="grain"></div>
<div id="danger"></div>


<div id="endScreen">

    <div id="endTitle"></div>

    <div id="endSub"></div>

    <button id="restartButton">
        RESTART
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* ============================================================
   BACKROOMS
   ============================================================ */


/* ============================================================
   SETTINGS
============================================================ */

const GRID_WIDTH = 18;
const GRID_HEIGHT = 18;

const CELL = 5.8;

const WALL_HEIGHT = 3.65;
const WALL_THICKNESS = 0.18;

const PLAYER_HEIGHT = 1.63;
const PLAYER_RADIUS = 0.32;

const WALK_SPEED = 3.15;
const SPRINT_SPEED = 5.6;

const MONSTER_SPEED = 2.15;

const WALL_REMOVE_CHANCE = 0.42;


/* ============================================================
   UI
============================================================ */

const intro =
    document.getElementById("intro");

const enterButton =
    document.getElementById("enterButton");

const hud =
    document.getElementById("hud");

const staminaInner =
    document.getElementById("staminaInner");

const pauseText =
    document.getElementById("pauseText");

const danger =
    document.getElementById("danger");

const endScreen =
    document.getElementById("endScreen");

const endTitle =
    document.getElementById("endTitle");

const endSub =
    document.getElementById("endSub");

const restartButton =
    document.getElementById("restartButton");


/* ============================================================
   SCENE
============================================================ */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x5d582d);


scene.fog =
    new THREE.Fog(
        0x645f32,
        14,
        52
    );


const camera =
    new THREE.PerspectiveCamera(
        72,
        window.innerWidth /
        window.innerHeight,
        0.08,
        160
    );


camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.75
    )
);


renderer.outputEncoding =
    THREE.sRGBEncoding;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    0.78;


document.body.insertBefore(
    renderer.domElement,
    document.body.firstChild
);


/* ============================================================
   TEXTURE GENERATORS
============================================================ */

function makeWallpaperTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#b5aa58";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    /* vertical pattern */

    for (
        let x = 0;
        x < 256;
        x += 32
    ) {

        ctx.fillStyle =
            "rgba(74,68,29,0.17)";

        ctx.fillRect(
            x,
            0,
            2,
            256
        );


        for (
            let y = 0;
            y < 256;
            y += 32
        ) {

            ctx.strokeStyle =
                "rgba(87,80,34,0.22)";

            ctx.lineWidth = 2;


            ctx.beginPath();

            ctx.moveTo(
                x + 9,
                y + 22
            );

            ctx.lineTo(
                x + 16,
                y + 8
            );

            ctx.lineTo(
                x + 23,
                y + 22
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                x + 11,
                y + 26
            );

            ctx.lineTo(
                x + 16,
                y + 17
            );

            ctx.lineTo(
                x + 21,
                y + 26
            );

            ctx.stroke();

        }

    }


    /* stains/noise */

    for (
        let i = 0;
        i < 3500;
        i++
    ) {

        const brightness =
            Math.random() > 0.5
                ? 255
                : 0;


        ctx.fillStyle =
            `rgba(${brightness},${brightness},${brightness},${Math.random() * 0.025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(canvas);


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1.8,
        1.8
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;
}


function makeCarpetTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#625b38";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let i = 0;
        i < 18000;
        i++
    ) {

        const v =
            65 +
            Math.floor(
                Math.random() * 45
            );


        ctx.fillStyle =
            `rgba(${v},${v - 6},${v - 27},0.13)`;


        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;


        ctx.fillRect(
            x,
            y,
            Math.random() * 2 + 0.4,
            Math.random() * 4 + 0.5
        );

    }


    /* darker stains */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;


        const radius =
            Math.random() * 20 + 5;


        const grad =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                radius
            );


        grad.addColorStop(
            0,
            "rgba(30,25,14,0.09)"
        );


        grad.addColorStop(
            1,
            "rgba(30,25,14,0)"
        );


        ctx.fillStyle =
            grad;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    const texture =
        new THREE.CanvasTexture(canvas);


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        28,
        28
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;
}


function makeCeilingTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#aba46f";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    ctx.strokeStyle =
        "rgba(66,61,40,0.48)";

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.moveTo(
        128,
        0
    );

    ctx.lineTo(
        128,
        256
    );

    ctx.moveTo(
        0,
        128
    );

    ctx.lineTo(
        256,
        128
    );

    ctx.stroke();


    for (
        let i = 0;
        i < 2200;
        i++
    ) {

        ctx.fillStyle =
            `rgba(0,0,0,${Math.random() * 0.025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(canvas);


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        GRID_WIDTH * 1.6,
        GRID_HEIGHT * 1.6
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;
}


/* ============================================================
   MATERIALS
============================================================ */

const wallpaperTexture =
    makeWallpaperTexture();


const carpetTexture =
    makeCarpetTexture();


const ceilingTexture =
    makeCeilingTexture();


const wallMaterial =
    new THREE.MeshStandardMaterial({

        map: wallpaperTexture,

        color: 0xc0b65d,

        roughness: 0.92,

        metalness: 0

    });


const floorMaterial =
    new THREE.MeshStandardMaterial({

        map: carpetTexture,

        color: 0x82794b,

        roughness: 1,

        metalness: 0

    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        map: ceilingTexture,

        color: 0xbdb576,

        roughness: 0.96

    });


const trimMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x7b713f,

        roughness: 0.9

    });


const lightPanelMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xffffd1,

        emissive: 0xffef9a,

        emissiveIntensity: 1.4,

        roughness: 0.4

    });


/* ============================================================
   MAZE DATA
============================================================ */

const maze = [];


for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
) {

    maze[y] = [];


    for (
        let x = 0;
        x < GRID_WIDTH;
        x++
    ) {

        maze[y][x] = {

            visited: false,

            walls: {

                north: true,
                south: true,
                east: true,
                west: true

            }

        };

    }

}


/* ============================================================
   MAZE GENERATION
============================================================ */

function generateMaze() {

    const stack = [];


    let current = {

        x: 0,
        y: 0

    };


    maze[0][0].visited =
        true;


    let visited = 1;


    const total =
        GRID_WIDTH *
        GRID_HEIGHT;


    while (
        visited < total
    ) {

        const possibilities =
            [];


        const x =
            current.x;

        const y =
            current.y;


        if (
            y > 0 &&
            !maze[y - 1][x].visited
        ) {

            possibilities.push({

                x: x,
                y: y - 1,
                direction: "north"

            });

        }


        if (
            y < GRID_HEIGHT - 1 &&
            !maze[y + 1][x].visited
        ) {

            possibilities.push({

                x: x,
                y: y + 1,
                direction: "south"

            });

        }


        if (
            x < GRID_WIDTH - 1 &&
            !maze[y][x + 1].visited
        ) {

            possibilities.push({

                x: x + 1,
                y: y,
                direction: "east"

            });

        }


        if (
            x > 0 &&
            !maze[y][x - 1].visited
        ) {

            possibilities.push({

                x: x - 1,
                y: y,
                direction: "west"

            });

        }


        if (
            possibilities.length
        ) {

            const next =
                possibilities[
                    Math.floor(
                        Math.random() *
                        possibilities.length
                    )
                ];


            stack.push({

                x: current.x,
                y: current.y

            });


            openBetween(
                current.x,
                current.y,
                next.x,
                next.y
            );


            current = {

                x: next.x,
                y: next.y

            };


            maze[current.y][current.x].visited =
                true;


            visited++;

        }

        else {

            current =
                stack.pop();

        }

    }


    /* ========================================================
       REMOVE EXTRA WALLS

       This is the big difference from a normal maze.

       It creates open rooms and weird Backrooms spaces.
    ======================================================== */

    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            if (
                x < GRID_WIDTH - 1 &&
                Math.random() <
                WALL_REMOVE_CHANCE
            ) {

                maze[y][x].walls.east =
                    false;

                maze[y][x + 1].walls.west =
                    false;

            }


            if (
                y < GRID_HEIGHT - 1 &&
                Math.random() <
                WALL_REMOVE_CHANCE
            ) {

                maze[y][x].walls.south =
                    false;

                maze[y + 1][x].walls.north =
                    false;

            }

        }

    }

}


function openBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    if (
        dx === 1
    ) {

        maze[y1][x1].walls.east =
            false;

        maze[y2][x2].walls.west =
            false;

    }


    else if (
        dx === -1
    ) {

        maze[y1][x1].walls.west =
            false;

        maze[y2][x2].walls.east =
            false;

    }


    else if (
        dy === 1
    ) {

        maze[y1][x1].walls.south =
            false;

        maze[y2][x2].walls.north =
            false;

    }


    else if (
        dy === -1
    ) {

        maze[y1][x1].walls.north =
            false;

        maze[y2][x2].walls.south =
            false;

    }

}


generateMaze();


/* ============================================================
   COORDINATE HELPERS
============================================================ */

function cellWorld(
    x,
    y
) {

    return {

        x:
            (
                x -
                GRID_WIDTH / 2 +
                0.5
            ) *
            CELL,

        z:
            (
                y -
                GRID_HEIGHT / 2 +
                0.5
            ) *
            CELL

    };

}


function worldCell(
    x,
    z
) {

    let cx =
        Math.floor(
            x / CELL +
            GRID_WIDTH / 2
        );


    let cy =
        Math.floor(
            z / CELL +
            GRID_HEIGHT / 2
        );


    cx =
        Math.max(
            0,
            Math.min(
                GRID_WIDTH - 1,
                cx
            )
        );


    cy =
        Math.max(
            0,
            Math.min(
                GRID_HEIGHT - 1,
                cy
            )
        );


    return {

        x: cx,
        y: cy

    };

}


/* ============================================================
   FLOOR + CEILING
============================================================ */

const worldWidth =
    GRID_WIDTH *
    CELL;


const worldDepth =
    GRID_HEIGHT *
    CELL;


const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            worldWidth,
            worldDepth
        ),

        floorMaterial

    );


floor.rotation.x =
    -Math.PI / 2;


scene.add(
    floor
);


const ceiling =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            worldWidth,
            worldDepth
        ),

        ceilingMaterial

    );


ceiling.rotation.x =
    Math.PI / 2;


ceiling.position.y =
    WALL_HEIGHT;


scene.add(
    ceiling
);


/* ============================================================
   WALL COLLISION DATA
============================================================ */

const collisionWalls =
    [];


/* ============================================================
   WALL CREATOR
============================================================ */

function createWall(
    x,
    z,
    width,
    depth
) {

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                WALL_HEIGHT,
                depth
            ),

            wallMaterial

        );


    wall.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );


    scene.add(
        wall
    );


    collisionWalls.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2

    });


    /* floor trim */

    if (
        width > depth
    ) {

        const trim =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    width,
                    0.15,
                    depth + 0.08
                ),

                trimMaterial

            );


        trim.position.set(
            x,

function getNeighbors(
    x,
    y
) {

    const result =
        [];


    const c =
        maze[y][x];


    if (
        !c.walls.north &&
        y > 0
    ) {

        result.push({

            x: x,
            y: y - 1

        });

    }


    if (
        !c.walls.south &&
        y <
        GRID_HEIGHT - 1
    ) {

        result.push({

            x: x,
            y: y + 1

        });

    }


    if (
        !c.walls.east &&
        x <
        GRID_WIDTH - 1
    ) {

        result.push({

            x: x + 1,
            y: y

        });

    }


    if (
        !c.walls.west &&
        x > 0
    ) {

        result.push({

            x: x - 1,
            y: y

        });

    }


    return result;

}


function findFarthestCell() {

    const queue =
        [{

            x: 0,
            y: 0,
            distance: 0

        }];


    const visited =
        new Set(
            ["0,0"]
        );


    let farthest =
        queue[0];


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.distance >
            farthest.distance
        ) {

            farthest =
                current;

        }


        const neighbors =
            getNeighbors(
                current.x,
                current.y
            );


        for (
            const n of neighbors
        ) {

            const key =
                n.x +
                "," +
                n.y;


            if (
                visited.has(key)
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x: n.x,

                y: n.y,

                distance:
                    current.distance + 1

            });

        }

    }


    return farthest;

}

function circleHitsWall(
    x,
    z
) {

    for (
        const wall of collisionWalls
    ) {

        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )

            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )

            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}


/* ============================================================
   PLAYER MOVEMENT
============================================================ */

function updatePlayer(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {

        return;

    }


    let forward = 0;
    let sideways = 0;


    if (
        keys["KeyW"]
    ) {

        forward += 1;

    }


    if (
        keys["KeyS"]
    ) {

        forward -= 1;

    }


    if (
        keys["KeyD"]
    ) {

        sideways += 1;

    }


    if (
        keys["KeyA"]
    ) {

        sideways -= 1;

    }


    const moving =
        forward !== 0 ||
        sideways !== 0;


    const wantsSprint =

        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        ) &&

        forward > 0 &&

        stamina > 0;


    let speed =
        wantsSprint
            ? SPRINT_SPEED
            : WALK_SPEED;


    if (
        wantsSprint &&
        moving
    ) {

        stamina -=
            delta *
            21;

    }

    else {

        stamina +=
            delta *
            13;

    }


    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );


    staminaInner.style.width =
        stamina +
        "%";


    const targetFov =
        wantsSprint
            ? 77
            : 72;


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) *
        Math.min(
            delta * 7,
            1
        );


    camera.updateProjectionMatrix();


    if (
        !moving
    ) {

        camera.position.y +=
            (
                PLAYER_HEIGHT -
                camera.position.y
            ) *
            Math.min(
                delta * 9,
                1
            );


        return;

    }


    const length =
        Math.sqrt(

            forward * forward +

            sideways * sideways

        );


    forward /=
        length;


    sideways /=
        length;


    const sin =
        Math.sin(yaw);


    const cos =
        Math.cos(yaw);


    const dx =

        (
            -sin *
            forward +

            cos *
            sideways
        ) *

        speed *

        delta;


    const dz =

        (
            -cos *
            forward -

            sin *
            sideways
        ) *

        speed *

        delta;


    const nextX =
        camera.position.x +
        dx;


    if (
        !circleHitsWall(

            nextX,

            camera.position.z

        )
    ) {

        camera.position.x =
            nextX;

    }


    const nextZ =
        camera.position.z +
        dz;


    if (
        !circleHitsWall(

            camera.position.x,

            nextZ

        )
    ) {

        camera.position.z =
            nextZ;

    }


    /* ========================================================
       HEAD BOB
    ======================================================== */

    movementTime +=

        delta *

        (
            wantsSprint
                ? 12
                : 8
        );


    const bobAmount =
        wantsSprint
            ? 0.045
            : 0.028;


    camera.position.y =
        PLAYER_HEIGHT +

        Math.sin(
            movementTime
        ) *

        bobAmount;

}

/* ============================================================
   PATHFINDING
============================================================ */

function findPath(
    start,
    goal
) {

    const queue =
        [{

            x: start.x,

            y: start.y,

            path: []

        }];


    const visited =
        new Set();


    visited.add(

        start.x +
        "," +
        start.y

    );


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.x === goal.x &&
            current.y === goal.y
        ) {

            return current.path;

        }


        const neighbors =
            getNeighbors(

                current.x,

                current.y

            );


        for (
            const n of neighbors
        ) {

            const key =
                n.x +
                "," +
                n.y;


            if (
                visited.has(key)
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x: n.x,

                y: n.y,

                path: [

                    ...current.path,

                    n

                ]

            });

        }

    }


    return [];

}


/* ============================================================
   MONSTER UPDATE
============================================================ */

function updateMonster(
    delta
) {

    monsterActiveTimer -=
        delta;


    if (
        monsterActiveTimer > 0
    ) {

        return;

    }


    const playerCell =
        worldCell(

            camera.position.x,

            camera.position.z

        );


    const monsterCell =
        worldCell(

            monster.position.x,

            monster.position.z

        );


    monsterPathTimer -=
        delta;


    if (
        monsterPathTimer <= 0
    ) {

        monsterPathTimer =
            0.55;


        monsterPath =
            findPath(

                monsterCell,

                playerCell

            );

    }


    if (
        monsterPath.length
    ) {

        const next =
            monsterPath[0];


        const target =
            cellWorld(

                next.x,

                next.y

            );


        const dx =
            target.x -
            monster.position.x;


        const dz =
            target.z -
            monster.position.z;


        const distance =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        if (
            distance <
            0.16
        ) {

            monsterPath.shift();

        }

        else {

            const dirX =
                dx /
                distance;


            const dirZ =
                dz /
                distance;


            monster.position.x +=

                dirX *

                MONSTER_SPEED *

                delta;


            monster.position.z +=

                dirZ *

                MONSTER_SPEED *

                delta;


            monster.rotation.y =
                Math.atan2(
                    dirX,
                    dirZ
                ) +
                Math.PI;

        }

    }


    monster.position.y =

        Math.sin(
            performance.now() *
            0.005
        ) *

        0.035;


    const dx =
        monster.position.x -
        camera.position.x;


    const dz =
        monster.position.z -
        camera.position.z;


    const playerDistance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    let dangerStrength =
        0;


    if (
        playerDistance <
        11
    ) {

        dangerStrength =
            1 -
            playerDistance /
            11;

    }


    danger.style.opacity =
        dangerStrength *
        0.53;


    if (
        playerDistance <
        0.95
    ) {

        loseGame();

    }

}

    audioContext =

        new (
            window.AudioContext ||
            window.webkitAudioContext

    const master =
        audioContext.createGain();


    master.gain.value =
        0.04;


    master.connect(
        audioContext.destination
    );


    const hum1 =
        audioContext.createOscillator();


    const humGain1 =
        audioContext.createGain();


    hum1.type =
        "sine";


    hum1.frequency.value =
        60;


    humGain1.gain.value =
        0.35;


    hum1.connect(
        humGain1
    );


    humGain1.connect(
        master
    );


    hum1.start();


    const hum2 =
        audioContext.createOscillator();


    const humGain2 =
        audioContext.createGain();


    hum2.type =
        "sine";


    hum2.frequency.value =
        119.7;


    humGain2.gain.value =
        0.12;


    hum2.connect(
        humGain2
    );


    humGain2.connect(
        master
    );


    hum2.start();

}

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (
        started &&
        !gameOver
    ) {

        updatePlayer(
            delta
        );


        updateMonster(
            delta
        );


        updateLights(
            delta
        );


        checkExit();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
