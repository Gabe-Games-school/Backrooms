<style>

<body>
<div id="startScreen"><div id="startContent"><h1 id="title">THE BACKROOMS</h1><div id="subtitle">It was supposed to be a normal night.<br>You stayed at the office a little too late.</div><div id="controlsText">WASD = MOVE<br>SHIFT = SPRINT<br>MOUSE = LOOK</div><button id="startButton">BEGIN</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const GRID_WIDTH=16,GRID_HEIGHT=16,CELL=6,WALL_HEIGHT=3.7,WALL_THICKNESS=.18,PLAYER_HEIGHT=1.66,PLAYER_RADIUS=.32,WALK_SPEED=3.1,SPRINT_SPEED=5.45,MONSTER_SPEED=2.05,EXTRA_WALL_REMOVAL=.42;
const startScreen=document.getElementById('startScreen'),startButton=document.getElementById('startButton'),topBar=document.getElementById('topBar'),bottomBar=document.getElementById('bottomBar'),cutsceneCaption=document.getElementById('cutsceneCaption'),fadeLayer=document.getElementById('fadeLayer'),wakeScreen=document.getElementById('wakeScreen'),wakeButton=document.getElementById('wakeButton'),hud=document.getElementById('hud'),staminaInner=document.getElementById('staminaInner'),pauseText=document.getElementById('pauseText'),danger=document.getElementById('danger'),endScreen=document.getElementById('endScreen'),endTitle=document.getElementById('endTitle'),endSub=document.getElementById('endSub'),restartButton=document.getElementById('restartButton');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,.08,220);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.7));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.78;document.body.insertBefore(renderer.domElement,document.body.firstChild);
const officeGroup=new THREE.Group(),backroomsGroup=new THREE.Group();scene.add(officeGroup);scene.add(backroomsGroup);backroomsGroup.visible=false;
function setOfficeAtmosphere(){scene.background=new THREE.Color(0x23272d);scene.fog=new THREE.Fog(0x23272d,12,42)}
function setBackroomsAtmosphere(){scene.background=new THREE.Color(0x5b572d);scene.fog=new THREE.Fog(0x625d34,12,56)}
function makeWallpaperTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#b4aa4f';x.fillRect(0,0,256,256);for(let i=0;i<256;i+=32){x.fillStyle='rgba(60,55,18,.14)';x.fillRect(i,0,2,256);for(let j=0;j<256;j+=32){x.strokeStyle='rgba(66,60,22,.23)';x.lineWidth=2;x.beginPath();x.moveTo(i+9,j+22);x.lineTo(i+16,j+9);x.lineTo(i+23,j+22);x.stroke();x.beginPath();x.moveTo(i+11,j+27);x.lineTo(i+16,j+18);x.lineTo(i+21,j+27);x.stroke()}}for(let i=0;i<3500;i++){const v=Math.random()>.5?255:0;x.fillStyle=`rgba(${v},${v},${v},${Math.random()*.025})`;x.fillRect(Math.random()*256,Math.random()*256,1,1)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.8,1.8);t.encoding=THREE.sRGBEncoding;return t}
function makeCarpetTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#4e482d';x.fillRect(0,0,256,256);for(let i=0;i<18000;i++){const v=60+Math.floor(Math.random()*50);x.fillStyle=`rgba(${v},${v-8},${v-28},.14)`;x.fillRect(Math.random()*256,Math.random()*256,Math.random()*2+.2,Math.random()*4+.4)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(28,28);t.encoding=THREE.sRGBEncoding;return t}
function makeCeilingTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#a59e67';x.fillRect(0,0,256,256);x.strokeStyle='rgba(42,38,20,.55)';x.lineWidth=3;x.beginPath();x.moveTo(128,0);x.lineTo(128,256);x.moveTo(0,128);x.lineTo(256,128);x.stroke();const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(GRID_WIDTH*1.5,GRID_HEIGHT*1.5);t.encoding=THREE.sRGBEncoding;return t}
function makeMonsterSkinTexture(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#8e8172';x.fillRect(0,0,512,512);for(let i=0;i<1200;i++){const px=Math.random()*512,py=Math.random()*512,r=3+Math.random()*20,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(${80+Math.random()*70},${60+Math.random()*50},${50+Math.random()*40},${.04+Math.random()*.10})`);g.addColorStop(1,'rgba(40,30,25,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}for(let i=0;i<45000;i++){const v=Math.floor(Math.random()*65);x.fillStyle=`rgba(${v},${v},${v},${Math.random()*.045})`;x.fillRect(Math.random()*512,Math.random()*512,1,1)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.2,1.2);t.encoding=THREE.sRGBEncoding;return t}
function makeMonsterBodyTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#121110';x.fillRect(0,0,256,256);for(let i=0;i<18000;i++){const v=10+Math.floor(Math.random()*32);x.fillStyle=`rgba(${v},${v},${v},${Math.random()*.12})`;x.fillRect(Math.random()*256,Math.random()*256,Math.random()*3+.5,Math.random()*5+.5)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,3);t.encoding=THREE.sRGBEncoding;return t}
const officeLights=[];
function buildOffice(){const fm=new THREE.MeshStandardMaterial({color:0x4a4d51,roughness:1}),wm=new THREE.MeshStandardMaterial({color:0xd4d1c9,roughness:.95}),cm=new THREE.MeshStandardMaterial({color:0xcfcbbf,roughness:.92}),dm=new THREE.MeshStandardMaterial({color:0x5a564d,roughness:.9});const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,56),fm);floor.rotation.x=-Math.PI/2;officeGroup.add(floor);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(12,56),cm);ceiling.rotation.x=Math.PI/2;ceiling.position.y=3.4;officeGroup.add(ceiling);const lw=new THREE.Mesh(new THREE.BoxGeometry(.22,3.4,56),wm);lw.position.set(-6,1.7,0);officeGroup.add(lw);const rw=lw.clone();rw.position.x=6;officeGroup.add(rw);const fw=new THREE.Mesh(new THREE.BoxGeometry(12,3.4,.22),wm);fw.position.set(0,1.7,-27.9);officeGroup.add(fw);for(let z=-22;z<=16;z+=7){const ld=new THREE.Mesh(new THREE.BoxGeometry(.08,2.4,1.25),dm);ld.position.set(-5.88,1.2,z);officeGroup.add(ld);const rd=ld.clone();rd.position.x=5.88;officeGroup.add(rd)}officeGroup.add(new THREE.AmbientLight(0xc7cbcf,.5));for(let z=-22;z<=22;z+=6){const p=new THREE.Mesh(new THREE.BoxGeometry(2.2,.04,.6),new THREE.MeshBasicMaterial({color:0xf0eedf}));p.position.set(0,3.28,z);officeGroup.add(p);const l=new THREE.PointLight(0xe9e8d8,.8,10,1.6);l.position.set(0,3,z);officeGroup.add(l);officeLights.push(l)}}
const wallMaterial=new THREE.MeshStandardMaterial({map:makeWallpaperTexture(),color:0xbfb45a,roughness:.95}),floorMaterial=new THREE.MeshStandardMaterial({map:makeCarpetTexture(),color:0x756f45,roughness:1}),ceilingMaterial=new THREE.MeshStandardMaterial({map:makeCeilingTexture(),color:0xb1a96c,roughness:1}),trimMaterial=new THREE.MeshStandardMaterial({color:0x91884a,roughness:.9}),lightPanelMaterial=new THREE.MeshStandardMaterial({color:0xffffd2,emissive:0xffef98,emissiveIntensity:1.4});
const maze=[];for(let y=0;y<GRID_HEIGHT;y++){maze[y]=[];for(let x=0;x<GRID_WIDTH;x++)maze[y][x]={visited:false,walls:{north:true,south:true,east:true,west:true}}}
function openBetween(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;if(dx===1){maze[y1][x1].walls.east=false;maze[y2][x2].walls.west=false}else if(dx===-1){maze[y1][x1].walls.west=false;maze[y2][x2].walls.east=false}else if(dy===1){maze[y1][x1].walls.south=false;maze[y2][x2].walls.north=false}else if(dy===-1){maze[y1][x1].walls.north=false;maze[y2][x2].walls.south=false}}
function generateMaze(){const stack=[];let current={x:0,y:0};maze[0][0].visited=true;let count=1,total=GRID_WIDTH*GRID_HEIGHT;while(count<total){const o=[],x=current.x,y=current.y;if(y>0&&!maze[y-1][x].visited)o.push({x,y:y-1});if(y<GRID_HEIGHT-1&&!maze[y+1][x].visited)o.push({x,y:y+1});if(x>0&&!maze[y][x-1].visited)o.push({x:x-1,y});if(x<GRID_WIDTH-1&&!maze[y][x+1].visited)o.push({x:x+1,y});if(o.length){const n=o[Math.floor(Math.random()*o.length)];stack.push({x,y});openBetween(x,y,n.x,n.y);current=n;maze[current.y][current.x].visited=true;count++}else current=stack.pop()}for(let y=0;y<GRID_HEIGHT;y++)for(let x=0;x<GRID_WIDTH;x++){if(x<GRID_WIDTH-1&&Math.random()<EXTRA_WALL_REMOVAL){maze[y][x].walls.east=false;maze[y][x+1].walls.west=false}if(y<GRID_HEIGHT-1&&Math.random()<EXTRA_WALL_REMOVAL){maze[y][x].walls.south=false;maze[y+1][x].walls.north=false}}}
function cellToWorld(x,y){return{x:(x-GRID_WIDTH/2+.5)*CELL,z:(y-GRID_HEIGHT/2+.5)*CELL}}function worldToCell(x,z){let cx=Math.floor(x/CELL+GRID_WIDTH/2),cy=Math.floor(z/CELL+GRID_HEIGHT/2);cx=Math.max(0,Math.min(GRID_WIDTH-1,cx));cy=Math.max(0,Math.min(GRID_HEIGHT-1,cy));return{x:cx,y:cy}}
const collisionWalls=[],fluorescentLights=[];
function createWall(x,z,w,d){const wall=new THREE.Mesh(new THREE.BoxGeometry(w,WALL_HEIGHT,d),wallMaterial);wall.position.set(x,WALL_HEIGHT/2,z);backroomsGroup.add(wall);const trim=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d+.04),trimMaterial);trim.position.set(x,.06,z);backroomsGroup.add(trim);collisionWalls.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2})}
function createColumn(x,z){const c=new THREE.Mesh(new THREE.BoxGeometry(.72,WALL_HEIGHT,.72),wallMaterial);c.position.set(x,WALL_HEIGHT/2,z);backroomsGroup.add(c);collisionWalls.push({minX:x-.36,maxX:x+.36,minZ:z-.36,maxZ:z+.36})}
function createFluorescent(x,z,r){const f=new THREE.Mesh(new THREE.BoxGeometry(2.15,.09,.62),new THREE.MeshStandardMaterial({color:0x666043,roughness:.8}));f.position.set(x,WALL_HEIGHT-.05,z);f.rotation.y=r;backroomsGroup.add(f);const p=new THREE.Mesh(new THREE.BoxGeometry(1.9,.04,.42),lightPanelMaterial);p.position.set(x,WALL_HEIGHT-.12,z);p.rotation.y=r;backroomsGroup.add(p);const l=new THREE.PointLight(0xffe98d,.7,13,1.5);l.position.set(x,WALL_HEIGHT-.45,z);backroomsGroup.add(l);fluorescentLights.push(l)}
function getNeighbors(x,y){const c=maze[y][x],n=[];if(!c.walls.north&&y>0)n.push({x,y:y-1});if(!c.walls.south&&y<GRID_HEIGHT-1)n.push({x,y:y+1});if(!c.walls.east&&x<GRID_WIDTH-1)n.push({x:x+1,y});if(!c.walls.west&&x>0)n.push({x:x-1,y});return n}
function findFarthestCell(){const q=[{x:0,y:0,distance:0}],v=new Set(['0,0']);let far=q[0];while(q.length){const c=q.shift();if(c.distance>far.distance)far=c;for(const n of getNeighbors(c.x,c.y)){const k=`${n.x},${n.y}`;if(v.has(k))continue;v.add(k);q.push({x:n.x,y:n.y,distance:c.distance+1})}}return far}
function buildBackrooms(){generateMaze();const ww=GRID_WIDTH*CELL,wd=GRID_HEIGHT*CELL;const floor=new THREE.Mesh(new THREE.PlaneGeometry(ww,wd),floorMaterial);floor.rotation.x=-Math.PI/2;backroomsGroup.add(floor);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(ww,wd),ceilingMaterial);ceiling.rotation.x=Math.PI/2;ceiling.position.y=WALL_HEIGHT;backroomsGroup.add(ceiling);for(let y=0;y<GRID_HEIGHT;y++)for(let x=0;x<GRID_WIDTH;x++){const c=maze[y][x],p=cellToWorld(x,y);if(c.walls.north)createWall(p.x,p.z-CELL/2,CELL+WALL_THICKNESS,WALL_THICKNESS);if(c.walls.west)createWall(p.x-CELL/2,p.z,WALL_THICKNESS,CELL+WALL_THICKNESS);if(y===GRID_HEIGHT-1&&c.walls.south)createWall(p.x,p.z+CELL/2,CELL+WALL_THICKNESS,WALL_THICKNESS);if(x===GRID_WIDTH-1&&c.walls.east)createWall(p.x+CELL/2,p.z,WALL_THICKNESS,CELL+WALL_THICKNESS)}for(let y=1;y<GRID_HEIGHT-1;y+=2)for(let x=1;x<GRID_WIDTH-1;x+=2)if(Math.random()<.24){const p=cellToWorld(x,y);createColumn(p.x+CELL/2,p.z+CELL/2)}backroomsGroup.add(new THREE.HemisphereLight(0xbeb46a,0x27230f,.58));backroomsGroup.add(new THREE.AmbientLight(0x5d5628,.5));for(let y=0;y<GRID_HEIGHT;y+=3)for(let x=0;x<GRID_WIDTH;x+=3){const p=cellToWorld(x,y);createFluorescent(p.x,p.z,Math.random()>.5?0:Math.PI/2)}}
buildOffice();buildBackrooms();
const exitCell=findFarthestCell(),exitWorld=cellToWorld(exitCell.x,exitCell.y),exitGroup=new THREE.Group();const exitFrame=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.8,.18),new THREE.MeshStandardMaterial({color:0x3f3926,roughness:.9}));exitFrame.position.y=1.4;exitGroup.add(exitFrame);const exitDoor=new THREE.Mesh(new THREE.BoxGeometry(1.42,2.5,.22),new THREE.MeshStandardMaterial({color:0x31412c,emissive:0x091509,roughness:.85}));exitDoor.position.y=1.26;exitGroup.add(exitDoor);const exitLight=new THREE.PointLight(0x88ff72,1.6,8);exitLight.position.set(0,1.7,.5);exitGroup.add(exitLight);exitGroup.position.set(exitWorld.x,0,exitWorld.z);backroomsGroup.add(exitGroup);
const playerStart=cellToWorld(0,0);let yaw=Math.PI,pitch=0,stamina=100,movementTime=0;const keys={};
/* ===== MONSTER: custom low-poly mesh, not stretched spheres ===== */
const monsterSkinMaterial=new THREE.MeshStandardMaterial({map:makeMonsterSkinTexture(),color:0xb1a38f,roughness:.98,metalness:0,flatShading:false});
const monsterBodyMaterial=new THREE.MeshStandardMaterial({map:makeMonsterBodyTexture(),color:0x1d1d1b,roughness:1,metalness:0,flatShading:false});
const monsterDarkMaterial=new THREE.MeshStandardMaterial({color:0x020202,roughness:1});
function makeRingMesh(rings,segments=10,material=null){const verts=[],idx=[];for(let r=0;r<rings.length;r++){const ring=rings[r];for(let s=0;s<segments;s++){const a=(s/segments)*Math.PI*2;let x=Math.cos(a)*ring.rx;let z=Math.sin(a)*ring.rz;let y=ring.y;if(ring.frontFlatten&&Math.sin(a)<-.2)z*=ring.frontFlatten;if(ring.frontPush&&Math.sin(a)<-.35)z-=ring.frontPush;if(ring.asym&&Math.cos(a)<0)x*=ring.asym;verts.push(x,y,z)}}for(let r=0;r<rings.length-1;r++){for(let s=0;s<segments;s++){const n=(s+1)%segments,a=r*segments+s,b=r*segments+n,c=(r+1)*segments+s,d=(r+1)*segments+n;idx.push(a,c,b,b,c,d)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();return new THREE.Mesh(g,material)}
function makeTaperedPrism(topW,bottomW,h,depth,material){const verts=[-topW/2,h/2,-depth/2, topW/2,h/2,-depth/2, topW/2,h/2,depth/2, -topW/2,h/2,depth/2, -bottomW/2,-h/2,-depth/2, bottomW/2,-h/2,-depth/2, bottomW/2,-h/2,depth/2, -bottomW/2,-h/2,depth/2];const id=[0,4,1,1,4,5,1,5,2,2,5,6,2,6,3,3,6,7,3,7,0,0,7,4,0,1,2,0,2,3,4,7,6,4,6,5];const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(id);g.computeVertexNormals();return new THREE.Mesh(g,material)}
const monster=new THREE.Group(),monsterRig=new THREE.Group();monster.add(monsterRig);backroomsGroup.add(monster);
const monsterShadow=new THREE.Mesh(new THREE.CircleGeometry(.52,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.27}));monsterShadow.rotation.x=-Math.PI/2;monsterShadow.position.y=.012;monster.add(monsterShadow);
/* torso rings: shoulders -> ribs -> waist -> hips */

function createLimb(x,y,upperLen,lowerLen,upperW,lowerW,lowerMaterial){const upPivot=new THREE.Group();upPivot.position.set(x,y,0);monsterRig.add(upPivot);const upper=makeTaperedPrism(upperW,upperW*.72,upperLen,.105,monsterBodyMaterial);upper.position.y=-upperLen/2;upPivot.add(upper);const loPivot=new THREE.Group();loPivot.position.y=-upperLen;upPivot.add(loPivot);const lower=makeTaperedPrism(lowerW,lowerW*.72,lowerLen,.09,lowerMaterial);lower.position.y=-lowerLen/2;loPivot.add(lower);return{upperPivot:upPivot,lowerPivot:loPivot}}

function createHand(mirror){const g=new THREE.Group();const palm=makeTaperedPrism(.075,.060,.16,.055,monsterSkinMaterial);palm.position.y=-.08;g.add(palm);for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(.013,.11+i*.006,.015),monsterSkinMaterial);f.position.set((i-1)*.021,-.19,0);g.add(f)}const th=new THREE.Mesh(new THREE.BoxGeometry(.015,.085,.018),monsterSkinMaterial);th.position.set(.047*mirror,-.12,0);th.rotation.z=-.42*mirror;g.add(th);return g}
const lh=createHand(-1);lh.position.y=-.92;leftArm.lowerPivot.add(lh);const rh=createHand(1);rh.position.y=-.94;rightArm.lowerPivot.add(rh);
const leftLeg=createLimb(-.11,1.12,.64,.70,.13,.09,monsterBodyMaterial),rightLeg=createLimb(.11,1.12,.65,.69,.13,.09,monsterBodyMaterial);
const lf=makeTaperedPrism(.13,.15,.10,.30,monsterBodyMaterial);lf.rotation.x=Math.PI/2;lf.position.set(0,-.70,.09);leftLeg.lowerPivot.add(lf);const rf=makeTaperedPrism(.13,.15,.10,.30,monsterBodyMaterial);rf.rotation.x=Math.PI/2;rf.position.set(0,-.69,.09);rightLeg.lowerPivot.add(rf);
monsterRig.rotation.x=.055;
const monsterSpawn=cellToWorld(Math.floor(GRID_WIDTH*.66),Math.floor(GRID_HEIGHT*.66));monster.position.set(monsterSpawn.x,0,monsterSpawn.z);monster.visible=false;let monsterPath=[],monsterPathTimer=0,monsterActiveTimer=10;
function findPath(start,target){const q=[{x:start.x,y:start.y,path:[]}],v=new Set([`${start.x},${start.y}`]);while(q.length){const c=q.shift();if(c.x===target.x&&c.y===target.y)return c.path;for(const n of getNeighbors(c.x,c.y)){const k=`${n.x},${n.y}`;if(v.has(k))continue;v.add(k);q.push({x:n.x,y:n.y,path:[...c.path,n]})}}return[]}
let mode='title',cutsceneTime=0,cutsceneFinished=false,audioContext=null;
function startAudio(){if(audioContext)return;audioContext=new (window.AudioContext||window.webkitAudioContext)();const master=audioContext.createGain();master.gain.value=.027;master.connect(audioContext.destination);const hum=audioContext.createOscillator();hum.type='sine';hum.frequency.value=60;hum.connect(master);hum.start();const high=audioContext.createOscillator(),hg=audioContext.createGain();high.type='sine';high.frequency.value=119.6;hg.gain.value=.18;high.connect(hg);hg.connect(master);high.start()}
function setOfficePreviewCamera(){camera.position.set(0,1.72,13);camera.rotation.set(0,0,0)}
function beginCutscene(){startAudio();mode='cutscene';cutsceneTime=0;cutsceneFinished=false;startScreen.style.display='none';topBar.style.display='block';bottomBar.style.display='block';cutsceneCaption.style.opacity='1';officeGroup.visible=true;backroomsGroup.visible=false;setOfficeAtmosphere();camera.position.set(0,1.72,14);camera.rotation.set(0,0,0)}
function updateCutscene(delta){cutsceneTime+=delta;if(cutsceneTime<3.8){camera.position.z=14-cutsceneTime*2.5;camera.position.y=1.72+Math.sin(cutsceneTime*8)*.02;camera.rotation.x=Math.sin(cutsceneTime*1.4)*.006;camera.rotation.z=0;if(cutsceneTime>2.1)cutsceneCaption.style.opacity='0'}if(cutsceneTime>3.3&&cutsceneTime<4.25){if(Math.random()<.35){const l=officeLights[Math.floor(Math.random()*officeLights.length)];if(l){const o=l.intensity;l.intensity=Math.random()<.5?.05:.65;setTimeout(()=>l.intensity=o,50)}}camera.rotation.z=(Math.random()-.5)*.008}if(cutsceneTime>=4.25&&cutsceneTime<5.05){const f=(cutsceneTime-4.25)/.8;camera.position.y=1.72-f*5.3;camera.rotation.x=f*.9;camera.rotation.z=f*.15;fadeLayer.style.opacity=String(Math.min(1,f*1.4))}if(cutsceneTime>=5.05&&!cutsceneFinished){cutsceneFinished=true;setTimeout(wakeInBackrooms,600)}}
function wakeInBackrooms(){mode='wake';officeGroup.visible=false;backroomsGroup.visible=true;setBackroomsAtmosphere();topBar.style.display='none';bottomBar.style.display='none';cutsceneCaption.style.opacity='0';camera.position.set(playerStart.x,.58,playerStart.z);yaw=Math.PI;pitch=.28;camera.rotation.set(pitch,yaw,0);wakeScreen.style.display='flex';setTimeout(()=>fadeLayer.style.opacity='0',40)}
function startPlaying(){mode='playing';wakeScreen.style.display='none';hud.style.display='block';camera.position.y=PLAYER_HEIGHT;pitch=0;camera.rotation.set(0,yaw,0);renderer.domElement.requestPointerLock()}
document.addEventListener('keydown',e=>keys[e.code]=true);document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement||mode!=='playing')return;const s=.0019;yaw-=e.movementX*s;pitch-=e.movementY*s;pitch=Math.max(-1.42,Math.min(1.42,pitch));camera.rotation.y=yaw;camera.rotation.x=pitch;camera.rotation.z=0});
function hitsWall(x,z){for(const w of collisionWalls){const cx=Math.max(w.minX,Math.min(x,w.maxX)),cz=Math.max(w.minZ,Math.min(z,w.maxZ)),dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<PLAYER_RADIUS*PLAYER_RADIUS)return true}return false}
function updatePlayer(delta){if(document.pointerLockElement!==renderer.domElement)return;let f=0,s=0;if(keys.KeyW)f++;if(keys.KeyS)f--;if(keys.KeyD)s++;if(keys.KeyA)s--;const moving=f!==0||s!==0,sprinting=moving&&f>0&&stamina>0&&(keys.ShiftLeft||keys.ShiftRight),speed=sprinting?SPRINT_SPEED:WALK_SPEED;if(sprinting)stamina-=delta*21;else stamina+=delta*13;stamina=Math.max(0,Math.min(100,stamina));staminaInner.style.width=stamina+'%';const tf=sprinting?77:72;camera.fov+=(tf-camera.fov)*Math.min(delta*7,1);camera.updateProjectionMatrix();camera.rotation.z=0;if(!moving){camera.position.y+=(PLAYER_HEIGHT-camera.position.y)*Math.min(delta*8,1);return}const len=Math.sqrt(f*f+s*s);f/=len;s/=len;const sin=Math.sin(yaw),cos=Math.cos(yaw),dx=(-sin*f+cos*s)*speed*delta,dz=(-cos*f-sin*s)*speed*delta,nx=camera.position.x+dx,nz=camera.position.z+dz;if(!hitsWall(nx,camera.position.z))camera.position.x=nx;if(!hitsWall(camera.position.x,nz))camera.position.z=nz;movementTime+=delta*(sprinting?12:8);camera.position.y=PLAYER_HEIGHT+Math.sin(movementTime)*(sprinting?.045:.027)}
function updateMonster(delta){monsterActiveTimer-=delta;if(monsterActiveTimer>0)return;monster.visible=true;const pc=worldToCell(camera.position.x,camera.position.z),mc=worldToCell(monster.position.x,monster.position.z);monsterPathTimer-=delta;if(monsterPathTimer<=0){monsterPathTimer=.45;monsterPath=findPath(mc,pc)}let moving=false;if(monsterPath.length){const n=monsterPath[0],t=cellToWorld(n.x,n.y),dx=t.x-monster.position.x,dz=t.z-monster.position.z,dist=Math.sqrt(dx*dx+dz*dz);if(dist<.13)monsterPath.shift();else{moving=true;const x=dx/dist,z=dz/dist;monster.position.x+=x*MONSTER_SPEED*delta;monster.position.z+=z*MONSTER_SPEED*delta;monster.rotation.y=Math.atan2(x,z)+Math.PI}}const time=performance.now()*.001,walk=Math.sin(time*6)*(moving?1:.02);monsterRig.position.y=Math.sin(time*2.9)*.006;monsterRig.rotation.z=Math.sin(time*.65)*.006;monsterRig.rotation.x=.055+Math.sin(time*.7)*.004;leftLeg.upperPivot.rotation.x=-walk*.22;rightLeg.upperPivot.rotation.x=walk*.22;leftLeg.lowerPivot.rotation.x=Math.max(0,walk)*.13;rightLeg.lowerPivot.rotation.x=Math.max(0,-walk)*.13;leftArm.upperPivot.rotation.x=.04+walk*.17;rightArm.upperPivot.rotation.x=.03-walk*.19;leftArm.lowerPivot.rotation.x=-.04+Math.max(0,-walk)*.07;rightArm.lowerPivot.rotation.x=-.03+Math.max(0,walk)*.07;monsterHeadPivot.rotation.z=Math.sin(time*.55)*.014;monsterHeadPivot.rotation.x=-.025+Math.sin(time*.42)*.008;monsterHeadPivot.rotation.y=Math.sin(time*.31)*.014;const twitch=Math.pow(Math.max(0,Math.sin(time*.79)),46);monsterHeadPivot.rotation.y+=twitch*.09;const dx=monster.position.x-camera.position.x,dz=monster.position.z-camera.position.z,pd=Math.sqrt(dx*dx+dz*dz);let da=0;if(pd<12)da=1-pd/12;danger.style.opacity=String(da*.53);if(pd<.92)loseGame()}
let flickerTimer=0;function updateLights(delta){flickerTimer-=delta;if(flickerTimer>0)return;flickerTimer=.1+Math.random()*1.7;if(Math.random()>.22)return;const l=fluorescentLights[Math.floor(Math.random()*fluorescentLights.length)];if(!l)return;const o=l.intensity;l.intensity=.02;setTimeout(()=>l.intensity=o,50+Math.random()*100)}
function checkExit(){const dx=camera.position.x-exitGroup.position.x,dz=camera.position.z-exitGroup.position.z;if(dx*dx+dz*dz<2.2)winGame()}
function winGame(){if(mode==='end')return;mode='end';document.exitPointerLock();hud.style.display='none';endScreen.style.display='flex';endTitle.textContent='YOU ESCAPED';endTitle.style.color='#d9ffc7';endSub.textContent='At least... you think you did.'}
function loseGame(){if(mode==='end')return;mode='end';document.exitPointerLock();danger.style.opacity='.85';setTimeout(()=>{hud.style.display='none';endScreen.style.display='flex';endTitle.textContent='YOU WERE FOUND';endTitle.style.color='#912727';endSub.textContent='Something almost human was wandering the halls.'},280)}
startButton.addEventListener('click',beginCutscene);wakeButton.addEventListener('click',startPlaying);restartButton.addEventListener('click',()=>location.reload());renderer.domElement.addEventListener('click',()=>{if(mode==='playing'&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>{if(mode!=='playing')return;pauseText.style.display=document.pointerLockElement===renderer.domElement?'none':'block'});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});

const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const delta=Math.min(clock.getDelta(),.05);if(mode==='title'){camera.position.x=Math.sin(performance.now()*.00035)*.12;camera.position.y=1.72+Math.sin(performance.now()*.001)*.01;camera.rotation.set(0,Math.sin(performance.now()*.00045)*.02,0)}if(mode==='cutscene')updateCutscene(delta);if(mode==='playing'){updatePlayer(delta);updateMonster(delta);updateLights(delta);checkExit()}renderer.render(scene,camera)}animate();
