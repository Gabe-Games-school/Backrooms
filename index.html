<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Backrooms</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

canvas {
    display: block;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.68) 0%,
            rgba(0,0,0,0.28) 35%,
            rgba(0,0,0,0) 65%
        );
}

#startContent {
    position: absolute;

    top: 34px;
    left: 34px;

    max-width: 520px;

    pointer-events: auto;
}

#title {
    margin: 0;

    font-size:
        clamp(
            42px,
            6vw,
            92px
        );

    font-weight: 300;

    letter-spacing: 12px;

    color: #eee7b0;

    text-shadow:
        0 0 16px rgba(255,240,160,0.18);
}

#subtitle {
    margin-top: 18px;

    color:
        rgba(
            255,
            255,
            255,
            0.78
        );

    line-height: 1.55;

    font-size: 17px;
}

#controlsText {
    margin-top: 18px;

    color:
        rgba(
            255,
            255,
            255,
            0.68
        );

    font-family: monospace;

    letter-spacing: 1px;
}

#startButton,
#wakeButton,
#restartButton {
    margin-top: 22px;

    padding:
        15px
        34px;

    border:
        1px solid
        rgba(
            240,
            232,
            180,
            0.85
        );

    background:
        rgba(
            0,
            0,
            0,
            0.56
        );

    color: white;

    font-size: 16px;

    letter-spacing: 5px;

    cursor: pointer;
}

#startButton:hover,
#wakeButton:hover,
#restartButton:hover {
    background:
        rgba(
            80,
            75,
            42,
            0.68
        );
}

/* =========================================================
   CINEMATIC
========================================================= */

.cinematicBar {
    position: fixed;

    left: 0;

    width: 100%;
    height: 8%;

    background: black;

    z-index: 120;

    display: none;

    pointer-events: none;
}

#topBar {
    top: 0;
}

#bottomBar {
    bottom: 0;
}

#cutsceneCaption {
    position: fixed;

    left: 34px;
    bottom: 11%;

    z-index: 130;

    color:
        rgba(
            255,
            255,
            255,
            0.78
        );

    font-family: monospace;

    letter-spacing: 3px;

    font-size: 14px;

    opacity: 0;

    transition:
        opacity
        0.4s;

    pointer-events: none;
}

#fadeLayer {
    position: fixed;

    inset: 0;

    background: black;

    opacity: 0;

    z-index: 150;

    pointer-events: none;

    transition:
        opacity
        0.25s;
}

/* =========================================================
   WAKE SCREEN
========================================================= */

#wakeScreen {
    position: fixed;

    inset: 0;

    z-index: 160;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    color: white;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.72)
        );
}

#wakeText {
    color:
        rgba(
            255,
            255,
            255,
            0.78
        );

    letter-spacing: 3px;

    line-height: 1.7;

    font-size: 14px;
}

/* =========================================================
   HUD
========================================================= */

#hud {
    position: fixed;

    inset: 0;

    z-index: 40;

    display: none;

    pointer-events: none;
}

#objective {
    position: absolute;

    top: 26px;
    right: 26px;

    padding:
        14px
        34px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.25
        );

    background:
        rgba(
            0,
            0,
            0,
            0.38
        );

    color: white;

    font-family: monospace;

    font-size: 16px;

    letter-spacing: 6px;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 16px;
    height: 16px;

    transform:
        translate(
            -50%,
            -50%
        );

    opacity: 0.75;
}

#crosshair::before {
    content: "";

    position: absolute;

    left: 0;
    top: 7px;

    width: 16px;
    height: 2px;

    background: white;
}

#crosshair::after {
    content: "";

    position: absolute;

    left: 7px;
    top: 0;

    width: 2px;
    height: 16px;

    background: white;
}

#staminaBox {
    position: absolute;

    left: 35px;
    bottom: 30px;

    width: 360px;
}

#staminaLabel {
    margin-bottom: 10px;

    color: white;

    font-size: 15px;

    letter-spacing: 6px;
}

#staminaOuter {
    height: 24px;

    padding: 3px;

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            0.92
        );

    background:
        rgba(
            0,
            0,
            0,
            0.34
        );
}

#staminaInner {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ddca59,
            #fff1a2
        );
}

#pauseText {
    display: none;

    position: absolute;

    left: 50%;
    top: 45%;

    transform:
        translate(
            -50%,
            -50%
        );

    padding:
        15px
        22px;

    background:
        rgba(
            0,
            0,
            0,
            0.72
        );

    color: white;

    letter-spacing: 4px;
}

/* =========================================================
   EFFECTS
========================================================= */

#vignette {
    position: fixed;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    box-shadow:
        inset
        0
        0
        180px
        40px
        rgba(
            0,
            0,
            0,
            0.68
        );
}

#grain {
    position: fixed;

    inset: 0;

    z-index: 21;

    pointer-events: none;

    opacity: 0.075;

    background-image:
        repeating-radial-gradient(
            circle at 22% 21%,
            rgba(255,255,255,0.22) 0px,
            rgba(255,255,255,0.04) 1px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode:
        soft-light;

    animation:
        grainMove
        0.12s
        infinite;
}

@keyframes grainMove {

    0% {
        transform:
            translate(
                0,
                0
            );
    }

    25% {
        transform:
            translate(
                -2px,
                1px
            );
    }

    50% {
        transform:
            translate(
                2px,
                -2px
            );
    }

    75% {
        transform:
            translate(
                1px,
                2px
            );
    }

    100% {
        transform:
            translate(
                0,
                0
            );
    }
}

#danger {
    position: fixed;

    inset: 0;

    z-index: 22;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            circle,
            transparent 34%,
            rgba(90,0,0,0.72)
        );
}

/* =========================================================
   END SCREEN
========================================================= */

#endScreen {
    position: fixed;

    inset: 0;

    z-index: 300;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        #020202;

    color: white;

    text-align: center;
}

#endTitle {
    font-size:
        clamp(
            40px,
            8vw,
            88px
        );

    font-weight: 300;

    letter-spacing: 9px;
}

#endSub {
    margin-top: 13px;

    color: #8a8a8a;

    letter-spacing: 2px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #startContent {
        left: 20px;
        top: 20px;
    }

    #title {
        letter-spacing: 7px;
    }

    #objective {
        top: auto;
        bottom: 110px;
        right: 18px;

        font-size: 12px;

        padding:
            12px
            20px;
    }

    #staminaBox {
        left: 20px;
        right: 20px;

        width: auto;

        bottom: 20px;
    }
}
</style>
</head>

<body>

<div id="startScreen">

    <div id="startContent">

        <h1 id="title">
            THE BACKROOMS
        </h1>

        <div id="subtitle">
            It was supposed to be a normal night.<br>
            You stayed at the office a little too late.
        </div>

        <div id="controlsText">
            WASD = MOVE<br>
            SHIFT = SPRINT<br>
            MOUSE = LOOK
        </div>

        <button id="startButton">
            BEGIN
        </button>

    </div>

</div>

<div
    id="topBar"
    class="cinematicBar">
</div>

<div
    id="bottomBar"
    class="cinematicBar">
</div>

<div id="cutsceneCaption">
    11:53 PM — OFFICE FLOOR 3
</div>

<div id="fadeLayer"></div>

<div id="wakeScreen">

    <div id="wakeText">
        YOU HIT THE FLOOR.
        <br><br>
        THIS IS NOT THE OFFICE.
    </div>

    <button id="wakeButton">
        GET UP
    </button>

</div>

<div id="hud">

    <div id="objective">
        FIND THE EXIT
    </div>

    <div id="crosshair"></div>

    <div id="staminaBox">

        <div id="staminaLabel">
            STAMINA
        </div>

        <div id="staminaOuter">

            <div id="staminaInner"></div>

        </div>

    </div>

    <div id="pauseText">
        CLICK TO CONTINUE
    </div>

</div>

<div id="vignette"></div>

<div id="grain"></div>

<div id="danger"></div>

<div id="endScreen">

    <div id="endTitle"></div>

    <div id="endSub"></div>

    <button id="restartButton">
        RESTART
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* ============================================================
   SETTINGS
============================================================ */

const GRID_WIDTH =
    16;

const GRID_HEIGHT =
    16;

const CELL =
    6;

const WALL_HEIGHT =
    3.7;

const WALL_THICKNESS =
    0.18;

const PLAYER_HEIGHT =
    1.66;

const PLAYER_RADIUS =
    0.32;

const WALK_SPEED =
    3.1;

const SPRINT_SPEED =
    5.45;

const MONSTER_SPEED =
    2.0;

const EXTRA_WALL_REMOVAL =
    0.42;


/* ============================================================
   UI
============================================================ */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const topBar =
    document.getElementById(
        "topBar"
    );

const bottomBar =
    document.getElementById(
        "bottomBar"
    );

const cutsceneCaption =
    document.getElementById(
        "cutsceneCaption"
    );

const fadeLayer =
    document.getElementById(
        "fadeLayer"
    );

const wakeScreen =
    document.getElementById(
        "wakeScreen"
    );

const wakeButton =
    document.getElementById(
        "wakeButton"
    );

const hud =
    document.getElementById(
        "hud"
    );

const staminaInner =
    document.getElementById(
        "staminaInner"
    );

const pauseText =
    document.getElementById(
        "pauseText"
    );

const danger =
    document.getElementById(
        "danger"
    );

const endScreen =
    document.getElementById(
        "endScreen"
    );

const endTitle =
    document.getElementById(
        "endTitle"
    );

const endSub =
    document.getElementById(
        "endSub"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );


/* ============================================================
   THREE SETUP
============================================================ */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(

        72,

        window.innerWidth /
        window.innerHeight,

        0.08,

        220

    );


camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({

        antialias:
            true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        1.7

    )

);


renderer.outputEncoding =
    THREE.sRGBEncoding;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    0.78;


document.body.insertBefore(

    renderer.domElement,

    document.body.firstChild

);


/* ============================================================
   GROUPS
============================================================ */

const officeGroup =
    new THREE.Group();


const backroomsGroup =
    new THREE.Group();


scene.add(
    officeGroup
);


scene.add(
    backroomsGroup
);


backroomsGroup.visible =
    false;


/* ============================================================
   ATMOSPHERE
============================================================ */

function setOfficeAtmosphere() {

    scene.background =
        new THREE.Color(
            0x23272d
        );


    scene.fog =
        new THREE.Fog(

            0x23272d,

            12,

            42

        );

}


function setBackroomsAtmosphere() {

    scene.background =
        new THREE.Color(
            0x5b572d
        );


    scene.fog =
        new THREE.Fog(

            0x625d34,

            12,

            56

        );

}


/* ============================================================
   BACKROOMS WALLPAPER TEXTURE
============================================================ */

function makeWallpaperTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#b4aa4f";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let x = 0;
        x < 256;
        x += 32
    ) {

        ctx.fillStyle =
            "rgba(60,55,18,0.14)";


        ctx.fillRect(
            x,
            0,
            2,
            256
        );


        for (
            let y = 0;
            y < 256;
            y += 32
        ) {

            ctx.strokeStyle =
                "rgba(66,60,22,0.23)";


            ctx.lineWidth =
                2;


            ctx.beginPath();


            ctx.moveTo(
                x + 9,
                y + 22
            );


            ctx.lineTo(
                x + 16,
                y + 9
            );


            ctx.lineTo(
                x + 23,
                y + 22
            );


            ctx.stroke();


            ctx.beginPath();


            ctx.moveTo(
                x + 11,
                y + 27
            );


            ctx.lineTo(
                x + 16,
                y + 18
            );


            ctx.lineTo(
                x + 21,
                y + 27
            );


            ctx.stroke();

        }

    }


    for (
        let i = 0;
        i < 3500;
        i++
    ) {

        const value =
            Math.random() >
            0.5

                ? 255

                : 0;


        ctx.fillStyle =
            `rgba(${value},${value},${value},${Math.random() * 0.025})`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            1,

            1

        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1.8,
        1.8
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   CARPET TEXTURE
============================================================ */

function makeCarpetTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#4e482d";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let i = 0;
        i < 18000;
        i++
    ) {

        const value =
            60 +
            Math.floor(
                Math.random() *
                50
            );


        ctx.fillStyle =
            `rgba(${value},${value - 8},${value - 28},0.14)`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            Math.random() *
            2 +
            0.2,

            Math.random() *
            4 +
            0.4

        );

    }


    for (
        let i = 0;
        i < 26;
        i++
    ) {

        const x =
            Math.random() *
            256;


        const y =
            Math.random() *
            256;


        const radius =
            Math.random() *
            18 +
            4;


        const gradient =
            ctx.createRadialGradient(

                x,

                y,

                0,

                x,

                y,

                radius

            );


        gradient.addColorStop(

            0,

            "rgba(15,12,7,0.08)"

        );


        gradient.addColorStop(

            1,

            "rgba(15,12,7,0)"

        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            radius,

            0,

            Math.PI *
            2

        );


        ctx.fill();

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        28,
        28
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   CEILING TEXTURE
============================================================ */

function makeCeilingTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#a59e67";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    ctx.strokeStyle =
        "rgba(42,38,20,0.55)";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    ctx.moveTo(
        128,
        0
    );


    ctx.lineTo(
        128,
        256
    );


    ctx.moveTo(
        0,
        128
    );


    ctx.lineTo(
        256,
        128
    );


    ctx.stroke();


    for (
        let i = 0;
        i < 2000;
        i++
    ) {

        ctx.fillStyle =
            `rgba(0,0,0,${Math.random() * 0.025})`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            1,

            1

        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(

        GRID_WIDTH *
        1.5,

        GRID_HEIGHT *
        1.5

    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   UNCANNY HUMAN SKIN TEXTURE
============================================================ */

function makeUncannySkinTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /* base sickly human skin */

    ctx.fillStyle =
        "#b4a99a";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    /* general skin variation */

    for (
        let i = 0;
        i < 14000;
        i++
    ) {

        const r =
            175 +
            Math.floor(
                Math.random() *
                28
            );


        const g =
            155 +
            Math.floor(
                Math.random() *
                24
            );


        const b =
            138 +
            Math.floor(
                Math.random() *
                20
            );


        ctx.fillStyle =
            `rgba(${r},${g},${b},${Math.random() * 0.08})`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            Math.random() *
            3 +
            1,

            Math.random() *
            3 +
            1

        );

    }


    /* gray unhealthy patches */

    for (
        let i = 0;
        i < 5000;
        i++
    ) {

        const value =
            100 +
            Math.floor(
                Math.random() *
                35
            );


        ctx.fillStyle =
            `rgba(${value},${value},${value},${Math.random() * 0.04})`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            Math.random() *
            2 +
            1,

            Math.random() *
            2 +
            1

        );

    }


    /* subtle red irritation */

    for (
        let i = 0;
        i < 1400;
        i++
    ) {

        ctx.fillStyle =
            `rgba(120,70,65,${Math.random() * 0.08})`;


        ctx.beginPath();


        ctx.arc(

            Math.random() *
            256,

            Math.random() *
            256,

            Math.random() *
            3 +
            1,

            0,

            Math.PI *
            2

        );


        ctx.fill();

    }


    /* left eye darkness */

    const eyeShadow1 =
        ctx.createRadialGradient(

            84,
            105,

            5,

            84,
            105,

            36

        );


    eyeShadow1.addColorStop(

        0,

        "rgba(38,33,30,0.25)"

    );


    eyeShadow1.addColorStop(

        1,

        "rgba(38,33,30,0)"

    );


    ctx.fillStyle =
        eyeShadow1;


    ctx.beginPath();


    ctx.arc(

        84,

        105,

        36,

        0,

        Math.PI *
        2

    );


    ctx.fill();


    /* right eye darkness */

    const eyeShadow2 =
        ctx.createRadialGradient(

            164,
            109,

            5,

            164,
            109,

            34

        );


    eyeShadow2.addColorStop(

        0,

        "rgba(38,33,30,0.21)"

    );


    eyeShadow2.addColorStop(

        1,

        "rgba(38,33,30,0)"

    );


    ctx.fillStyle =
        eyeShadow2;


    ctx.beginPath();


    ctx.arc(

        164,

        109,

        34,

        0,

        Math.PI *
        2

    );


    ctx.fill();


    /* discoloration around mouth */

    const mouthShadow =
        ctx.createRadialGradient(

            128,
            177,

            8,

            128,
            177,

            46

        );


    mouthShadow.addColorStop(

        0,

        "rgba(70,45,42,0.16)"

    );


    mouthShadow.addColorStop(

        1,

        "rgba(70,45,42,0)"

    );


    ctx.fillStyle =
        mouthShadow;


    ctx.beginPath();


    ctx.arc(

        128,

        177,

        46,

        0,

        Math.PI *
        2

    );


    ctx.fill();


    /* pores */

    for (
        let i = 0;
        i < 4500;
        i++
    ) {

        ctx.fillStyle =
            `rgba(0,0,0,${Math.random() * 0.03})`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            1,

            1

        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.ClampToEdgeWrapping;


    texture.wrapT =
        THREE.ClampToEdgeWrapping;


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}

function makeMonsterBodyTexture() {

/* ============================================================
   OPEN MAZE CONNECTION
============================================================ */

function openBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 -
        x1;


    const dy =
        y2 -
        y1;


    if (
        dx === 1
    ) {

        maze[y1][x1].walls.east =
            false;


        maze[y2][x2].walls.west =
            false;

    }


    else if (
        dx === -1
    ) {

        maze[y1][x1].walls.west =
            false;


        maze[y2][x2].walls.east =
            false;

    }


    else if (
        dy === 1
    ) {

        maze[y1][x1].walls.south =
            false;


        maze[y2][x2].walls.north =
            false;

    }


    else if (
        dy === -1
    ) {

        maze[y1][x1].walls.north =
            false;


        maze[y2][x2].walls.south =
            false;

    }

}


/* ============================================================
   GENERATE MAZE
============================================================ */

function generateMaze() {

    const stack =
        [];


    let current = {

        x:
            0,

        y:
            0

    };


    maze[0][0].visited =
        true;


    let visitedCount =
        1;


    const total =
        GRID_WIDTH *
        GRID_HEIGHT;


    while (
        visitedCount <
        total
    ) {

        const options =
            [];


        const x =
            current.x;


        const y =
            current.y;


        if (
            y > 0 &&
            !maze[y - 1][x].visited
        ) {

            options.push({

                x:
                    x,

                y:
                    y - 1

            });

        }


        if (
            y <
            GRID_HEIGHT - 1 &&
            !maze[y + 1][x].visited
        ) {

            options.push({

                x:
                    x,

                y:
                    y + 1

            });

        }


        if (
            x > 0 &&
            !maze[y][x - 1].visited
        ) {

            options.push({

                x:
                    x - 1,

                y:
                    y

            });

        }


        if (
            x <
            GRID_WIDTH - 1 &&
            !maze[y][x + 1].visited
        ) {

            options.push({

                x:
                    x + 1,

                y:
                    y

            });

        }


        if (
            options.length
        ) {

            const next =
                options[
                    Math.floor(

                        Math.random() *
                        options.length

                    )
                ];


            stack.push({

                x:
                    x,

                y:
                    y

            });


            openBetween(

                x,

                y,

                next.x,

                next.y

            );


            current =
                next;


            maze[
                current.y
            ][
                current.x
            ].visited =
                true;


            visitedCount++;

        }


        else {

            current =
                stack.pop();

        }

    }


    /* Open extra walls so this feels
       like Backrooms rooms instead of
       a hedge maze */

    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            if (
                x <
                GRID_WIDTH - 1 &&
                Math.random() <
                EXTRA_WALL_REMOVAL
            ) {

                maze[y][x].walls.east =
                    false;


                maze[y][x + 1].walls.west =
                    false;

            }


            if (
                y <
                GRID_HEIGHT - 1 &&
                Math.random() <
                EXTRA_WALL_REMOVAL
            ) {

                maze[y][x].walls.south =
                    false;


                maze[y + 1][x].walls.north =
                    false;

            }

        }

    }

}


/* ============================================================
   CELL / WORLD CONVERSION
============================================================ */

function cellToWorld(
    x,
    y
) {

    return {

        x:
            (
                x -
                GRID_WIDTH /
                2 +
                0.5
            ) *
            CELL,

        z:
            (
                y -
                GRID_HEIGHT /
                2 +
                0.5
            ) *
            CELL

    };

}


function worldToCell(
    x,
    z
) {

    let cellX =
        Math.floor(

            x /
            CELL +

            GRID_WIDTH /
            2

        );


    let cellY =
        Math.floor(

            z /
            CELL +

            GRID_HEIGHT /
            2

        );


    cellX =
        Math.max(

            0,

            Math.min(

                GRID_WIDTH - 1,

                cellX

            )

        );


    cellY =
        Math.max(

            0,

            Math.min(

                GRID_HEIGHT - 1,

                cellY

            )

        );


    return {

        x:
            cellX,

        y:
            cellY

    };

}

/* ============================================================
   NEIGHBORS
============================================================ */

function getNeighbors(
    x,
    y
) {

    const cell =
        maze[y][x];


    const neighbors =
        [];


    if (
        !cell.walls.north &&
        y > 0
    ) {

        neighbors.push({

            x:
                x,

            y:
                y - 1

        });

    }


    if (
        !cell.walls.south &&
        y <
        GRID_HEIGHT - 1
    ) {

        neighbors.push({

            x:
                x,

            y:
                y + 1

        });

    }


    if (
        !cell.walls.east &&
        x <
        GRID_WIDTH - 1
    ) {

        neighbors.push({

            x:
                x + 1,

            y:
                y

        });

    }


    if (
        !cell.walls.west &&
        x > 0
    ) {

        neighbors.push({

            x:
                x - 1,

            y:
                y

        });

    }


    return neighbors;

}


/* ============================================================
   FIND FARTHEST CELL
============================================================ */

function findFarthestCell() {

    const queue = [

        {

            x:
                0,

            y:
                0,

            distance:
                0

        }

    ];


    const visited =
        new Set([
            "0,0"
        ]);


    let farthest =
        queue[0];


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.distance >
            farthest.distance
        ) {

            farthest =
                current;

        }


        const neighbors =
            getNeighbors(

                current.x,

                current.y

            );


        for (
            const neighbor
            of neighbors
        ) {

            const key =
                neighbor.x +
                "," +
                neighbor.y;


            if (
                visited.has(
                    key
                )
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x:
                    neighbor.x,

                y:
                    neighbor.y,

                distance:
                    current.distance +
                    1

            });

        }

    }


    return farthest;

}

function buildBackrooms() {

    generateMaze();


    const worldWidth =
        GRID_WIDTH *
        CELL;


    const worldDepth =
        GRID_HEIGHT *
        CELL;


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                worldWidth,

                worldDepth

            ),

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI /
        2;


    backroomsGroup.add(
        floor
    );


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                worldWidth,

                worldDepth

            ),

            ceilingMaterial

        );


    ceiling.rotation.x =
        Math.PI /
        2;


    ceiling.position.y =
        WALL_HEIGHT;


    backroomsGroup.add(
        ceiling
    );


    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            const cell =
                maze[y][x];


            const position =
                cellToWorld(

                    x,

                    y

                );


            if (
                cell.walls.north
            ) {

                createWall(

                    position.x,

                    position.z -
                    CELL /
                    2,

                    CELL +
                    WALL_THICKNESS,

                    WALL_THICKNESS

                );

            }


            if (
                cell.walls.west
            ) {

                createWall(

                    position.x -
                    CELL /
                    2,

                    position.z,

                    WALL_THICKNESS,

                    CELL +
                    WALL_THICKNESS

                );

            }


            if (
                y ===
                GRID_HEIGHT - 1 &&
                cell.walls.south
            ) {

                createWall(

                    position.x,

                    position.z +
                    CELL /
                    2,

                    CELL +
                    WALL_THICKNESS,

                    WALL_THICKNESS

                );

            }


            if (
                x ===
                GRID_WIDTH - 1 &&
                cell.walls.east
            ) {

                createWall(

                    position.x +
                    CELL /
                    2,

                    position.z,

                    WALL_THICKNESS,

                    CELL +
                    WALL_THICKNESS

                );

            }

        }

    }


    /* Random columns */

    for (
        let y = 1;
        y < GRID_HEIGHT - 1;
        y += 2
    ) {

        for (
            let x = 1;
            x < GRID_WIDTH - 1;
            x += 2
        ) {

            if (
                Math.random() <
                0.24
            ) {

                const position =
                    cellToWorld(
                        x,
                        y
                    );


                createColumn(

                    position.x +
                    CELL /
                    2,

                    position.z +
                    CELL /
                    2

                );

            }

        }

    }


    backroomsGroup.add(

        new THREE.HemisphereLight(

            0xbeb46a,

            0x27230f,

            0.58

        )

    );


    backroomsGroup.add(

        new THREE.AmbientLight(

            0x5d5628,

            0.5

        )

    );


    for (
        let y = 0;
        y < GRID_HEIGHT;
        y += 3
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x += 3
        ) {

            const position =
                cellToWorld(

                    x,

                    y

                );


            createFluorescent(

                position.x,

                position.z,

                Math.random() >
                0.5

                    ? 0

                    : Math.PI /
                      2

            );

        }

    }

}

function makeLimb(
    x,
    y,
    upperLength,
    lowerLength,
    upperRadius,
    lowerRadius
) {

    const upperPivot =
        new THREE.Group();


    upperPivot.position.set(

        x,

        y,

        0

    );


    const upper =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                upperRadius,

                upperRadius *
                0.88,

                upperLength,

                7

            ),

            monsterBodyMaterial

        );


    upper.position.y =
        -upperLength /
        2;


    upperPivot.add(
        upper
    );


    const joint =
        new THREE.Mesh(

            new THREE.SphereGeometry(

                upperRadius,

                7,

                6

            ),

            monsterBodyMaterial

        );


    joint.position.y =
        -upperLength;


    upperPivot.add(
        joint
    );


    const lowerPivot =
        new THREE.Group();


    lowerPivot.position.y =
        -upperLength;


    const lower =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                lowerRadius,

                lowerRadius *
                0.78,

                lowerLength,

                7

            ),

            monsterBodyMaterial

        );


    lower.position.y =
        -lowerLength /
        2;


    lowerPivot.add(
        lower
    );


    upperPivot.add(
        lowerPivot
    );


    monsterRig.add(
        upperPivot
    );


    return {

        upperPivot:

            upperPivot,

        lowerPivot:

            lowerPivot

    };

}

/* ============================================================
   PATHFINDING
============================================================ */

function findPath(
    start,
    target
) {

    const queue = [

        {

            x:
                start.x,

            y:
                start.y,

            path:
                []

        }

    ];


    const visited =
        new Set([

            start.x +
            "," +
            start.y

        ]);


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.x ===
            target.x &&
            current.y ===
            target.y
        ) {

            return current.path;

        }


        const neighbors =
            getNeighbors(

                current.x,

                current.y

            );


        for (
            const neighbor
            of neighbors
        ) {

            const key =
                neighbor.x +
                "," +
                neighbor.y;


            if (
                visited.has(
                    key
                )
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x:
                    neighbor.x,

                y:
                    neighbor.y,

                path: [

                    ...current.path,

                    neighbor

                ]

            });

        }

    }


    return [];

}

/* ============================================================
   CUTSCENE UPDATE
============================================================ */

function updateCutscene(
    delta
) {

    cutsceneTime +=
        delta;


    /* Walking through office */

    if (
        cutsceneTime <
        3.8
    ) {

        camera.position.z =
            14 -
            cutsceneTime *
            2.5;


        camera.position.y =
            1.72 +

            Math.sin(
                cutsceneTime *
                8
            ) *

            0.02;


        camera.rotation.x =
            Math.sin(
                cutsceneTime *
                1.4
            ) *
            0.006;


        /* Keep roll centered */

        camera.rotation.z =
            0;


        if (
            cutsceneTime >
            2.1
        ) {

            cutsceneCaption.style.opacity =
                "0";

        }

    }


    /* Lights start acting strange */

    if (
        cutsceneTime >
        3.3 &&
        cutsceneTime <
        4.25
    ) {

        if (
            Math.random() <
            0.35
        ) {

            const light =
                officeLights[
                    Math.floor(

                        Math.random() *
                        officeLights.length

                    )
                ];


            if (
                light
            ) {

                const original =
                    light.intensity;


                light.intensity =
                    Math.random() <
                    0.5

                        ? 0.05

                        : 0.65;


                setTimeout(

                    () => {

                        light.intensity =
                            original;

                    },

                    50

                );

            }

        }


        /* only a TINY shake,
           not a permanent 35 degree roll */

        camera.rotation.z =
            (
                Math.random() -
                0.5
            ) *
            0.008;

    }


    /* Noclip / fall */

    if (
        cutsceneTime >=
        4.25 &&
        cutsceneTime <
        5.05
    ) {

        const fall =
            (
                cutsceneTime -
                4.25
            ) /
            0.8;


        camera.position.y =
            1.72 -
            fall *
            5.3;


        camera.rotation.x =
            fall *
            0.9;


        camera.rotation.z =
            fall *
            0.15;


        fadeLayer.style.opacity =
            String(

                Math.min(

                    1,

                    fall *
                    1.4

                )

            );

    }


    if (
        cutsceneTime >=
        5.05 &&
        !cutsceneFinished
    ) {

        cutsceneFinished =
            true;


        setTimeout(

            wakeInBackrooms,

            600

        );

    }

}

        camera.rotation.z =
            0;

);


/* ============================================================
   COLLISION
============================================================ */

function hitsWall(
    x,
    z
) {

    for (
        const wall
        of collisionWalls
    ) {

        const closestX =
            Math.max(

                wall.minX,

                Math.min(

                    x,

                    wall.maxX

                )

            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(

                    z,

                    wall.maxZ

                )

            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}


/* ============================================================
   PLAYER UPDATE
============================================================ */

function updatePlayer(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {

        return;

    }


    let forward =
        0;


    let sideways =
        0;


    if (
        keys["KeyW"]
    ) {

        forward++;

    }


    if (
        keys["KeyS"]
    ) {

        forward--;

    }


    if (
        keys["KeyD"]
    ) {

        sideways++;

    }


    if (
        keys["KeyA"]
    ) {

        sideways--;

    }


    const moving =

        forward !== 0 ||

        sideways !== 0;


    const sprinting =

        moving &&

        forward > 0 &&

        stamina > 0 &&

        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        );


    const speed =

        sprinting

            ? SPRINT_SPEED

            : WALK_SPEED;


    if (
        sprinting
    ) {

        stamina -=
            delta *
            21;

    }


    else {

        stamina +=
            delta *
            13;

    }


    stamina =
        Math.max(

            0,

            Math.min(

                100,

                stamina

            )

        );


    staminaInner.style.width =
        stamina +
        "%";


    const targetFov =

        sprinting

            ? 77

            : 72;


    camera.fov +=

        (
            targetFov -
            camera.fov
        ) *

        Math.min(

            delta *
            7,

            1

        );


    camera.updateProjectionMatrix();


    /* ALWAYS keep camera level */

    camera.rotation.z =
        0;


    if (
        !moving
    ) {

        camera.position.y +=

            (
                PLAYER_HEIGHT -
                camera.position.y
            ) *

            Math.min(

                delta *
                8,

                1

            );


        return;

    }


    const length =
        Math.sqrt(

            forward *
            forward +

            sideways *
            sideways

        );


    forward /=
        length;


    sideways /=
        length;


    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const dx =

        (
            -sin *
            forward +

            cos *
            sideways
        ) *

        speed *

        delta;


    const dz =

        (
            -cos *
            forward -

            sin *
            sideways
        ) *

        speed *

        delta;


    const nextX =
        camera.position.x +
        dx;


    if (
        !hitsWall(

            nextX,

            camera.position.z

        )
    ) {

        camera.position.x =
            nextX;

    }


    const nextZ =
        camera.position.z +
        dz;


    if (
        !hitsWall(

            camera.position.x,

            nextZ

        )
    ) {

        camera.position.z =
            nextZ;

    }


    movementTime +=

        delta *

        (
            sprinting

                ? 12

                : 8
        );


    camera.position.y =

        PLAYER_HEIGHT +

        Math.sin(
            movementTime
        ) *

        (
            sprinting

                ? 0.045

                : 0.027
        );

}


/* ============================================================
   MONSTER UPDATE
============================================================ */

function updateMonster(
    delta
) {

    monsterActiveTimer -=
        delta;


    if (
        monsterActiveTimer >
        0
    ) {

        return;

    }


    monster.visible =
        true;


    const playerCell =
        worldToCell(

            camera.position.x,

            camera.position.z

        );


    const monsterCell =
        worldToCell(

            monster.position.x,

            monster.position.z

        );


    monsterPathTimer -=
        delta;


    if (
        monsterPathTimer <=
        0
    ) {

        monsterPathTimer =
            0.5;


        monsterPath =
            findPath(

                monsterCell,

                playerCell

            );

    }


    let moving =
        false;


    if (
        monsterPath.length
    ) {

        const next =
            monsterPath[0];


        const target =
            cellToWorld(

                next.x,

                next.y

            );


        const dx =
            target.x -
            monster.position.x;


        const dz =
            target.z -
            monster.position.z;


        const distance =
            Math.sqrt(

                dx *
                dx +

                dz *
                dz

            );


        if (
            distance <
            0.15
        ) {

            monsterPath.shift();

        }


        else {

            moving =
                true;


            const dirX =
                dx /
                distance;


            const dirZ =
                dz /
                distance;


            monster.position.x +=

                dirX *

                MONSTER_SPEED *

                delta;


            monster.position.z +=

                dirZ *

                MONSTER_SPEED *

                delta;


            monster.rotation.y =
                Math.atan2(

                    dirX,

                    dirZ

                ) +
                Math.PI;

        }

    }


    /* ========================================================
       LESS GOOFY / MORE UNCANNY MOVEMENT
    ======================================================== */

    const time =
        performance.now() *
        0.001;


    const stride =
        Math.sin(

            time *
            6.8

        ) *

        (
            moving

                ? 1

                : 0.05
        );


    /* Almost no bouncing */

    monsterRig.position.y =
        Math.sin(

            time *
            3.4

        ) *
        0.012;


    /* Tiny unsettling lean */

    monsterRig.rotation.x =

        0.07 +

        Math.sin(

            time *
            1.6

        ) *
        0.006;


    monsterRig.rotation.z =
        Math.sin(

            time *
            0.9

        ) *
        0.01;


    /* Arms */

    leftArm.upperPivot.rotation.x =

        0.12 +

        stride *
        0.28;


    rightArm.upperPivot.rotation.x =

        0.08 -

        stride *
        0.32;


    leftArm.lowerPivot.rotation.x =

        -0.10 +

        Math.max(

            0,

            -stride

        ) *
        0.16;


    rightArm.lowerPivot.rotation.x =

        -0.12 +

        Math.max(

            0,

            stride

        ) *
        0.18;


    /* Legs */

    leftLeg.upperPivot.rotation.x =

        -stride *
        0.18;


    rightLeg.upperPivot.rotation.x =

        stride *
        0.18;


    leftLeg.lowerPivot.rotation.x =

        Math.max(

            0,

            stride

        ) *
        0.10;


    rightLeg.lowerPivot.rotation.x =

        Math.max(

            0,

            -stride

        ) *
        0.10;


    /* Head slowly drifts like
       it isn't perfectly attached */

    cranium.rotation.z =
        Math.sin(

            time *
            0.8

        ) *
        0.025;


    cranium.rotation.y =
        Math.sin(

            time *
            0.55

        ) *
        0.03;


    face.rotation.z =
        cranium.rotation.z;


    face.rotation.y =
        cranium.rotation.y;


    jaw.rotation.z =

        -0.045 +

        Math.sin(

            time *
            1.3

        ) *
        0.006;


    leftEyeSocket.rotation.z =
        cranium.rotation.z;


    rightEyeSocket.rotation.z =
        cranium.rotation.z;


    /* ========================================================
       DISTANCE TO PLAYER
    ======================================================== */

    const dx =
        monster.position.x -
        camera.position.x;


    const dz =
        monster.position.z -
        camera.position.z;


    const playerDistance =
        Math.sqrt(

            dx *
            dx +

            dz *
            dz

        );


    let dangerAmount =
        0;


    if (
        playerDistance <
        11
    ) {

        dangerAmount =

            1 -

            playerDistance /
            11;

    }


    danger.style.opacity =
        String(

            dangerAmount *
            0.55

        );


    if (
        playerDistance <
        0.92
    ) {

        loseGame();

    }

}


/* ============================================================
   LIGHT FLICKERING
============================================================ */

let flickerTimer =
    0;


function updateLights(
    delta
) {

    flickerTimer -=
        delta;


    if (
        flickerTimer >
        0
    ) {

        return;

    }


    flickerTimer =

        0.1 +

        Math.random() *
        1.7;


    if (
        Math.random() >
        0.22
    ) {

        return;

    }


    const light =
        fluorescentLights[
            Math.floor(

                Math.random() *
                fluorescentLights.length

            )
        ];


    if (
        !light
    ) {

        return;

    }


    const original =
        light.intensity;


    light.intensity =
        0.02;


    setTimeout(

        () => {

            light.intensity =
                original;

        },

        50 +
        Math.random() *
        100

    );

}


/* ============================================================
   EXIT CHECK
============================================================ */

function checkExit() {

    const dx =
        camera.position.x -
        exitGroup.position.x;


    const dz =
        camera.position.z -
        exitGroup.position.z;


    if (
        dx * dx +
        dz * dz <
        2.2
    ) {

        winGame();

    }

}


/* ============================================================
   WIN
============================================================ */

function winGame() {

    if (
        mode ===
        "end"
    ) {

        return;

    }


    mode =
        "end";


    document.exitPointerLock();


    hud.style.display =
        "none";


    endScreen.style.display =
        "flex";


    endTitle.textContent =
        "YOU ESCAPED";


    endTitle.style.color =
        "#d9ffc7";


    endSub.textContent =
        "At least... you think you did.";

}


/* ============================================================
   LOSE
============================================================ */

function loseGame() {

    if (
        mode ===
        "end"
    ) {

        return;

    }


    mode =
        "end";


    document.exitPointerLock();


    danger.style.opacity =
        "0.85";


    setTimeout(

        () => {

            hud.style.display =
                "none";


            endScreen.style.display =
                "flex";


            endTitle.textContent =
                "YOU WERE FOUND";


            endTitle.style.color =
                "#912727";


            endSub.textContent =
                "Something almost human was wandering the halls.";

        },

        280

    );

}


/* ============================================================
   BUTTONS
============================================================ */

startButton.addEventListener(

    "click",

    beginCutscene

);


wakeButton.addEventListener(

    "click",

    startPlaying

);


restartButton.addEventListener(

    "click",

    () => {

        location.reload();

    }

);


/* ============================================================
   POINTER LOCK
============================================================ */

renderer.domElement.addEventListener(

    "click",

    () => {

        if (
            mode ===
            "playing" &&
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }

);


document.addEventListener(

    "pointerlockchange",

    () => {

        if (
            mode !==
            "playing"
        ) {

            return;

        }


        pauseText.style.display =

            document.pointerLockElement ===
            renderer.domElement

                ? "none"

                : "block";

    }

);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =

            window.innerWidth /

            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);


/* ============================================================
   INITIAL STATE
============================================================ */

officeGroup.visible =
    true;


backroomsGroup.visible =
    false;


setOfficeAtmosphere();


setOfficePreviewCamera();


/* ============================================================
   MAIN LOOP
============================================================ */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            clock.getDelta(),

            0.05

        );


    /* ========================================================
       TITLE CAMERA
    ======================================================== */

    if (
        mode ===
        "title"
    ) {

        camera.position.x =

            Math.sin(

                performance.now() *
                0.00035

            ) *
            0.12;


        camera.position.y =

            1.72 +

            Math.sin(

                performance.now() *
                0.001

            ) *
            0.01;


        const titleYaw =

            Math.sin(

                performance.now() *
                0.00045

            ) *
            0.02;


        /* NEVER carry over the cutscene roll */

        camera.rotation.set(

            0,

            titleYaw,

            0

        );

    }


    /* ========================================================
       CUTSCENE
    ======================================================== */

    if (
        mode ===
        "cutscene"
    ) {

        updateCutscene(
            delta
        );

    }


    /* ========================================================
       PLAYING
    ======================================================== */

    if (
        mode ===
        "playing"
    ) {

        updatePlayer(
            delta
        );


        updateMonster(
            delta
        );


        updateLights(
            delta
        );


        checkExit();

    }


    renderer.render(

        scene,

        camera

    );

}


animate();

</script>
