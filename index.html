<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Backrooms</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

canvas { display: block; }

/* =========================
   MENU / INTRO
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.68) 0%,
            rgba(0,0,0,.28) 35%,
            rgba(0,0,0,0) 65%
        );
}

#startContent {
    position: absolute;
    top: 34px;
    left: 34px;
    pointer-events: auto;
    max-width: 520px;
}

#title {
    margin: 0;
    font-size: clamp(42px, 6vw, 92px);
    font-weight: 300;
    letter-spacing: 12px;
    color: #eee7b0;
    text-shadow: 0 0 16px rgba(255,240,160,.18);
}

#subtitle {
    margin-top: 18px;
    color: rgba(255,255,255,.78);
    line-height: 1.55;
    font-size: 17px;
}

#startButton,
#wakeButton,
#restartButton {
    margin-top: 22px;
    padding: 15px 34px;
    border: 1px solid rgba(240,232,180,.85);
    background: rgba(0,0,0,.56);
    color: white;
    font-size: 16px;
    letter-spacing: 5px;
    cursor: pointer;
}

#startButton:hover,
#wakeButton:hover,
#restartButton:hover {
    background: rgba(80,75,42,.68);
}

/* =========================
   CINEMATIC
========================= */

.cinematicBar {
    position: fixed;
    left: 0;
    width: 100%;
    height: 8%;
    background: black;
    z-index: 120;
    display: none;
    pointer-events: none;
}

#topBar { top: 0; }
#bottomBar { bottom: 0; }

#cutsceneCaption {
    position: fixed;
    left: 34px;
    bottom: 11%;
    z-index: 130;
    color: rgba(255,255,255,.78);
    font-family: monospace;
    letter-spacing: 3px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
}

#fadeLayer {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    z-index: 150;
    pointer-events: none;
    transition: opacity .25s;
}

/* =========================
   WAKE SCREEN
========================= */

#wakeScreen {
    position: fixed;
    inset: 0;
    z-index: 160;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.15),
            rgba(0,0,0,.72)
        );
}

#wakeText {
    color: rgba(255,255,255,.78);
    letter-spacing: 3px;
    line-height: 1.7;
    font-size: 14px;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    pointer-events: none;
}

#objective {
    position: absolute;
    top: 26px;
    right: 26px;
    padding: 14px 34px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.38);
    color: white;
    font-family: monospace;
    font-size: 16px;
    letter-spacing: 6px;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
    opacity: .75;
}

#crosshair::before {
    content: "";
    position: absolute;
    left: 0;
    top: 7px;
    width: 16px;
    height: 2px;
    background: white;
}

#crosshair::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 0;
    width: 2px;
    height: 16px;
    background: white;
}

#staminaBox {
    position: absolute;
    left: 35px;
    bottom: 30px;
    width: 360px;
}

#staminaLabel {
    margin-bottom: 10px;
    color: white;
    font-size: 15px;
    letter-spacing: 6px;
}

#staminaOuter {
    height: 24px;
    padding: 3px;
    border: 2px solid rgba(255,255,255,.92);
    background: rgba(0,0,0,.34);
}

#staminaInner {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ddca59, #fff1a2);
}

#pauseText {
    display: none;
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    padding: 15px 22px;
    background: rgba(0,0,0,.72);
    color: white;
    letter-spacing: 4px;
}

/* =========================
   EFFECTS
========================= */

#vignette {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    box-shadow: inset 0 0 180px 40px rgba(0,0,0,.68);
}

#grain {
    position: fixed;
    inset: 0;
    z-index: 21;
    pointer-events: none;
    opacity: .075;
    background-image:
        repeating-radial-gradient(
            circle at 22% 21%,
            rgba(255,255,255,.22) 0px,
            rgba(255,255,255,.04) 1px,
            transparent 2px,
            transparent 4px
        );
    mix-blend-mode: soft-light;
    animation: grainMove .12s infinite;
}

@keyframes grainMove {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-2px,1px); }
    50%  { transform: translate(2px,-2px); }
    75%  { transform: translate(1px,2px); }
    100% { transform: translate(0,0); }
}

#danger {
    position: fixed;
    inset: 0;
    z-index: 22;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(
            circle,
            transparent 34%,
            rgba(90,0,0,.72)
        );
}

/* =========================
   END SCREEN
========================= */

#endScreen {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #020202;
    color: white;
    text-align: center;
}

#endTitle {
    font-size: clamp(40px, 8vw, 88px);
    font-weight: 300;
    letter-spacing: 9px;
}

#endSub {
    margin-top: 13px;
    color: #8a8a8a;
    letter-spacing: 2px;
}

@media (max-width: 700px) {
    #startContent { left: 20px; top: 20px; }
    #title { letter-spacing: 7px; }
    #objective {
        top: auto;
        bottom: 110px;
        right: 18px;
        font-size: 12px;
        padding: 12px 20px;
    }
    #staminaBox {
        left: 20px;
        right: 20px;
        width: auto;
        bottom: 20px;
    }
}
</style>
</head>
<body>

<div id="startScreen">
    <div id="startContent">
        <h1 id="title">THE BACKROOMS</h1>
        <div id="subtitle">
            It was supposed to be a normal night.<br>
            You stayed at the office a little too late.
        </div>
        <button id="startButton">BEGIN</button>
    </div>
</div>

<div id="topBar" class="cinematicBar"></div>
<div id="bottomBar" class="cinematicBar"></div>
<div id="cutsceneCaption">11:53 PM — OFFICE FLOOR 3</div>
<div id="fadeLayer"></div>

<div id="wakeScreen">
    <div id="wakeText">
        YOU HIT THE FLOOR.<br><br>
        THIS IS NOT THE OFFICE.
    </div>
    <button id="wakeButton">GET UP</button>
</div>

<div id="hud">
    <div id="objective">FIND THE EXIT</div>
    <div id="crosshair"></div>

    <div id="staminaBox">
        <div id="staminaLabel">STAMINA</div>
        <div id="staminaOuter">
            <div id="staminaInner"></div>
        </div>
    </div>

    <div id="pauseText">CLICK TO CONTINUE</div>
</div>

<div id="vignette"></div>
<div id="grain"></div>
<div id="danger"></div>

<div id="endScreen">
    <div id="endTitle"></div>
    <div id="endSub"></div>
    <button id="restartButton">RESTART</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* =========================
   SETTINGS
========================= */

const GRID_WIDTH = 16;
const GRID_HEIGHT = 16;
const CELL = 6;

const WALL_HEIGHT = 3.7;
const WALL_THICKNESS = 0.18;

const PLAYER_HEIGHT = 1.66;
const PLAYER_RADIUS = 0.32;

const WALK_SPEED = 3.1;
const SPRINT_SPEED = 5.45;
const MONSTER_SPEED = 2.0;

const EXTRA_WALL_REMOVAL = 0.42;

/* =========================
   UI
========================= */

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const topBar = document.getElementById("topBar");
const bottomBar = document.getElementById("bottomBar");
const cutsceneCaption = document.getElementById("cutsceneCaption");
const fadeLayer = document.getElementById("fadeLayer");
const wakeScreen = document.getElementById("wakeScreen");
const wakeButton = document.getElementById("wakeButton");
const hud = document.getElementById("hud");
const staminaInner = document.getElementById("staminaInner");
const pauseText = document.getElementById("pauseText");
const danger = document.getElementById("danger");
const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endSub = document.getElementById("endSub");
const restartButton = document.getElementById("restartButton");

/* =========================
   THREE SETUP
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.08,
    220
);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;

document.body.insertBefore(renderer.domElement, document.body.firstChild);

/* =========================
   GROUPS
========================= */

const officeGroup = new THREE.Group();
const backroomsGroup = new THREE.Group();
scene.add(officeGroup);
scene.add(backroomsGroup);
backroomsGroup.visible = false;

/* =========================
   ATMOSPHERE
========================= */

function setOfficeAtmosphere() {
    scene.background = new THREE.Color(0x23272d);
    scene.fog = new THREE.Fog(0x23272d, 12, 42);
}

function setBackroomsAtmosphere() {
    scene.background = new THREE.Color(0x5b572d);
    scene.fog = new THREE.Fog(0x625d34, 12, 56);
}

/* =========================
   TEXTURES
========================= */

function makeWallpaperTexture() {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#b4aa4f";
    ctx.fillRect(0, 0, 256, 256);

    for (let x = 0; x < 256; x += 32) {
        ctx.fillStyle = "rgba(60,55,18,0.14)";
        ctx.fillRect(x, 0, 2, 256);

        for (let y = 0; y < 256; y += 32) {
            ctx.strokeStyle = "rgba(66,60,22,0.23)";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(x + 9, y + 22);
            ctx.lineTo(x + 16, y + 9);
            ctx.lineTo(x + 23, y + 22);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + 11, y + 27);
            ctx.lineTo(x + 16, y + 18);
            ctx.lineTo(x + 21, y + 27);
            ctx.stroke();
        }
    }

    for (let i = 0; i < 3500; i++) {
        const v = Math.random() > 0.5 ? 255 : 0;
        ctx.fillStyle = `rgba(${v},${v},${v},${Math.random() * 0.025})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 1, 1);
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1.8, 1.8);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
}

function makeCarpetTexture() {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#4e482d";
    ctx.fillRect(0, 0, 256, 256);

    for (let i = 0; i < 18000; i++) {
        const v = 60 + Math.floor(Math.random() * 50);
        ctx.fillStyle = `rgba(${v},${v - 8},${v - 28},0.14)`;
        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            Math.random() * 2 + 0.2,
            Math.random() * 4 + 0.4
        );
    }

    for (let i = 0; i < 26; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const r = Math.random() * 18 + 4;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, "rgba(15,12,7,0.08)");
        g.addColorStop(1, "rgba(15,12,7,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(28, 28);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
}

function makeCeilingTexture() {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#a59e67";
    ctx.fillRect(0, 0, 256, 256);

    ctx.strokeStyle = "rgba(42,38,20,0.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(128, 0);
    ctx.lineTo(128, 256);
    ctx.moveTo(0, 128);
    ctx.lineTo(256, 128);
    ctx.stroke();

    for (let i = 0; i < 2000; i++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.025})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 1, 1);
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(GRID_WIDTH * 1.5, GRID_HEIGHT * 1.5);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
}

/* =========================
   OFFICE CUTSCENE LEVEL
========================= */

const officeLights = [];

function buildOffice() {
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x35393d, roughness: 1 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xd4d1c9, roughness: 0.95 });
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xcfcbbf, roughness: 0.92 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x5a564d, roughness: 0.9 });

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 56),
        floorMat
    );
    floor.rotation.x = -Math.PI / 2;
    officeGroup.add(floor);

    const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 56),
        ceilingMat
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 3.4;
    officeGroup.add(ceiling);

    const leftWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, 3.4, 56),
        wallMat
    );
    leftWall.position.set(-6, 1.7, 0);
    officeGroup.add(leftWall);

    const rightWall = leftWall.clone();
    rightWall.position.x = 6;
    officeGroup.add(rightWall);

    const endWall = new THREE.Mesh(
        new THREE.BoxGeometry(12, 3.4, 0.22),
        wallMat
    );
    endWall.position.set(0, 1.7, -27.9);
    officeGroup.add(endWall);

    for (let z = -22; z <= 16; z += 7) {
        const leftDoor = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 2.4, 1.25),
            doorMat
        );
        leftDoor.position.set(-5.88, 1.2, z);
        officeGroup.add(leftDoor);

        const rightDoor = leftDoor.clone();
        rightDoor.position.x = 5.88;
        officeGroup.add(rightDoor);
    }

    const ambient = new THREE.AmbientLight(0xc7cbcf, 0.42);
    officeGroup.add(ambient);

    for (let z = -22; z <= 22; z += 6) {
        const panel = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.04, 0.6),
            new THREE.MeshBasicMaterial({ color: 0xf0eedf })
        );
        panel.position.set(0, 3.28, z);
        officeGroup.add(panel);

        const light = new THREE.PointLight(0xe9e8d8, 0.65, 10, 1.6);
        light.position.set(0, 3.0, z);
        officeGroup.add(light);
        officeLights.push(light);
    }
}

/* =========================
   BACKROOMS LEVEL
========================= */

const wallMaterial = new THREE.MeshStandardMaterial({
    map: makeWallpaperTexture(),
    color: 0xbfb45a,
    roughness: 0.95
});

const floorMaterial = new THREE.MeshStandardMaterial({
    map: makeCarpetTexture(),
    color: 0x756f45,
    roughness: 1
});

const ceilingMaterial = new THREE.MeshStandardMaterial({
    map: makeCeilingTexture(),
    color: 0xb1a96c,
    roughness: 1
});

const trimMaterial = new THREE.MeshStandardMaterial({
    color: 0x91884a,
    roughness: 0.9
});

const lightPanelMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffd2,
    emissive: 0xffef98,
    emissiveIntensity: 1.4
});

const maze = [];
for (let y = 0; y < GRID_HEIGHT; y++) {
    maze[y] = [];
    for (let x = 0; x < GRID_WIDTH; x++) {
        maze[y][x] = {
            visited: false,
            walls: { north: true, south: true, east: true, west: true }
        };
    }
}

function openBetween(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;

    if (dx === 1) {
        maze[y1][x1].walls.east = false;
        maze[y2][x2].walls.west = false;
    } else if (dx === -1) {
        maze[y1][x1].walls.west = false;
        maze[y2][x2].walls.east = false;
    } else if (dy === 1) {
        maze[y1][x1].walls.south = false;
        maze[y2][x2].walls.north = false;
    } else if (dy === -1) {
        maze[y1][x1].walls.north = false;
        maze[y2][x2].walls.south = false;
    }
}

function generateMaze() {
    const stack = [];
    let current = { x: 0, y: 0 };
    maze[0][0].visited = true;
    let visitedCount = 1;
    const total = GRID_WIDTH * GRID_HEIGHT;

    while (visitedCount < total) {
        const options = [];
        const { x, y } = current;

        if (y > 0 && !maze[y - 1][x].visited) options.push({ x, y: y - 1 });
        if (y < GRID_HEIGHT - 1 && !maze[y + 1][x].visited) options.push({ x, y: y + 1 });
        if (x > 0 && !maze[y][x - 1].visited) options.push({ x: x - 1, y });
        if (x < GRID_WIDTH - 1 && !maze[y][x + 1].visited) options.push({ x: x + 1, y });

        if (options.length) {
            const next = options[Math.floor(Math.random() * options.length)];
            stack.push({ x, y });
            openBetween(x, y, next.x, next.y);
            current = next;
            maze[current.y][current.x].visited = true;
            visitedCount++;
        } else {
            current = stack.pop();
        }
    }

    for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
            if (x < GRID_WIDTH - 1 && Math.random() < EXTRA_WALL_REMOVAL) {
                maze[y][x].walls.east = false;
                maze[y][x + 1].walls.west = false;
            }
            if (y < GRID_HEIGHT - 1 && Math.random() < EXTRA_WALL_REMOVAL) {
                maze[y][x].walls.south = false;
                maze[y + 1][x].walls.north = false;
            }
        }
    }
}

function cellToWorld(x, y) {
    return {
        x: (x - GRID_WIDTH / 2 + 0.5) * CELL,
        z: (y - GRID_HEIGHT / 2 + 0.5) * CELL
    };
}

function worldToCell(x, z) {
    let cx = Math.floor(x / CELL + GRID_WIDTH / 2);
    let cy = Math.floor(z / CELL + GRID_HEIGHT / 2);
    cx = Math.max(0, Math.min(GRID_WIDTH - 1, cx));
    cy = Math.max(0, Math.min(GRID_HEIGHT - 1, cy));
    return { x: cx, y: cy };
}

const collisionWalls = [];
const fluorescentLights = [];

function createWall(x, z, width, depth) {
    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(width, WALL_HEIGHT, depth),
        wallMaterial
    );
    wall.position.set(x, WALL_HEIGHT / 2, z);
    backroomsGroup.add(wall);

    const trim = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.12, depth + 0.04),
        trimMaterial
    );
    trim.position.set(x, 0.06, z);
    backroomsGroup.add(trim);

    collisionWalls.push({
        minX: x - width / 2,
        maxX: x + width / 2,
        minZ: z - depth / 2,
        maxZ: z + depth / 2
    });
}

function createColumn(x, z) {
    const column = new THREE.Mesh(
        new THREE.BoxGeometry(0.72, WALL_HEIGHT, 0.72),
        wallMaterial
    );
    column.position.set(x, WALL_HEIGHT / 2, z);
    backroomsGroup.add(column);

    collisionWalls.push({
        minX: x - 0.36,
        maxX: x + 0.36,
        minZ: z - 0.36,
        maxZ: z + 0.36
    });
}

function createFluorescent(x, z, rotation) {
    const frame = new THREE.Mesh(
        new THREE.BoxGeometry(2.15, 0.09, 0.62),
        new THREE.MeshStandardMaterial({ color: 0x666043, roughness: 0.8 })
    );
    frame.position.set(x, WALL_HEIGHT - 0.05, z);
    frame.rotation.y = rotation;
    backroomsGroup.add(frame);

    const panel = new THREE.Mesh(
        new THREE.BoxGeometry(1.9, 0.04, 0.42),
        lightPanelMaterial
    );
    panel.position.set(x, WALL_HEIGHT - 0.12, z);
    panel.rotation.y = rotation;
    backroomsGroup.add(panel);

    const light = new THREE.PointLight(0xffe98d, 0.7, 13, 1.5);
    light.position.set(x, WALL_HEIGHT - 0.45, z);
    backroomsGroup.add(light);
    fluorescentLights.push(light);
}

function getNeighbors(x, y) {
    const c = maze[y][x];
    const n = [];

    if (!c.walls.north && y > 0) n.push({ x, y: y - 1 });
    if (!c.walls.south && y < GRID_HEIGHT - 1) n.push({ x, y: y + 1 });
    if (!c.walls.east && x < GRID_WIDTH - 1) n.push({ x: x + 1, y });
    if (!c.walls.west && x > 0) n.push({ x: x - 1, y });

    return n;
}

function findFarthestCell() {
    const queue = [{ x: 0, y: 0, d: 0 }];
    const visited = new Set(["0,0"]);
    let farthest = queue[0];

    while (queue.length) {
        const cur = queue.shift();
        if (cur.d > farthest.d) farthest = cur;

        for (const n of getNeighbors(cur.x, cur.y)) {
            const key = `${n.x},${n.y}`;
            if (visited.has(key)) continue;
            visited.add(key);
            queue.push({ x: n.x, y: n.y, d: cur.d + 1 });
        }
    }

    return farthest;
}

function buildBackrooms() {
    generateMaze();

    const worldWidth = GRID_WIDTH * CELL;
    const worldDepth = GRID_HEIGHT * CELL;

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(worldWidth, worldDepth),
        floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    backroomsGroup.add(floor);

    const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(worldWidth, worldDepth),
        ceilingMaterial
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = WALL_HEIGHT;
    backroomsGroup.add(ceiling);

    for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
            const cell = maze[y][x];
            const pos = cellToWorld(x, y);

            if (cell.walls.north) {
                createWall(pos.x, pos.z - CELL / 2, CELL + WALL_THICKNESS, WALL_THICKNESS);
            }
            if (cell.walls.west) {
                createWall(pos.x - CELL / 2, pos.z, WALL_THICKNESS, CELL + WALL_THICKNESS);
            }
            if (y === GRID_HEIGHT - 1 && cell.walls.south) {
                createWall(pos.x, pos.z + CELL / 2, CELL + WALL_THICKNESS, WALL_THICKNESS);
            }
            if (x === GRID_WIDTH - 1 && cell.walls.east) {
                createWall(pos.x + CELL / 2, pos.z, WALL_THICKNESS, CELL + WALL_THICKNESS);
            }
        }
    }

    for (let y = 1; y < GRID_HEIGHT - 1; y += 2) {
        for (let x = 1; x < GRID_WIDTH - 1; x += 2) {
            if (Math.random() < 0.24) {
                const pos = cellToWorld(x, y);
                createColumn(pos.x + CELL / 2, pos.z + CELL / 2);
            }
        }
    }

    backroomsGroup.add(new THREE.HemisphereLight(0xbeb46a, 0x27230f, 0.58));
    backroomsGroup.add(new THREE.AmbientLight(0x5d5628, 0.5));

    for (let y = 0; y < GRID_HEIGHT; y += 3) {
        for (let x = 0; x < GRID_WIDTH; x += 3) {
            const pos = cellToWorld(x, y);
            createFluorescent(
                pos.x,
                pos.z,
                Math.random() > 0.5 ? 0 : Math.PI / 2
            );
        }
    }
}

/* =========================
   PATHFINDING
========================= */

function findPath(start, target) {
    const queue = [{ x: start.x, y: start.y, path: [] }];
    const visited = new Set([`${start.x},${start.y}`]);

    while (queue.length) {
        const cur = queue.shift();
        if (cur.x === target.x && cur.y === target.y) return cur.path;

        for (const n of getNeighbors(cur.x, cur.y)) {
            const key = `${n.x},${n.y}`;
            if (visited.has(key)) continue;
            visited.add(key);
            queue.push({
                x: n.x,
                y: n.y,
                path: [...cur.path, n]
            });
        }
    }

    return [];
}

function updateCutscene(delta) {
    cutsceneTime += delta;

    /* walk forward */
    if (cutsceneTime < 3.8) {
        camera.position.z = 14 - cutsceneTime * 2.5;
        camera.position.y = 1.72 + Math.sin(cutsceneTime * 8) * 0.02;
        camera.rotation.x = Math.sin(cutsceneTime * 1.4) * 0.006;

        if (cutsceneTime > 2.1) {
            cutsceneCaption.style.opacity = "0";
        }
    }

    /* lights start failing */
    if (cutsceneTime > 3.3 && cutsceneTime < 4.25) {
        if (Math.random() < 0.35) {
            const light = officeLights[Math.floor(Math.random() * officeLights.length)];
            if (light) {
                const original = light.intensity;
                light.intensity = Math.random() < 0.5 ? 0.05 : 0.65;
                setTimeout(() => { light.intensity = original; }, 50);
            }
        }

        camera.rotation.z = (Math.random() - 0.5) * 0.012;
    }

    /* fall through the floor */
    if (cutsceneTime >= 4.25 && cutsceneTime < 5.05) {
        const f = (cutsceneTime - 4.25) / 0.8;
        camera.position.y = 1.72 - f * 5.3;
        camera.rotation.x = f * 0.9;
        camera.rotation.z = f * 0.15;
        fadeLayer.style.opacity = String(Math.min(1, f * 1.4));
    }

    if (cutsceneTime >= 5.05 && !cutsceneFinished) {
        cutsceneFinished = true;
        setTimeout(wakeInBackrooms, 600);
    }
}

/* =========================
   COLLISION
========================= */

function hitsWall(x, z) {
    for (const wall of collisionWalls) {
        const closestX = Math.max(wall.minX, Math.min(x, wall.maxX));
        const closestZ = Math.max(wall.minZ, Math.min(z, wall.maxZ));

        const dx = x - closestX;
        const dz = z - closestZ;

        if (dx * dx + dz * dz < PLAYER_RADIUS * PLAYER_RADIUS) {
            return true;
        }
    }
    return false;
}

/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(delta) {
    if (document.pointerLockElement !== renderer.domElement) return;

    let forward = 0;
    let sideways = 0;

    if (keys["KeyW"]) forward++;
    if (keys["KeyS"]) forward--;
    if (keys["KeyD"]) sideways++;
    if (keys["KeyA"]) sideways--;

    const moving = forward !== 0 || sideways !== 0;
    const sprinting = moving && forward > 0 && stamina > 0 && (keys["ShiftLeft"] || keys["ShiftRight"]);

    const speed = sprinting ? SPRINT_SPEED : WALK_SPEED;

    if (sprinting) stamina -= delta * 21;
    else stamina += delta * 13;

    stamina = Math.max(0, Math.min(100, stamina));
    staminaInner.style.width = stamina + "%";

    const targetFov = sprinting ? 77 : 72;
    camera.fov += (targetFov - camera.fov) * Math.min(delta * 7, 1);
    camera.updateProjectionMatrix();

    if (!moving) {
        camera.position.y += (PLAYER_HEIGHT - camera.position.y) * Math.min(delta * 8, 1);
        return;
    }

    const len = Math.sqrt(forward * forward + sideways * sideways);
    forward /= len;
    sideways /= len;

    const sin = Math.sin(yaw);
    const cos = Math.cos(yaw);

    const dx = (-sin * forward + cos * sideways) * speed * delta;
    const dz = (-cos * forward - sin * sideways) * speed * delta;

    const nx = camera.position.x + dx;
    if (!hitsWall(nx, camera.position.z)) {
        camera.position.x = nx;
    }

    const nz = camera.position.z + dz;
    if (!hitsWall(camera.position.x, nz)) {
        camera.position.z = nz;
    }

    movementTime += delta * (sprinting ? 12 : 8);
    camera.position.y = PLAYER_HEIGHT + Math.sin(movementTime) * (sprinting ? 0.045 : 0.027);
}

/* =========================
   MONSTER UPDATE
========================= */

function updateMonster(delta) {
    monsterActiveTimer -= delta;
    if (monsterActiveTimer > 0) return;

    monster.visible = true;

    const playerCell = worldToCell(camera.position.x, camera.position.z);
    const monsterCell = worldToCell(monster.position.x, monster.position.z);

    monsterPathTimer -= delta;
    if (monsterPathTimer <= 0) {
        monsterPathTimer = 0.5;
        monsterPath = findPath(monsterCell, playerCell);
    }

    let moving = false;

    if (monsterPath.length) {
        const next = monsterPath[0];
        const target = cellToWorld(next.x, next.y);

        const dx = target.x - monster.position.x;
        const dz = target.z - monster.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 0.15) {
            monsterPath.shift();
        } else {
            moving = true;
            const dirX = dx / dist;
            const dirZ = dz / dist;

            monster.position.x += dirX * MONSTER_SPEED * delta;
            monster.position.z += dirZ * MONSTER_SPEED * delta;
            monster.rotation.y = Math.atan2(dirX, dirZ) + Math.PI;
        }
    }

    const t = performance.now() * 0.001;
    const stride = Math.sin(t * 7.4) * (moving ? 1 : 0.08);

    monsterRig.position.y = Math.sin(t * 4.5) * 0.024;
    monsterRig.rotation.z = Math.sin(t * 1.7) * 0.025;
    monsterRig.rotation.x = 0.09 + Math.sin(t * 2.1) * 0.012;

    leftArm.upperPivot.rotation.x = 0.16 + stride * 0.40;
    rightArm.upperPivot.rotation.x = 0.08 - stride * 0.47;
    leftArm.lowerPivot.rotation.x = -0.12 + Math.max(0, -stride) * 0.28;
    rightArm.lowerPivot.rotation.x = -0.18 + Math.max(0, stride) * 0.33;

    leftLeg.upperPivot.rotation.x = -stride * 0.28;
    rightLeg.upperPivot.rotation.x = stride * 0.28;
    leftLeg.lowerPivot.rotation.x = Math.max(0, stride) * 0.18;
    rightLeg.lowerPivot.rotation.x = Math.max(0, -stride) * 0.18;

    cranium.rotation.z = Math.sin(t * 1.3) * 0.045;
    face.rotation.z = cranium.rotation.z;
    jaw.rotation.z = -0.04 + Math.sin(t * 2.0) * 0.01;
    leftEyeSocket.rotation.z = cranium.rotation.z;
    rightEyeSocket.rotation.z = cranium.rotation.z;

    const dx = monster.position.x - camera.position.x;
    const dz = monster.position.z - camera.position.z;
    const playerDistance = Math.sqrt(dx * dx + dz * dz);

    let dangerAmount = 0;
    if (playerDistance < 11) {
        dangerAmount = 1 - playerDistance / 11;
    }

    danger.style.opacity = String(dangerAmount * 0.55);

    if (playerDistance < 0.92) {
        loseGame();
    }
}

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (mode === "title") {
        camera.position.x = Math.sin(performance.now() * 0.00035) * 0.12;

    if (mode === "playing") {
        updatePlayer(delta);
        updateMonster(delta);
        updateLights(delta);
        checkExit();
    }

    renderer.render(scene, camera);
}

animate();
</script>
</body>
