<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Backrooms</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.64),
            rgba(0,0,0,.19) 48%,
            transparent 75%
        );
}

#startContent {
    position: absolute;
    left: 34px;
    top: 34px;
    pointer-events: auto;
}

#title {
    margin: 0;

    font-weight: 300;
    font-size: clamp(38px, 5vw, 70px);

    letter-spacing: 14px;

    color: #eee7b0;

    text-shadow:
        0 0 18px rgba(255,240,150,.18);
}

#subtitle {
    margin-top: 15px;

    color: rgba(255,255,255,.76);

    line-height: 1.55;
}

#startButton,
#wakeButton,
#restartButton {
    margin-top: 22px;

    border: 1px solid rgba(240,235,190,.8);

    background: rgba(0,0,0,.62);

    color: white;

    padding: 15px 35px;

    font-size: 17px;

    letter-spacing: 6px;

    cursor: pointer;
}

#startButton:hover,
#wakeButton:hover,
#restartButton:hover {
    background: rgba(75,70,40,.68);
}

/* =========================================================
   CINEMATIC
========================================================= */

.cinematicBar {
    position: fixed;

    left: 0;
    width: 100%;
    height: 8%;

    z-index: 130;

    background: black;

    display: none;

    pointer-events: none;
}

#topBar {
    top: 0;
}

#bottomBar {
    bottom: 0;
}

#cutsceneText {
    position: fixed;

    left: 35px;
    bottom: 11%;

    z-index: 135;

    color: rgba(255,255,255,.78);

    font-family: monospace;

    letter-spacing: 3px;

    font-size: 14px;

    opacity: 0;

    transition: opacity .5s;

    pointer-events: none;
}

#glitch {
    position: fixed;
    inset: 0;

    z-index: 160;

    pointer-events: none;

    opacity: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            transparent 2px,
            transparent 5px
        );

    mix-blend-mode: screen;
}

#blackout {
    position: fixed;
    inset: 0;

    z-index: 170;

    background: black;

    pointer-events: none;

    opacity: 0;

    transition: opacity .25s;
}

/* =========================================================
   WAKE SCREEN
========================================================= */

#wakeScreen {
    position: fixed;
    inset: 0;

    z-index: 180;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.12),
            rgba(0,0,0,.72)
        );

    color: white;

    text-align: center;
}

#wakeText {
    color: rgba(255,255,255,.73);

    letter-spacing: 3px;

    font-size: 14px;
}

/* =========================================================
   HUD
========================================================= */

#hud {
    position: fixed;
    inset: 0;

    display: none;

    z-index: 40;

    pointer-events: none;
}

#objective {
    position: absolute;

    top: 27px;
    right: 28px;

    padding: 14px 38px;

    border: 1px solid rgba(255,255,255,.26);

    background: rgba(0,0,0,.35);

    color: white;

    font-family: monospace;

    font-size: 16px;

    letter-spacing: 6px;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 16px;
    height: 16px;

    transform: translate(-50%,-50%);

    opacity: .72;
}

#crosshair::before {
    content: "";

    position: absolute;

    left: 0;
    top: 7px;

    width: 16px;
    height: 2px;

    background: white;
}

#crosshair::after {
    content: "";

    position: absolute;

    left: 7px;
    top: 0;

    width: 2px;
    height: 16px;

    background: white;
}

#stamina {
    position: absolute;

    left: 36px;
    bottom: 32px;

    width: 355px;
}

#staminaLabel {
    margin-bottom: 10px;

    color: white;

    font-size: 15px;

    letter-spacing: 6px;
}

#staminaOuter {
    height: 23px;

    padding: 3px;

    border: 2px solid rgba(255,255,255,.9);

    background: rgba(0,0,0,.35);
}

#staminaInner {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #dcca59,
            #fff0a0
        );
}

#pauseText {
    display: none;

    position: absolute;

    left: 50%;
    top: 45%;

    transform: translate(-50%,-50%);

    padding: 16px 23px;

    background: rgba(0,0,0,.7);

    color: white;

    letter-spacing: 4px;
}

/* =========================================================
   VISUAL EFFECTS
========================================================= */

#vignette {
    position: fixed;
    inset: 0;

    z-index: 25;

    pointer-events: none;

    box-shadow:
        inset 0 0 170px 35px rgba(0,0,0,.68);
}

#grain {
    position: fixed;
    inset: 0;

    z-index: 26;

    pointer-events: none;

    opacity: .075;

    background-image:
        repeating-radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.2) 0,
            rgba(255,255,255,.04) 1px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode: soft-light;

    animation: grainMove .12s infinite;
}

@keyframes grainMove {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-2px,1px); }
    50%  { transform: translate(2px,-2px); }
    75%  { transform: translate(1px,2px); }
    100% { transform: translate(0,0); }
}

#danger {
    position: fixed;
    inset: 0;

    z-index: 27;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            circle,
            transparent 38%,
            rgba(80,0,0,.72)
        );
}

/* =========================================================
   END
========================================================= */

#endScreen {
    position: fixed;
    inset: 0;

    z-index: 400;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #020202;

    color: white;

    text-align: center;
}

#endTitle {
    font-size: clamp(42px,8vw,90px);

    letter-spacing: 10px;

    font-weight: 300;
}

#endSub {
    margin-top: 13px;

    color: #888;

    letter-spacing: 2px;
}
</style>
</head>

<body>

<div id="startScreen">
    <div id="startContent">

        <h1 id="title">
            THE BACKROOMS
        </h1>

        <div id="subtitle">
            It was supposed to be a normal night.<br>
            You stayed at the office a little too late.
        </div>

        <button id="startButton">
            BEGIN
        </button>

    </div>
</div>

<div id="topBar" class="cinematicBar"></div>
<div id="bottomBar" class="cinematicBar"></div>

<div id="cutsceneText">
    11:47 PM — OFFICE FLOOR 3
</div>

<div id="glitch"></div>
<div id="blackout"></div>

<div id="wakeScreen">

    <div id="wakeText">
        YOU HIT THE FLOOR.<br><br>
        THIS IS NOT THE OFFICE.
    </div>

    <button id="wakeButton">
        GET UP
    </button>

</div>

<div id="hud">

    <div id="objective">
        FIND THE EXIT
    </div>

    <div id="crosshair"></div>

    <div id="stamina">

        <div id="staminaLabel">
            STAMINA
        </div>

        <div id="staminaOuter">
            <div id="staminaInner"></div>
        </div>

    </div>

    <div id="pauseText">
        CLICK TO CONTINUE
    </div>

</div>

<div id="vignette"></div>
<div id="grain"></div>
<div id="danger"></div>

<div id="endScreen">

    <div id="endTitle"></div>

    <div id="endSub"></div>

    <button id="restartButton">
        RESTART
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* ============================================================
   SETTINGS
============================================================ */

const GRID_WIDTH = 18;
const GRID_HEIGHT = 18;

const CELL = 5.8;

const WALL_HEIGHT = 3.65;
const WALL_THICKNESS = 0.18;

const PLAYER_HEIGHT = 1.63;
const PLAYER_RADIUS = 0.32;

const WALK_SPEED = 3.15;
const SPRINT_SPEED = 5.6;

const MONSTER_SPEED = 2.05;

const WALL_REMOVE_CHANCE = 0.43;


/* ============================================================
   UI
============================================================ */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const topBar =
    document.getElementById("topBar");

const bottomBar =
    document.getElementById("bottomBar");

const cutsceneText =
    document.getElementById("cutsceneText");

const glitch =
    document.getElementById("glitch");

const blackout =
    document.getElementById("blackout");

const wakeScreen =
    document.getElementById("wakeScreen");

const wakeButton =
    document.getElementById("wakeButton");

const hud =
    document.getElementById("hud");

const staminaInner =
    document.getElementById("staminaInner");

const pauseText =
    document.getElementById("pauseText");

const danger =
    document.getElementById("danger");

const endScreen =
    document.getElementById("endScreen");

const endTitle =
    document.getElementById("endTitle");

const endSub =
    document.getElementById("endSub");

const restartButton =
    document.getElementById("restartButton");


/* ============================================================
   THREE
============================================================ */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        72,
        window.innerWidth /
        window.innerHeight,
        0.08,
        180
    );


camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.7
    )
);


renderer.outputEncoding =
    THREE.sRGBEncoding;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    0.78;


document.body.insertBefore(
    renderer.domElement,
    document.body.firstChild
);


/* ============================================================
   GROUPS
============================================================ */

const officeGroup =
    new THREE.Group();


const backroomsGroup =
    new THREE.Group();


scene.add(
    officeGroup
);


scene.add(
    backroomsGroup
);


backroomsGroup.visible =
    false;


/* ============================================================
   ATMOSPHERE
============================================================ */

function officeAtmosphere() {

    scene.background =
        new THREE.Color(
            0x202328
        );


    scene.fog =
        new THREE.Fog(
            0x202328,
            12,
            36
        );

}


function backroomsAtmosphere() {

    scene.background =
        new THREE.Color(
            0x5b572d
        );


    scene.fog =
        new THREE.Fog(
            0x625d34,
            12,
            52
        );

}


officeAtmosphere();


/* ============================================================
   TEXTURE HELPERS
============================================================ */

function wallpaperTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#b3a84e";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let x = 0;
        x < 256;
        x += 32
    ) {

        ctx.fillStyle =
            "rgba(62,55,19,.13)";


        ctx.fillRect(
            x,
            0,
            2,
            256
        );


        for (
            let y = 0;
            y < 256;
            y += 32
        ) {

            ctx.strokeStyle =
                "rgba(67,60,22,.24)";


            ctx.lineWidth =
                2;


            ctx.beginPath();

            ctx.moveTo(
                x + 9,
                y + 22
            );

            ctx.lineTo(
                x + 16,
                y + 9
            );

            ctx.lineTo(
                x + 23,
                y + 22
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                x + 11,
                y + 27
            );

            ctx.lineTo(
                x + 16,
                y + 18
            );

            ctx.lineTo(
                x + 21,
                y + 27
            );

            ctx.stroke();

        }

    }


    for (
        let i = 0;
        i < 3600;
        i++
    ) {

        const bright =
            Math.random() >
            .5
                ? 255
                : 0;


        ctx.fillStyle =
            `rgba(${bright},${bright},${bright},${Math.random() * .025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1.8,
        1.8
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


function carpetTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#514b2e";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let i = 0;
        i < 18000;
        i++
    ) {

        const v =
            57 +
            Math.floor(
                Math.random() *
                55
            );


        ctx.fillStyle =
            `rgba(${v},${v - 7},${v - 29},.14)`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            Math.random() * 2 + .3,
            Math.random() * 4 + .5
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        30,
        30
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


function ceilingTexture() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#a39c65";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    ctx.strokeStyle =
        "rgba(40,36,20,.55)";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    ctx.moveTo(
        128,
        0
    );


    ctx.lineTo(
        128,
        256
    );


    ctx.moveTo(
        0,
        128
    );


    ctx.lineTo(
        256,
        128
    );


    ctx.stroke();


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        GRID_WIDTH * 1.5,
        GRID_HEIGHT * 1.5
    );


    return texture;

}


/* ============================================================
   OFFICE CUTSCENE LEVEL
============================================================ */

function buildOffice() {

    const floorMat =
        new THREE.MeshStandardMaterial({
            color: 0x35383b,
            roughness: 1
        });


    const wallMat =
        new THREE.MeshStandardMaterial({
            color: 0xc7c3b8,
            roughness: .92
        });


    const ceilingMat =
        new THREE.MeshStandardMaterial({
            color: 0xd0cdc2,
            roughness: .9
        });


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                7,
                30
            ),

            floorMat

        );


    floor.rotation.x =
        -Math.PI / 2;


    officeGroup.add(
        floor
    );


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                7,
                30
            ),

            ceilingMat

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.15;


    officeGroup.add(
        ceiling
    );


    const leftWall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .22,
                3.15,
                30
            ),

            wallMat

        );


    leftWall.position.set(
        -3.5,
        1.57,
        0
    );


    officeGroup.add(
        leftWall
    );


    const rightWall =
        leftWall.clone();


    rightWall.position.x =
        3.5;


    officeGroup.add(
        rightWall
    );


    /* office doors */

    const doorMat =
        new THREE.MeshStandardMaterial({
            color: 0x46433c,
            roughness: .9
        });


    for (
        let z = -8;
        z <= 7;
        z += 5
    ) {

        const leftDoor =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .08,
                    2.35,
                    1.15
                ),

                doorMat

            );


        leftDoor.position.set(
            -3.37,
            1.18,
            z
        );


        officeGroup.add(
            leftDoor
        );


        const rightDoor =
            leftDoor.clone();


        rightDoor.position.x =
            3.37;


        officeGroup.add(
            rightDoor
        );

    }


    const officeAmbient =
        new THREE.AmbientLight(
            0xbec3c5,
            .43
        );


    officeGroup.add(
        officeAmbient
    );


    for (
        let z = -10;
        z <= 10;
        z += 4
    ) {

        const panel =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    1.8,
                    .04,
                    .5
                ),

                new THREE.MeshBasicMaterial({
                    color: 0xf2f1df
                })

            );


        panel.position.set(
            0,
            3.1,
            z
        );


        officeGroup.add(
            panel
        );


        const light =
            new THREE.PointLight(
                0xe9e9d4,
                .55,
                8
            );


        light.position.set(
            0,
            2.8,
            z
        );


        officeGroup.add(
            light
        );

    }

}


buildOffice();


/* ============================================================
   BACKROOMS MATERIALS
============================================================ */

const wallMaterial =
    new THREE.MeshStandardMaterial({

        map: wallpaperTexture(),

        color: 0xbfb45a,

        roughness: .94

    });


const floorMaterial =
    new THREE.MeshStandardMaterial({

        map: carpetTexture(),

        color: 0x777045,

        roughness: 1

    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        map: ceilingTexture(),

        color: 0xb0a86a,

        roughness: 1

    });


const trimMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x918849,

        roughness: .9

    });


const lightMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xffffcf,

        emissive: 0xffed93,

        emissiveIntensity: 1.45

    });


/* ============================================================
   MAZE
============================================================ */

const maze =
    [];


for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
) {

    maze[y] =
        [];


    for (
        let x = 0;
        x < GRID_WIDTH;
        x++
    ) {

        maze[y][x] = {

            visited: false,

            walls: {
                north: true,
                south: true,
                east: true,
                west: true
            }

        };

    }

}


function openBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;


    const dy =
        y2 - y1;


    if (
        dx === 1
    ) {

        maze[y1][x1].walls.east =
            false;

        maze[y2][x2].walls.west =
            false;

    }


    if (
        dx === -1
    ) {

        maze[y1][x1].walls.west =
            false;

        maze[y2][x2].walls.east =
            false;

    }


    if (
        dy === 1
    ) {

        maze[y1][x1].walls.south =
            false;

        maze[y2][x2].walls.north =
            false;

    }


    if (
        dy === -1
    ) {

        maze[y1][x1].walls.north =
            false;

        maze[y2][x2].walls.south =
            false;

    }

}


function generateMaze() {

    const stack =
        [];


    let current = {
        x: 0,
        y: 0
    };


    maze[0][0].visited =
        true;


    let visited =
        1;


    const total =
        GRID_WIDTH *
        GRID_HEIGHT;


    while (
        visited <
        total
    ) {

        const options =
            [];


        const x =
            current.x;


        const y =
            current.y;


        if (
            y > 0 &&
            !maze[y - 1][x].visited
        ) {

            options.push({
                x,
                y: y - 1
            });

        }


        if (
            y <
            GRID_HEIGHT - 1 &&
            !maze[y + 1][x].visited
        ) {

            options.push({
                x,
                y: y + 1
            });

        }


        if (
            x <
            GRID_WIDTH - 1 &&
            !maze[y][x + 1].visited
        ) {

            options.push({
                x: x + 1,
                y
            });

        }


        if (
            x > 0 &&
            !maze[y][x - 1].visited
        ) {

            options.push({
                x: x - 1,
                y
            });

        }


        if (
            options.length
        ) {

            const next =
                options[
                    Math.floor(
                        Math.random() *
                        options.length
                    )
                ];


            stack.push({
                x,
                y
            });


            openBetween(
                x,
                y,
                next.x,
                next.y
            );


            current =
                next;


            maze[current.y][current.x].visited =
                true;


            visited++;

        }

        else {

            current =
                stack.pop();

        }

    }


    /* OPEN THE MAZE UP INTO ROOMS */

    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            if (
                x <
                GRID_WIDTH - 1 &&
                Math.random() <
                WALL_REMOVE_CHANCE
            ) {

                maze[y][x].walls.east =
                    false;


                maze[y][x + 1].walls.west =
                    false;

            }


            if (
                y <
                GRID_HEIGHT - 1 &&
                Math.random() <
                WALL_REMOVE_CHANCE
            ) {

                maze[y][x].walls.south =
                    false;


                maze[y + 1][x].walls.north =
                    false;

            }

        }

    }

}

/* ============================================================

============================================================ */

function cellWorld(
    x,
    y
) {

    return {

        x:
            (
                x -
                GRID_WIDTH / 2 +
                .5
            ) *
            CELL,

        z:
            (
                y -
                GRID_HEIGHT / 2 +
                .5
            ) *
            CELL

    };

}


function worldCell(
    x,
    z
) {

    let cx =
        Math.floor(
            x / CELL +
            GRID_WIDTH / 2
        );


    let cy =
        Math.floor(
            z / CELL +
            GRID_HEIGHT / 2
        );


    cx =
        Math.max(
            0,
            Math.min(
                GRID_WIDTH - 1,
                cx
            )
        );


    cy =
        Math.max(
            0,
            Math.min(
                GRID_HEIGHT - 1,
                cy
            )
        );


    return {
        x: cx,
        y: cy
    };

}

/* ============================================================
   NEIGHBORS
============================================================ */

function getNeighbors(
    x,
    y
) {

    const result =
        [];


    const cell =
        maze[y][x];


    if (
        !cell.walls.north &&
        y > 0
    ) {

        result.push({
            x,
            y: y - 1
        });

    }


    if (
        !cell.walls.south &&
        y <
        GRID_HEIGHT - 1
    ) {

        result.push({
            x,
            y: y + 1
        });

    }


    if (
        !cell.walls.east &&
        x <
        GRID_WIDTH - 1
    ) {

        result.push({
            x: x + 1,
            y
        });

    }


    if (
        !cell.walls.west &&
        x > 0
    ) {

        result.push({
            x: x - 1,
            y
        });

    }


    return result;

}


/* ============================================================
   EXIT
============================================================ */

function findFarthestCell() {

    const queue =
        [{
            x: 0,
            y: 0,
            distance: 0
        }];


    const visited =
        new Set([
            "0,0"
        ]);


    let farthest =
        queue[0];


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.distance >
            farthest.distance
        ) {

            farthest =
                current;

        }


        for (
            const n of
            getNeighbors(
                current.x,
                current.y
            )
        ) {

            const key =
                n.x +
                "," +
                n.y;


            if (
                visited.has(key)
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x: n.x,

                y: n.y,

                distance:
                    current.distance + 1

            });

        }

    }


    return farthest;

}

/* ============================================================
   PATHFINDING
============================================================ */

function findPath(
    start,
    target
) {

    const queue =
        [{

            x: start.x,

            y: start.y,

            path: []

        }];


    const visited =
        new Set();


    visited.add(
        start.x +
        "," +
        start.y
    );


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.x === target.x &&
            current.y === target.y
        ) {

            return current.path;

        }


        for (
            const n of
            getNeighbors(
                current.x,
                current.y
            )
        ) {

            const key =
                n.x +
                "," +
                n.y;


            if (
                visited.has(key)
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x: n.x,

                y: n.y,

                path: [
                    ...current.path,
                    n
                ]

            });

        }

    }


    return [];

}


/* ============================================================
   MONSTER UPDATE
============================================================ */

function updateMonster(
    delta
) {

    monsterActiveTimer -=
        delta;


    if (
        monsterActiveTimer >
        0
    ) {

        return;

    }


    monster.visible =
        true;


    const playerCell =
        worldCell(
            camera.position.x,
            camera.position.z
        );


    const monsterCell =
        worldCell(
            monster.position.x,
            monster.position.z
        );


    monsterPathTimer -=
        delta;


    if (
        monsterPathTimer <=
        0
    ) {

        monsterPathTimer =
            .5;


        monsterPath =
            findPath(
                monsterCell,
                playerCell
            );

    }


    let moving =
        false;


    if (
        monsterPath.length
    ) {

        const next =
            monsterPath[0];


        const target =
            cellWorld(
                next.x,
                next.y
            );


        const dx =
            target.x -
            monster.position.x;


        const dz =
            target.z -
            monster.position.z;


        const distance =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        if (
            distance <
            .15
        ) {

            monsterPath.shift();

        }

        else {

            moving =
                true;


            const dirX =
                dx /
                distance;


            const dirZ =
                dz /
                distance;


            monster.position.x +=
                dirX *
                MONSTER_SPEED *
                delta;


            monster.position.z +=
                dirZ *
                MONSTER_SPEED *
                delta;


            monster.rotation.y =
                Math.atan2(
                    dirX,
                    dirZ
                ) +
                Math.PI;

        }

    }


    const t =
        performance.now() *
        .001;


    const stride =
        Math.sin(
            t * 7.5
        ) *
        (
            moving
                ? 1
                : .08
        );


    /* creepy uneven walk */

    monsterRig.position.y =
        Math.sin(
            t * 4.5
        ) *
        .025;


    monsterRig.rotation.z =
        Math.sin(
            t * 1.7
        ) *
        .026;


    monsterRig.rotation.x =
        .085 +
        Math.sin(
            t * 2.1
        ) *
        .012;


    leftArm.upperPivot.rotation.x =
        .17 +
        stride * .41;


    rightArm.upperPivot.rotation.x =
        .09 -
        stride * .47;


    leftArm.lowerPivot.rotation.x =
        -.12 +
        Math.max(
            0,
            -stride
        ) *
        .27;


    rightArm.lowerPivot.rotation.x =
        -.18 +
        Math.max(
            0,
            stride
        ) *
        .32;


    leftLeg.upperPivot.rotation.x =
        -stride * .28;


    rightLeg.upperPivot.rotation.x =
        stride * .28;


    leftLeg.lowerPivot.rotation.x =
        Math.max(
            0,
            stride
        ) *
        .18;


    rightLeg.lowerPivot.rotation.x =
        Math.max(
            0,
            -stride
        ) *
        .18;


    /* head moves independently */

    hood.rotation.z =
        Math.sin(
            t * 1.3
        ) *
        .045;


    face.rotation.z =
        hood.rotation.z;


    leftEye.rotation.z =
        hood.rotation.z;


    rightEye.rotation.z =
        hood.rotation.z;


    /* danger */

    const dx =
        monster.position.x -
        camera.position.x;


    const dz =
        monster.position.z -
        camera.position.z;


    const playerDistance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    let dangerAmount =
        0;


    if (
        playerDistance <
        11
    ) {

        dangerAmount =
            1 -
            playerDistance /
            11;

    }


    danger.style.opacity =
        dangerAmount *
        .52;


    if (
        playerDistance <
        .92
    ) {

        loseGame();

    }

}


/* ============================================================
   COLLISION
============================================================ */

function hitsWall(
    x,
    z
) {

    for (
        const wall of collisionWalls
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}

            true;

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        const sensitivity =
            .0019;


        yaw -=
            event.movementX *
            sensitivity;


        pitch -=
            event.movementY *
            sensitivity;


        pitch =
            Math.max(
                -1.42,
                Math.min(
                    1.42,
                    pitch
                )
            );


        camera.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* ============================================================
   PLAYER
============================================================ */

function updatePlayer(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {

        return;

    }


    let forward =
        0;


    let sideways =
        0;


    if (
        keys["KeyW"]
    ) {
        forward++;
    }


    if (
        keys["KeyS"]
    ) {
        forward--;
    }


    if (
        keys["KeyD"]
    ) {
        sideways++;
    }


    if (
        keys["KeyA"]
    ) {
        sideways--;
    }


    const moving =
        forward !== 0 ||
        sideways !== 0;


    const sprinting =

        moving &&

        forward > 0 &&

        stamina > 0 &&

        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        );


    const speed =
        sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;


    if (
        sprinting
    ) {

        stamina -=
            delta * 21;

    }

    else {

        stamina +=
            delta * 13;

    }


    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );


    staminaInner.style.width =
        stamina +
        "%";


    const targetFov =
        sprinting
            ? 77
            : 72;


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) *
        Math.min(
            delta * 7,
            1
        );


    camera.updateProjectionMatrix();


    if (
        !moving
    ) {

        camera.position.y +=
            (
                PLAYER_HEIGHT -
                camera.position.y
            ) *
            Math.min(
                delta * 8,
                1
            );


        return;

    }


    const length =
        Math.sqrt(
            forward * forward +
            sideways * sideways
        );


    forward /=
        length;


    sideways /=
        length;


    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const dx =

        (
            -sin *
            forward +

            cos *
            sideways
        ) *

        speed *

        delta;


    const dz =

        (
            -cos *
            forward -

            sin *
            sideways
        ) *

        speed *

        delta;


    const nextX =
        camera.position.x +
        dx;


    if (
        !hitsWall(
            nextX,
            camera.position.z
        )
    ) {

        camera.position.x =
            nextX;

    }


    const nextZ =
        camera.position.z +
        dz;


    if (
        !hitsWall(
            camera.position.x,
            nextZ
        )
    ) {

        camera.position.z =
            nextZ;

    }


    movementTime +=
        delta *
        (
            sprinting
                ? 12
                : 8
        );


    camera.position.y =
        PLAYER_HEIGHT +

        Math.sin(
            movementTime
        ) *

        (
            sprinting
                ? .045
                : .027
        );

}


/* ============================================================
   LIGHT FLICKER
============================================================ */

let flickerTimer =
    0;


function updateLights(
    delta
) {

    flickerTimer -=
        delta;


    if (
        flickerTimer >
        0
    ) {

        return;

    }


    flickerTimer =
        .1 +
        Math.random() *
        1.8;


    if (
        Math.random() >
        .21
    ) {

        return;

    }


    const light =
        fluorescentLights[
            Math.floor(
                Math.random() *
                fluorescentLights.length
            )
        ];


    const original =
        light.intensity;


    light.intensity =
        .02;


    setTimeout(
        () => {

            light.intensity =
                original;

        },

        40 +
        Math.random() *
        120

    );

}


/* ============================================================
   EXIT CHECK
============================================================ */

function checkExit() {

    const dx =
        camera.position.x -
        exitGroup.position.x;


    const dz =
        camera.position.z -
        exitGroup.position.z;


    if (
        dx * dx +
        dz * dz <
        2.2
    ) {

        winGame();

    }

}


/* ============================================================
   AUDIO
============================================================ */

let audioContext =
    null;


function startAudio() {

    if (
        audioContext
    ) {

        return;

    }


    audioContext =

        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    const master =
        audioContext.createGain();


    master.gain.value =
        .033;


    master.connect(
        audioContext.destination
    );


    const hum1 =
        audioContext.createOscillator();


    hum1.type =
        "sine";


    hum1.frequency.value =
        60;


    hum1.connect(
        master
    );


    hum1.start();


    const hum2 =
        audioContext.createOscillator();


    const hum2Gain =
        audioContext.createGain();


    hum2.type =
        "sine";


    hum2.frequency.value =
        119.7;


    hum2Gain.gain.value =
        .17;


    hum2.connect(
        hum2Gain
    );


    hum2Gain.connect(
        master
    );


    hum2.start();

}


/* ============================================================
   GAME STATES
============================================================ */

let mode =
    "title";


let cutsceneTime =
    0;


let cutsceneFinished =
    false;


/* ============================================================
   CUTSCENE
============================================================ */

function beginCutscene() {

    startAudio();


    mode =
        "cutscene";


    cutsceneTime =
        0;


    startScreen.style.display =
        "none";


    topBar.style.display =
        "block";


    bottomBar.style.display =
        "block";


    cutsceneText.style.opacity =
        "1";


    officeGroup.visible =
        true;


    backroomsGroup.visible =
        false;


    officeAtmosphere();


    camera.position.set(
        0,
        1.62,
        10
    );


    camera.rotation.set(
        0,
        0,
        0
    );

}


function updateCutscene(
    delta
) {

    cutsceneTime +=
        delta;


    /* normal walking */

    if (
        cutsceneTime <
        3.7
    ) {

        camera.position.z =
            10 -
            cutsceneTime *
            2.15;


        camera.position.y =
            1.62 +
            Math.sin(
                cutsceneTime *
                8
            ) *
            .025;


        camera.rotation.x =
            Math.sin(
                cutsceneTime *
                1.3
            ) *
            .007;


        if (
            cutsceneTime >
            2
        ) {

            cutsceneText.style.opacity =
                "0";

        }

    }


    /* something goes wrong */

    if (
        cutsceneTime >
        3.7 &&
        cutsceneTime <
        4.2
    ) {

        glitch.style.opacity =
            .15 +
            Math.random() *
            .25;


        camera.rotation.z =
            (
                Math.random() -
                .5
            ) *
            .012;

    }


    /* NOCLIP */

    if (
        cutsceneTime >=
        4.2 &&
        cutsceneTime <
        4.8
    ) {

        glitch.style.opacity =
            .45;


        const fall =
            (
                cutsceneTime -
                4.2
            ) /
            .6;


        camera.position.y =
            1.62 -
            fall *
            4.5;


        camera.rotation.x =
            fall *
            .85;


        camera.rotation.z =
            fall *
            .18;


        blackout.style.opacity =
            Math.min(
                1,
                fall *
                1.6
            );

    }


    if (
        cutsceneTime >=
        4.8 &&
        !cutsceneFinished
    ) {

        cutsceneFinished =
            true;


        setTimeout(
            wakeInBackrooms,
            650
        );

    }

}


function wakeInBackrooms() {

    mode =
        "wake";


    officeGroup.visible =
        false;


    backroomsGroup.visible =
        true;


    backroomsAtmosphere();


    glitch.style.opacity =
        "0";


    topBar.style.display =
        "none";


    bottomBar.style.display =
        "none";


    camera.position.set(
        playerStart.x,
        .55,
        playerStart.z
    );


    yaw =
        Math.PI;


    pitch =
        .25;


    camera.rotation.set(
        pitch,
        yaw,
        0
    );


    blackout.style.opacity =
        "0";


    wakeScreen.style.display =
        "flex";

}


/* ============================================================
   START PLAYING
============================================================ */

function startPlaying() {

    mode =
        "playing";


    wakeScreen.style.display =
        "none";


    hud.style.display =
        "block";


    camera.position.y =
        PLAYER_HEIGHT;


    pitch =
        0;


    camera.rotation.x =
        pitch;


    renderer.domElement.requestPointerLock();

}


/* ============================================================
   BUTTONS
============================================================ */

startButton.addEventListener(
    "click",
    beginCutscene
);


wakeButton.addEventListener(
    "click",
    startPlaying
);


restartButton.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/* ============================================================
   POINTER LOCK
============================================================ */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            mode ===
            "playing" &&
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        if (
            mode !==
            "playing"
        ) {

            return;

        }


        pauseText.style.display =

            document.pointerLockElement ===
            renderer.domElement

                ? "none"

                : "block";

    }
);


/* ============================================================
   WIN / LOSE
============================================================ */

function winGame() {

    if (
        mode ===
        "end"
    ) {

        return;

    }


    mode =
        "end";


    document.exitPointerLock();


    hud.style.display =
        "none";


    endScreen.style.display =
        "flex";


    endTitle.textContent =
        "YOU ESCAPED";


    endTitle.style.color =
        "#d9ffc7";


    endSub.textContent =
        "At least... you think you did.";

}


function loseGame() {

    if (
        mode ===
        "end"
    ) {

        return;

    }


    mode =
        "end";


    document.exitPointerLock();


    danger.style.opacity =
        ".85";


    setTimeout(
        () => {

            hud.style.display =
                "none";


            endScreen.style.display =
                "flex";


            endTitle.textContent =
                "YOU WERE FOUND";


            endTitle.style.color =
                "#8e2424";


            endSub.textContent =
                "Something was waiting in the halls.";

        },

        280

    );

}


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ============================================================
   GAME LOOP
============================================================ */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        mode ===
        "cutscene"
    ) {

        updateCutscene(
            delta
        );

    }


    if (
        mode ===
        "playing"
    ) {

        updatePlayer(
            delta
        );


        updateMonster(
            delta
        );


        updateLights(
            delta
        );


        checkExit();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
