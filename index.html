<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}canvas{display:block}

<body>
<div id="startScreen"><div id="startContent"><h1 id="title">THE BACKROOMS</h1><div id="subtitle">It was supposed to be a normal night.<br>You stayed at the office a little too late.</div><div id="controlsText">WASD = MOVE<br>SHIFT = SPRINT<br>MOUSE = LOOK</div><button id="startButton">BEGIN</button></div></div>
<div id="topBar" class="cinematicBar"></div><div id="bottomBar" class="cinematicBar"></div><div id="cutsceneCaption">11:53 PM — OFFICE FLOOR 3</div><div id="fadeLayer"></div>

<div id="vignette"></div><div id="grain"></div><div id="danger"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const GRID_WIDTH=16,GRID_HEIGHT=16,CELL=6,WALL_HEIGHT=3.7,WALL_THICKNESS=.18,PLAYER_HEIGHT=1.66,PLAYER_RADIUS=.32,WALK_SPEED=3.1,SPRINT_SPEED=5.45,MONSTER_SPEED=2.0,EXTRA_WALL_REMOVAL=.42;
const startScreen=document.getElementById("startScreen"),startButton=document.getElementById("startButton"),topBar=document.getElementById("topBar"),bottomBar=document.getElementById("bottomBar"),cutsceneCaption=document.getElementById("cutsceneCaption"),fadeLayer=document.getElementById("fadeLayer"),wakeScreen=document.getElementById("wakeScreen"),wakeButton=document.getElementById("wakeButton"),hud=document.getElementById("hud"),staminaInner=document.getElementById("staminaInner"),pauseText=document.getElementById("pauseText"),danger=document.getElementById("danger"),endScreen=document.getElementById("endScreen"),endTitle=document.getElementById("endTitle"),endSub=document.getElementById("endSub"),restartButton=document.getElementById("restartButton");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,.08,220);camera.rotation.order="YXZ";
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.7));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.78;document.body.insertBefore(renderer.domElement,document.body.firstChild);
const officeGroup=new THREE.Group(),backroomsGroup=new THREE.Group();scene.add(officeGroup);scene.add(backroomsGroup);backroomsGroup.visible=false;
function setOfficeAtmosphere(){scene.background=new THREE.Color(0x23272d);scene.fog=new THREE.Fog(0x23272d,12,42)}
function setBackroomsAtmosphere(){scene.background=new THREE.Color(0x5b572d);scene.fog=new THREE.Fog(0x625d34,12,56)}
function makeWallpaperTexture(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#b4aa4f";x.fillRect(0,0,256,256);for(let px=0;px<256;px+=32){x.fillStyle="rgba(60,55,18,.14)";x.fillRect(px,0,2,256);for(let py=0;py<256;py+=32){x.strokeStyle="rgba(66,60,22,.23)";x.lineWidth=2;x.beginPath();x.moveTo(px+9,py+22);x.lineTo(px+16,py+9);x.lineTo(px+23,py+22);x.stroke();x.beginPath();x.moveTo(px+11,py+27);x.lineTo(px+16,py+18);x.lineTo(px+21,py+27);x.stroke()}}for(let i=0;i<3500;i++){const v=Math.random()>.5?255:0;x.fillStyle=`rgba(${v},${v},${v},${Math.random()*.025})`;x.fillRect(Math.random()*256,Math.random()*256,1,1)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.8,1.8);t.encoding=THREE.sRGBEncoding;return t}
function makeCarpetTexture(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#4e482d";x.fillRect(0,0,256,256);for(let i=0;i<18000;i++){const v=60+Math.floor(Math.random()*50);x.fillStyle=`rgba(${v},${v-8},${v-28},.14)`;x.fillRect(Math.random()*256,Math.random()*256,Math.random()*2+.2,Math.random()*4+.4)}for(let i=0;i<26;i++){const px=Math.random()*256,py=Math.random()*256,r=Math.random()*18+4,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,"rgba(15,12,7,.08)");g.addColorStop(1,"rgba(15,12,7,0)");x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(28,28);t.encoding=THREE.sRGBEncoding;return t}
function makeCeilingTexture(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#a59e67";x.fillRect(0,0,256,256);x.strokeStyle="rgba(42,38,20,.55)";x.lineWidth=3;x.beginPath();x.moveTo(128,0);x.lineTo(128,256);x.moveTo(0,128);x.lineTo(256,128);x.stroke();for(let i=0;i<2000;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.025})`;x.fillRect(Math.random()*256,Math.random()*256,1,1)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(GRID_WIDTH*1.5,GRID_HEIGHT*1.5);t.encoding=THREE.sRGBEncoding;return t}
function createEntitySkinTexture(){const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.fillStyle="#958878";x.fillRect(0,0,512,512);for(let i=0;i<900;i++){const px=Math.random()*512,py=Math.random()*512,r=4+Math.random()*30,rr=92+Math.floor(Math.random()*70),gg=72+Math.floor(Math.random()*55),bb=62+Math.floor(Math.random()*45),g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(${rr},${gg},${bb},${.07+Math.random()*.15})`);g.addColorStop(1,`rgba(${rr},${gg},${bb},0)`);x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}for(let i=0;i<38000;i++){const d=Math.floor(Math.random()*50);x.fillStyle=`rgba(${d},${d},${d},${Math.random()*.055})`;x.fillRect(Math.random()*512,Math.random()*512,Math.random()*2+.4,Math.random()*2+.4)}for(let i=0;i<100;i++){x.fillStyle=`rgba(95,42,35,${.025+Math.random()*.055})`;x.beginPath();x.arc(Math.random()*512,Math.random()*512,4+Math.random()*18,0,Math.PI*2);x.fill()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.25,1.25);t.encoding=THREE.sRGBEncoding;return t}
function createEntityBumpTexture(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#808080";x.fillRect(0,0,256,256);for(let i=0;i<28000;i++){const g=90+Math.floor(Math.random()*70);x.fillStyle=`rgb(${g},${g},${g})`;x.fillRect(Math.random()*256,Math.random()*256,Math.random()*2+.5,Math.random()*2+.5)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t}
function createEntityBodyTexture(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#11110f";x.fillRect(0,0,256,256);for(let i=0;i<19000;i++){const v=10+Math.floor(Math.random()*35);x.fillStyle=`rgba(${v},${v},${Math.max(0,v-2)},${Math.random()*.13})`;x.fillRect(Math.random()*256,Math.random()*256,Math.random()*3+.4,Math.random()*5+.4)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,3);t.encoding=THREE.sRGBEncoding;return t}
const officeLights=[];
function buildOffice(){const floorMat=new THREE.MeshStandardMaterial({color:0x4a4d51,roughness:1}),wallMat=new THREE.MeshStandardMaterial({color:0xd4d1c9,roughness:.95}),ceilingMat=new THREE.MeshStandardMaterial({color:0xcfcbbf,roughness:.92}),doorMat=new THREE.MeshStandardMaterial({color:0x5a564d,roughness:.9});const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,56),floorMat);floor.rotation.x=-Math.PI/2;officeGroup.add(floor);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(12,56),ceilingMat);ceiling.rotation.x=Math.PI/2;ceiling.position.y=3.4;officeGroup.add(ceiling);const leftWall=new THREE.Mesh(new THREE.BoxGeometry(.22,3.4,56),wallMat);leftWall.position.set(-6,1.7,0);officeGroup.add(leftWall);const rightWall=leftWall.clone();rightWall.position.x=6;officeGroup.add(rightWall);const farWall=new THREE.Mesh(new THREE.BoxGeometry(12,3.4,.22),wallMat);farWall.position.set(0,1.7,-27.9);officeGroup.add(farWall);for(let z=-22;z<=16;z+=7){const ld=new THREE.Mesh(new THREE.BoxGeometry(.08,2.4,1.25),doorMat);ld.position.set(-5.88,1.2,z);officeGroup.add(ld);const rd=ld.clone();rd.position.x=5.88;officeGroup.add(rd)}officeGroup.add(new THREE.AmbientLight(0xc7cbcf,.5));for(let z=-22;z<=22;z+=6){const panel=new THREE.Mesh(new THREE.BoxGeometry(2.2,.04,.6),new THREE.MeshBasicMaterial({color:0xf0eedf}));panel.position.set(0,3.28,z);officeGroup.add(panel);const light=new THREE.PointLight(0xe9e8d8,.8,10,1.6);light.position.set(0,3,z);officeGroup.add(light);officeLights.push(light)}}
const wallMaterial=new THREE.MeshStandardMaterial({map:makeWallpaperTexture(),color:0xbfb45a,roughness:.95}),floorMaterial=new THREE.MeshStandardMaterial({map:makeCarpetTexture(),color:0x756f45,roughness:1}),ceilingMaterial=new THREE.MeshStandardMaterial({map:makeCeilingTexture(),color:0xb1a96c,roughness:1}),trimMaterial=new THREE.MeshStandardMaterial({color:0x91884a,roughness:.9}),lightPanelMaterial=new THREE.MeshStandardMaterial({color:0xffffd2,emissive:0xffef98,emissiveIntensity:1.4});
const maze=[];for(let y=0;y<GRID_HEIGHT;y++){maze[y]=[];for(let x=0;x<GRID_WIDTH;x++)maze[y][x]={visited:false,walls:{north:true,south:true,east:true,west:true}}}
function openBetween(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;if(dx===1){maze[y1][x1].walls.east=false;maze[y2][x2].walls.west=false}else if(dx===-1){maze[y1][x1].walls.west=false;maze[y2][x2].walls.east=false}else if(dy===1){maze[y1][x1].walls.south=false;maze[y2][x2].walls.north=false}else if(dy===-1){maze[y1][x1].walls.north=false;maze[y2][x2].walls.south=false}}
function generateMaze(){const stack=[];let current={x:0,y:0};maze[0][0].visited=true;let count=1,total=GRID_WIDTH*GRID_HEIGHT;while(count<total){const options=[],x=current.x,y=current.y;if(y>0&&!maze[y-1][x].visited)options.push({x,y:y-1});if(y<GRID_HEIGHT-1&&!maze[y+1][x].visited)options.push({x,y:y+1});if(x>0&&!maze[y][x-1].visited)options.push({x:x-1,y});if(x<GRID_WIDTH-1&&!maze[y][x+1].visited)options.push({x:x+1,y});if(options.length){const next=options[Math.floor(Math.random()*options.length)];stack.push({x,y});openBetween(x,y,next.x,next.y);current=next;maze[current.y][current.x].visited=true;count++}else current=stack.pop()}for(let y=0;y<GRID_HEIGHT;y++)for(let x=0;x<GRID_WIDTH;x++){if(x<GRID_WIDTH-1&&Math.random()<EXTRA_WALL_REMOVAL){maze[y][x].walls.east=false;maze[y][x+1].walls.west=false}if(y<GRID_HEIGHT-1&&Math.random()<EXTRA_WALL_REMOVAL){maze[y][x].walls.south=false;maze[y+1][x].walls.north=false}}}
function cellToWorld(x,y){return{x:(x-GRID_WIDTH/2+.5)*CELL,z:(y-GRID_HEIGHT/2+.5)*CELL}}
function worldToCell(x,z){let cx=Math.floor(x/CELL+GRID_WIDTH/2),cy=Math.floor(z/CELL+GRID_HEIGHT/2);cx=Math.max(0,Math.min(GRID_WIDTH-1,cx));cy=Math.max(0,Math.min(GRID_HEIGHT-1,cy));return{x:cx,y:cy}}
const collisionWalls=[],fluorescentLights=[];
function createWall(x,z,w,d){const wall=new THREE.Mesh(new THREE.BoxGeometry(w,WALL_HEIGHT,d),wallMaterial);wall.position.set(x,WALL_HEIGHT/2,z);backroomsGroup.add(wall);const trim=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d+.04),trimMaterial);trim.position.set(x,.06,z);backroomsGroup.add(trim);collisionWalls.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2})}
function createColumn(x,z){const c=new THREE.Mesh(new THREE.BoxGeometry(.72,WALL_HEIGHT,.72),wallMaterial);c.position.set(x,WALL_HEIGHT/2,z);backroomsGroup.add(c);collisionWalls.push({minX:x-.36,maxX:x+.36,minZ:z-.36,maxZ:z+.36})}
function createFluorescent(x,z,rotation){const frame=new THREE.Mesh(new THREE.BoxGeometry(2.15,.09,.62),new THREE.MeshStandardMaterial({color:0x666043,roughness:.8}));frame.position.set(x,WALL_HEIGHT-.05,z);frame.rotation.y=rotation;backroomsGroup.add(frame);const panel=new THREE.Mesh(new THREE.BoxGeometry(1.9,.04,.42),lightPanelMaterial);panel.position.set(x,WALL_HEIGHT-.12,z);panel.rotation.y=rotation;backroomsGroup.add(panel);const light=new THREE.PointLight(0xffe98d,.7,13,1.5);light.position.set(x,WALL_HEIGHT-.45,z);backroomsGroup.add(light);fluorescentLights.push(light)}
function getNeighbors(x,y){const c=maze[y][x],n=[];if(!c.walls.north&&y>0)n.push({x,y:y-1});if(!c.walls.south&&y<GRID_HEIGHT-1)n.push({x,y:y+1});if(!c.walls.east&&x<GRID_WIDTH-1)n.push({x:x+1,y});if(!c.walls.west&&x>0)n.push({x:x-1,y});return n}
function findFarthestCell(){const q=[{x:0,y:0,d:0}],v=new Set(["0,0"]);let f=q[0];while(q.length){const c=q.shift();if(c.d>f.d)f=c;for(const n of getNeighbors(c.x,c.y)){const k=`${n.x},${n.y}`;if(v.has(k))continue;v.add(k);q.push({x:n.x,y:n.y,d:c.d+1})}}return f}
function buildBackrooms(){generateMaze();const ww=GRID_WIDTH*CELL,wd=GRID_HEIGHT*CELL;const floor=new THREE.Mesh(new THREE.PlaneGeometry(ww,wd),floorMaterial);floor.rotation.x=-Math.PI/2;backroomsGroup.add(floor);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(ww,wd),ceilingMaterial);ceiling.rotation.x=Math.PI/2;ceiling.position.y=WALL_HEIGHT;backroomsGroup.add(ceiling);for(let y=0;y<GRID_HEIGHT;y++)for(let x=0;x<GRID_WIDTH;x++){const c=maze[y][x],p=cellToWorld(x,y);if(c.walls.north)createWall(p.x,p.z-CELL/2,CELL+WALL_THICKNESS,WALL_THICKNESS);if(c.walls.west)createWall(p.x-CELL/2,p.z,WALL_THICKNESS,CELL+WALL_THICKNESS);if(y===GRID_HEIGHT-1&&c.walls.south)createWall(p.x,p.z+CELL/2,CELL+WALL_THICKNESS,WALL_THICKNESS);if(x===GRID_WIDTH-1&&c.walls.east)createWall(p.x+CELL/2,p.z,WALL_THICKNESS,CELL+WALL_THICKNESS)}for(let y=1;y<GRID_HEIGHT-1;y+=2)for(let x=1;x<GRID_WIDTH-1;x+=2)if(Math.random()<.24){const p=cellToWorld(x,y);createColumn(p.x+CELL/2,p.z+CELL/2)}backroomsGroup.add(new THREE.HemisphereLight(0xbeb46a,0x27230f,.58));backroomsGroup.add(new THREE.AmbientLight(0x5d5628,.5));for(let y=0;y<GRID_HEIGHT;y+=3)for(let x=0;x<GRID_WIDTH;x+=3){const p=cellToWorld(x,y);createFluorescent(p.x,p.z,Math.random()>.5?0:Math.PI/2)}}
buildOffice();buildBackrooms();
const exitCell=findFarthestCell(),exitWorld=cellToWorld(exitCell.x,exitCell.y),exitGroup=new THREE.Group();const exitFrame=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.8,.18),new THREE.MeshStandardMaterial({color:0x3f3926,roughness:.9}));exitFrame.position.y=1.4;exitGroup.add(exitFrame);const exitDoor=new THREE.Mesh(new THREE.BoxGeometry(1.42,2.5,.22),new THREE.MeshStandardMaterial({color:0x31412c,emissive:0x091509,roughness:.85}));exitDoor.position.y=1.26;exitGroup.add(exitDoor);const exitLight=new THREE.PointLight(0x88ff72,1.6,8);exitLight.position.set(0,1.7,.5);exitGroup.add(exitLight);exitGroup.position.set(exitWorld.x,0,exitWorld.z);backroomsGroup.add(exitGroup);
const playerStart=cellToWorld(0,0);let yaw=Math.PI,pitch=0,stamina=100,movementTime=0;const keys={};
/* MONSTER */
const entitySkinTexture=createEntitySkinTexture(),entityBumpTexture=createEntityBumpTexture(),entityBodyTexture=createEntityBodyTexture();
const entitySkinMaterial=new THREE.MeshStandardMaterial({map:entitySkinTexture,bumpMap:entityBumpTexture,bumpScale:.028,color:0xaaa08e,roughness:.97,metalness:0});
const entityBodyMaterial=new THREE.MeshStandardMaterial({map:entityBodyTexture,color:0x20201d,roughness:1,metalness:0});
const entityBlackMaterial=new THREE.MeshStandardMaterial({color:0x020202,roughness:1});
const entityEyeMaterial=new THREE.MeshStandardMaterial({color:0x010101,roughness:.2,metalness:0});
const monster=new THREE.Group(),monsterRig=new THREE.Group();monster.add(monsterRig);backroomsGroup.add(monster);
const monsterShadow=new THREE.Mesh(new THREE.CircleGeometry(.54,28),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.26}));monsterShadow.rotation.x=-Math.PI/2;monsterShadow.position.y=.012;monster.add(monsterShadow);
const monsterPelvis=new THREE.Mesh(new THREE.SphereGeometry(.155,20,14),entityBodyMaterial);monsterPelvis.scale.set(1.02,.62,.72);monsterPelvis.position.set(0,1.02,0);monsterRig.add(monsterPelvis);

/* Organic narrow torso instead of a blocky cylinder */
const torsoProfile=[new THREE.Vector2(.105,-.42),new THREE.Vector2(.115,-.30),new THREE.Vector2(.105,-.15),new THREE.Vector2(.125,.02),new THREE.Vector2(.165,.22),new THREE.Vector2(.205,.39),new THREE.Vector2(.185,.50)];
const monsterTorso=new THREE.Mesh(new THREE.LatheGeometry(torsoProfile,24),entityBodyMaterial);monsterTorso.position.set(0,1.66,0);monsterTorso.scale.z=.54;monsterRig.add(monsterTorso);

const monsterNeck=new THREE.Mesh(new THREE.CylinderGeometry(.052,.072,.30,14),entitySkinMaterial);monsterNeck.position.set(0,2.34,.02);monsterNeck.rotation.x=.10;monsterRig.add(monsterNeck);

/* Head pivot */
const monsterHeadPivot=new THREE.Group();monsterHeadPivot.position.set(0,2.53,-.012);monsterRig.add(monsterHeadPivot);

/* Deform the actual head vertices so the silhouette is skull-like instead of egg-shaped */
const headGeometry=new THREE.SphereGeometry(.235,32,24);
const headPos=headGeometry.attributes.position;
for(let i=0;i<headPos.count;i++){
    let x=headPos.getX(i),y=headPos.getY(i),z=headPos.getZ(i);
    const ny=y/.235;
    let width=1;
    if(ny<-.58) width=.50;
    else if(ny<-.28) width=.62;
    else if(ny<.10) width=.75;
    else if(ny<.62) width=.82;
    else width=.72;
    x*=width;
    y*=1.15;
    z*=.76;
    /* flatten the face without flattening the back of the skull */
    if(z<0) z*=.84;
    /* slightly recede the temples */
    if(Math.abs(ny)<.32 && Math.abs(x)>.11) x*=.91;
    headPos.setXYZ(i,x,y,z);
}
headPos.needsUpdate=true;headGeometry.computeVertexNormals();
const monsterHead=new THREE.Mesh(headGeometry,entitySkinMaterial);monsterHead.position.set(0,.035,0);monsterHeadPivot.add(monsterHead);

const rightSocket=new THREE.Mesh(new THREE.SphereGeometry(.041,18,14),entityBlackMaterial);rightSocket.scale.set(.78,1.12,.18);rightSocket.position.set(.055,.024,-.175);monsterHeadPivot.add(rightSocket);

const leftEye=new THREE.Mesh(new THREE.SphereGeometry(.009,10,8),entityEyeMaterial);leftEye.position.set(-.057,.026,-.190);monsterHeadPivot.add(leftEye);

/* Skin lids partially cover the sockets */
const leftUpperLid=new THREE.Mesh(new THREE.SphereGeometry(.040,12,8),entitySkinMaterial);leftUpperLid.scale.set(.90,.20,.18);leftUpperLid.position.set(-.057,.062,-.181);leftUpperLid.rotation.z=-.07;monsterHeadPivot.add(leftUpperLid);
const rightUpperLid=leftUpperLid.clone();rightUpperLid.position.set(.055,.056,-.180);rightUpperLid.rotation.z=.06;monsterHeadPivot.add(rightUpperLid);

/* Thin nose */
const noseBridge=new THREE.Mesh(new THREE.CylinderGeometry(.011,.015,.082,8),entitySkinMaterial);noseBridge.position.set(-.002,-.035,-.171);noseBridge.rotation.x=Math.PI/2;monsterHeadPivot.add(noseBridge);
const noseTip=new THREE.Mesh(new THREE.SphereGeometry(.018,10,8),entitySkinMaterial);noseTip.scale.set(.74,.52,.66);noseTip.position.set(-.002,-.079,-.181);monsterHeadPivot.add(noseTip);

/* Small crooked mouth */
const mouthMaterial=new THREE.MeshBasicMaterial({color:0x090706});
const monsterMouth=new THREE.Mesh(new THREE.BoxGeometry(.060,.008,.009),mouthMaterial);monsterMouth.position.set(-.004,-.138,-.158);monsterMouth.rotation.z=-.055;monsterHeadPivot.add(monsterMouth);

/* Limbs */
function createEntityLimb(x,y,upperLength,lowerLength,upperRadius,lowerRadius,lowerMaterial){const upperPivot=new THREE.Group();upperPivot.position.set(x,y,0);monsterRig.add(upperPivot);const upper=new THREE.Mesh(new THREE.CylinderGeometry(upperRadius*.80,upperRadius,upperLength,12),entityBodyMaterial);upper.position.y=-upperLength/2;upperPivot.add(upper);const joint=new THREE.Mesh(new THREE.SphereGeometry(upperRadius*.80,10,8),entityBodyMaterial);joint.position.y=-upperLength;upperPivot.add(joint);const lowerPivot=new THREE.Group();lowerPivot.position.y=-upperLength;upperPivot.add(lowerPivot);const lower=new THREE.Mesh(new THREE.CylinderGeometry(lowerRadius*.72,lowerRadius,lowerLength,12),lowerMaterial);lower.position.y=-lowerLength/2;lowerPivot.add(lower);return{upperPivot,lowerPivot,upper,lower}}

const leftArm=createEntityLimb(-.215,2.12,.86,.93,.052,.045,entitySkinMaterial),rightArm=createEntityLimb(.215,2.10,.89,.95,.052,.045,entitySkinMaterial);leftArm.upperPivot.rotation.z=.075;rightArm.upperPivot.rotation.z=-.075;

/* Hands with actual finger shapes instead of clubs */
function createEntityHand(mirror=1){const hand=new THREE.Group();const palm=new THREE.Mesh(new THREE.SphereGeometry(.060,16,12),entitySkinMaterial);palm.scale.set(.82,1.28,.54);palm.position.y=-.055;hand.add(palm);for(let i=0;i<4;i++){const fingerLen=.105-i*.006;const finger=new THREE.Mesh(new THREE.CylinderGeometry(.010,.012,fingerLen,8),entitySkinMaterial);finger.position.set((i-1.5)*.024,-.145-(i%2)*.006,0);finger.rotation.z=(i-1.5)*.025;hand.add(finger)}const thumb=new THREE.Mesh(new THREE.CylinderGeometry(.012,.014,.085,8),entitySkinMaterial);thumb.position.set(.063*mirror,-.072,-.004);thumb.rotation.z=-.58*mirror;hand.add(thumb);return hand}
const leftHand=createEntityHand(-1);leftHand.position.y=-.93;leftArm.lowerPivot.add(leftHand);const rightHand=createEntityHand(1);rightHand.position.y=-.95;rightArm.lowerPivot.add(rightHand);

const leftLeg=createEntityLimb(-.105,1.02,.65,.72,.071,.054,entityBodyMaterial),rightLeg=createEntityLimb(.105,1.02,.67,.70,.071,.054,entityBodyMaterial);
const leftFoot=new THREE.Mesh(new THREE.SphereGeometry(.09,14,10),entityBodyMaterial);leftFoot.scale.set(.78,.48,1.70);leftFoot.position.set(0,-.73,.09);leftLeg.lowerPivot.add(leftFoot);const rightFoot=leftFoot.clone();rightFoot.position.y=-.71;rightLeg.lowerPivot.add(rightFoot);
monsterRig.rotation.x=.050;
const monsterSpawn=cellToWorld(Math.floor(GRID_WIDTH*.66),Math.floor(GRID_HEIGHT*.66));monster.position.set(monsterSpawn.x,0,monsterSpawn.z);monster.visible=false;let monsterPath=[],monsterPathTimer=0,monsterActiveTimer=10;
function findPath(start,target){const q=[{x:start.x,y:start.y,path:[]}],v=new Set([`${start.x},${start.y}`]);while(q.length){const c=q.shift();if(c.x===target.x&&c.y===target.y)return c.path;for(const n of getNeighbors(c.x,c.y)){const k=`${n.x},${n.y}`;if(v.has(k))continue;v.add(k);q.push({x:n.x,y:n.y,path:[...c.path,n]})}}return[]}
let mode="title",cutsceneTime=0,cutsceneFinished=false,audioContext=null;
function startAudio(){if(audioContext)return;audioContext=new (window.AudioContext||window.webkitAudioContext)();const master=audioContext.createGain();master.gain.value=.027;master.connect(audioContext.destination);const hum=audioContext.createOscillator();hum.type="sine";hum.frequency.value=60;hum.connect(master);hum.start();const high=audioContext.createOscillator(),hg=audioContext.createGain();high.type="sine";high.frequency.value=119.6;hg.gain.value=.18;high.connect(hg);hg.connect(master);high.start()}
function setOfficePreviewCamera(){camera.position.set(0,1.72,13);camera.rotation.set(0,0,0)}
function beginCutscene(){startAudio();mode="cutscene";cutsceneTime=0;cutsceneFinished=false;startScreen.style.display="none";topBar.style.display="block";bottomBar.style.display="block";cutsceneCaption.style.opacity="1";officeGroup.visible=true;backroomsGroup.visible=false;setOfficeAtmosphere();camera.position.set(0,1.72,14);camera.rotation.set(0,0,0)}
function updateCutscene(delta){cutsceneTime+=delta;if(cutsceneTime<3.8){camera.position.z=14-cutsceneTime*2.5;camera.position.y=1.72+Math.sin(cutsceneTime*8)*.02;camera.rotation.x=Math.sin(cutsceneTime*1.4)*.006;camera.rotation.z=0;if(cutsceneTime>2.1)cutsceneCaption.style.opacity="0"}if(cutsceneTime>3.3&&cutsceneTime<4.25){if(Math.random()<.35){const light=officeLights[Math.floor(Math.random()*officeLights.length)];if(light){const original=light.intensity;light.intensity=Math.random()<.5?.05:.65;setTimeout(()=>light.intensity=original,50)}}camera.rotation.z=(Math.random()-.5)*.008}if(cutsceneTime>=4.25&&cutsceneTime<5.05){const f=(cutsceneTime-4.25)/.8;camera.position.y=1.72-f*5.3;camera.rotation.x=f*.9;camera.rotation.z=f*.15;fadeLayer.style.opacity=String(Math.min(1,f*1.4))}if(cutsceneTime>=5.05&&!cutsceneFinished){cutsceneFinished=true;setTimeout(wakeInBackrooms,600)}}
function wakeInBackrooms(){mode="wake";officeGroup.visible=false;backroomsGroup.visible=true;setBackroomsAtmosphere();topBar.style.display="none";bottomBar.style.display="none";cutsceneCaption.style.opacity="0";camera.position.set(playerStart.x,.58,playerStart.z);yaw=Math.PI;pitch=.28;camera.rotation.set(pitch,yaw,0);wakeScreen.style.display="flex";setTimeout(()=>fadeLayer.style.opacity="0",40)}
function startPlaying(){mode="playing";wakeScreen.style.display="none";hud.style.display="block";camera.position.y=PLAYER_HEIGHT;pitch=0;camera.rotation.set(0,yaw,0);renderer.domElement.requestPointerLock()}
document.addEventListener("keydown",e=>keys[e.code]=true);document.addEventListener("keyup",e=>keys[e.code]=false);document.addEventListener("mousemove",e=>{if(document.pointerLockElement!==renderer.domElement||mode!=="playing")return;const s=.0019;yaw-=e.movementX*s;pitch-=e.movementY*s;pitch=Math.max(-1.42,Math.min(1.42,pitch));camera.rotation.y=yaw;camera.rotation.x=pitch;camera.rotation.z=0});
function hitsWall(x,z){for(const wall of collisionWalls){const cx=Math.max(wall.minX,Math.min(x,wall.maxX)),cz=Math.max(wall.minZ,Math.min(z,wall.maxZ)),dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<PLAYER_RADIUS*PLAYER_RADIUS)return true}return false}
function updatePlayer(delta){if(document.pointerLockElement!==renderer.domElement)return;let forward=0,sideways=0;if(keys.KeyW)forward++;if(keys.KeyS)forward--;if(keys.KeyD)sideways++;if(keys.KeyA)sideways--;const moving=forward!==0||sideways!==0,sprinting=moving&&forward>0&&stamina>0&&(keys.ShiftLeft||keys.ShiftRight),speed=sprinting?SPRINT_SPEED:WALK_SPEED;if(sprinting)stamina-=delta*21;else stamina+=delta*13;stamina=Math.max(0,Math.min(100,stamina));staminaInner.style.width=stamina+"%";const targetFov=sprinting?77:72;camera.fov+=(targetFov-camera.fov)*Math.min(delta*7,1);camera.updateProjectionMatrix();camera.rotation.z=0;if(!moving){camera.position.y+=(PLAYER_HEIGHT-camera.position.y)*Math.min(delta*8,1);return}const len=Math.sqrt(forward*forward+sideways*sideways);forward/=len;sideways/=len;const sin=Math.sin(yaw),cos=Math.cos(yaw),dx=(-sin*forward+cos*sideways)*speed*delta,dz=(-cos*forward-sin*sideways)*speed*delta,nx=camera.position.x+dx,nz=camera.position.z+dz;if(!hitsWall(nx,camera.position.z))camera.position.x=nx;if(!hitsWall(camera.position.x,nz))camera.position.z=nz;movementTime+=delta*(sprinting?12:8);camera.position.y=PLAYER_HEIGHT+Math.sin(movementTime)*(sprinting?.045:.027)}
function updateMonster(delta){monsterActiveTimer-=delta;if(monsterActiveTimer>0)return;monster.visible=true;const pc=worldToCell(camera.position.x,camera.position.z),mc=worldToCell(monster.position.x,monster.position.z);monsterPathTimer-=delta;if(monsterPathTimer<=0){monsterPathTimer=.45;monsterPath=findPath(mc,pc)}let moving=false;if(monsterPath.length){const next=monsterPath[0],target=cellToWorld(next.x,next.y),dx=target.x-monster.position.x,dz=target.z-monster.position.z,dist=Math.sqrt(dx*dx+dz*dz);if(dist<.13)monsterPath.shift();else{moving=true;const dirX=dx/dist,dirZ=dz/dist;monster.position.x+=dirX*MONSTER_SPEED*delta;monster.position.z+=dirZ*MONSTER_SPEED*delta;monster.rotation.y=Math.atan2(dirX,dirZ)+Math.PI}}const t=performance.now()*.001,walk=Math.sin(t*6.1)*(moving?1:.025);monsterRig.position.y=Math.sin(t*3.1)*.008;monsterRig.rotation.z=Math.sin(t*.7)*.009;monsterRig.rotation.x=.055+Math.sin(t*.75)*.006;leftLeg.upperPivot.rotation.x=-walk*.23;rightLeg.upperPivot.rotation.x=walk*.23;leftLeg.lowerPivot.rotation.x=Math.max(0,walk)*.15;rightLeg.lowerPivot.rotation.x=Math.max(0,-walk)*.15;leftArm.upperPivot.rotation.x=.055+walk*.19;rightArm.upperPivot.rotation.x=.035-walk*.22;leftArm.lowerPivot.rotation.x=-.05+Math.max(0,-walk)*.08;rightArm.lowerPivot.rotation.x=-.035+Math.max(0,walk)*.09;monsterHeadPivot.rotation.z=Math.sin(t*.55)*.018;monsterHeadPivot.rotation.x=-.035+Math.sin(t*.42)*.010;monsterHeadPivot.rotation.y=Math.sin(t*.31)*.018;const twitch=Math.pow(Math.max(0,Math.sin(t*.77)),46);monsterHeadPivot.rotation.y+=twitch*.07;const pdx=monster.position.x-camera.position.x,pdz=monster.position.z-camera.position.z,pd=Math.sqrt(pdx*pdx+pdz*pdz);let dangerAmount=0;if(pd<12)dangerAmount=1-pd/12;danger.style.opacity=String(dangerAmount*.53);if(pd<.92)loseGame()}
let flickerTimer=0;function updateLights(delta){flickerTimer-=delta;if(flickerTimer>0)return;flickerTimer=.1+Math.random()*1.7;if(Math.random()>.22)return;const light=fluorescentLights[Math.floor(Math.random()*fluorescentLights.length)];if(!light)return;const original=light.intensity;light.intensity=.02;setTimeout(()=>light.intensity=original,50+Math.random()*100)}
function checkExit(){const dx=camera.position.x-exitGroup.position.x,dz=camera.position.z-exitGroup.position.z;if(dx*dx+dz*dz<2.2)winGame()}
function winGame(){if(mode==="end")return;mode="end";document.exitPointerLock();hud.style.display="none";endScreen.style.display="flex";endTitle.textContent="YOU ESCAPED";endTitle.style.color="#d9ffc7";endSub.textContent="At least... you think you did."}
function loseGame(){if(mode==="end")return;mode="end";document.exitPointerLock();danger.style.opacity=".85";setTimeout(()=>{hud.style.display="none";endScreen.style.display="flex";endTitle.textContent="YOU WERE FOUND";endTitle.style.color="#912727";endSub.textContent="Something almost human was wandering the halls."},280)}
startButton.addEventListener("click",beginCutscene);wakeButton.addEventListener("click",startPlaying);restartButton.addEventListener("click",()=>location.reload());renderer.domElement.addEventListener("click",()=>{if(mode==="playing"&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});document.addEventListener("pointerlockchange",()=>{if(mode!=="playing")return;pauseText.style.display=document.pointerLockElement===renderer.domElement?"none":"block"});window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
officeGroup.visible=true;backroomsGroup.visible=false;setOfficeAtmosphere();setOfficePreviewCamera();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const delta=Math.min(clock.getDelta(),.05);if(mode==="title"){camera.position.x=Math.sin(performance.now()*.00035)*.12;camera.position.y=1.72+Math.sin(performance.now()*.001)*.01;const titleYaw=Math.sin(performance.now()*.00045)*.02;camera.rotation.set(0,titleYaw,0)}if(mode==="cutscene")updateCutscene(delta);if(mode==="playing"){updatePlayer(delta);updateMonster(delta);updateLights(delta);checkExit()}renderer.render(scene,camera)}animate();
