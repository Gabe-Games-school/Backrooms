<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Backrooms</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

/* =========================================================
   START SCREEN
========================================================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.58) 0%,
            rgba(0,0,0,0.18) 38%,
            transparent 68%
        );
}

#introContent {
    position: absolute;
    left: 32px;
    top: 30px;
    pointer-events: auto;
}

#introTitle {
    margin: 0;

    color: #f1e9a3;

    font-size: clamp(32px, 4vw, 58px);

    font-weight: 300;

    letter-spacing: 13px;

    text-shadow:
        0 0 15px rgba(255,235,130,0.25);
}

#introText {
    margin-top: 14px;

    color: rgba(255,255,255,0.85);

    font-size: 15px;

    line-height: 1.55;
}

#controls {
    margin-top: 18px;

    color: rgba(255,255,255,0.82);

    font-family: monospace;

    letter-spacing: 1px;
}

#enterButton {
    margin-top: 20px;

    width: 260px;
    height: 56px;

    border: 1px solid #eee49a;

    background: rgba(0,0,0,0.55);

    color: #f2e89b;

    font-size: 22px;

    letter-spacing: 8px;

    cursor: pointer;
}

#enterButton:hover {
    background: rgba(67,61,24,0.72);
}


/* =========================================================
   HUD
========================================================= */

#hud {
    position: fixed;
    inset: 0;

    z-index: 30;

    pointer-events: none;
}

#objective {
    position: absolute;

    top: 27px;
    right: 28px;

    padding: 13px 40px;

    border: 1px solid rgba(255,255,255,0.27);

    background: rgba(0,0,0,0.38);

    color: white;

    letter-spacing: 6px;

    font-family: monospace;

    font-size: 16px;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform: translate(-50%, -50%);

    opacity: 0.78;
}

#crosshair::before {
    content: "";

    position: absolute;

    width: 18px;
    height: 2px;

    top: 8px;

    background: white;
}

#crosshair::after {
    content: "";

    position: absolute;

    width: 2px;
    height: 18px;

    left: 8px;

    background: white;
}

#staminaHolder {
    position: absolute;

    left: 36px;
    bottom: 34px;

    width: 355px;
}

#staminaLabel {
    margin-bottom: 10px;

    color: white;

    font-size: 16px;

    letter-spacing: 6px;
}

#staminaOuter {
    height: 24px;

    padding: 3px;

    border: 2px solid white;

    background: rgba(0,0,0,0.3);
}

#staminaInner {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #e6d65d,
            #fff3aa
        );
}

#pauseText {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 16px 24px;

    background: rgba(0,0,0,0.72);

    color: white;

    letter-spacing: 4px;
}


/* =========================================================
   EFFECTS
========================================================= */

#vignette {
    position: fixed;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    box-shadow:
        inset 0 0 160px 30px rgba(0,0,0,0.70);
}

#grain {
    position: fixed;

    inset: 0;

    z-index: 21;

    pointer-events: none;

    opacity: 0.09;

    background-image:
        repeating-radial-gradient(
            circle at 20% 25%,
            rgba(255,255,255,0.22) 0px,
            rgba(255,255,255,0.05) 1px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode: soft-light;

    animation: grainMove 0.12s infinite;
}

@keyframes grainMove {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-2px,2px); }
    50%  { transform: translate(2px,-1px); }
    75%  { transform: translate(1px,2px); }
    100% { transform: translate(0,0); }
}

#danger {
    position: fixed;

    inset: 0;

    z-index: 22;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(100,0,0,0.75)
        );
}


/* =========================================================
   END SCREEN
========================================================= */

#endScreen {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 300;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #020202;

    color: white;
}

#endTitle {
    font-size: clamp(42px,8vw,100px);

    font-weight: 300;

    letter-spacing: 9px;
}

#endSub {
    margin-top: 14px;

    color: #999;

    letter-spacing: 2px;
}

#restartButton {
    margin-top: 30px;

    padding: 15px 32px;

    border: 1px solid #aaa;

    background: #111;

    color: white;

    letter-spacing: 4px;

    cursor: pointer;
}
</style>
</head>

<body>

<div id="intro">

    <div id="introContent">

        <h1 id="introTitle">
            THE BACKROOMS
        </h1>

        <div id="introText">
            You don't remember how you got here.<br>
            Find the exit.<br>
            Do not let it find you.
        </div>

        <div id="controls">
            WASD = MOVE &nbsp; | &nbsp;
            SHIFT = SPRINT &nbsp; | &nbsp;
            MOUSE = LOOK
        </div>

        <button id="enterButton">
            ENTER
        </button>

    </div>

</div>


<div id="hud">

    <div id="objective">
        FIND THE EXIT
    </div>

    <div id="crosshair"></div>

    <div id="staminaHolder">

        <div id="staminaLabel">
            STAMINA
        </div>

        <div id="staminaOuter">

            <div id="staminaInner"></div>

        </div>

    </div>

    <div id="pauseText">
        CLICK TO CONTINUE
    </div>

</div>


<div id="vignette"></div>
<div id="grain"></div>
<div id="danger"></div>


<div id="endScreen">

    <div id="endTitle"></div>

    <div id="endSub"></div>

    <button id="restartButton">
        RESTART
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* ============================================================
   SETTINGS
============================================================ */

const GRID_WIDTH = 18;
const GRID_HEIGHT = 18;

const CELL = 5.8;

const WALL_HEIGHT = 3.65;
const WALL_THICKNESS = 0.18;

const PLAYER_HEIGHT = 1.63;
const PLAYER_RADIUS = 0.32;

const WALK_SPEED = 3.15;
const SPRINT_SPEED = 5.6;

const MONSTER_SPEED = 2.15;

const WALL_REMOVE_CHANCE = 0.42;


/* ============================================================
   UI
============================================================ */

const intro =
    document.getElementById("intro");

const enterButton =
    document.getElementById("enterButton");

const staminaInner =
    document.getElementById("staminaInner");

const pauseText =
    document.getElementById("pauseText");

const danger =
    document.getElementById("danger");

const endScreen =
    document.getElementById("endScreen");

const endTitle =
    document.getElementById("endTitle");

const endSub =
    document.getElementById("endSub");

const restartButton =
    document.getElementById("restartButton");


/* ============================================================
   THREE.JS
============================================================ */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x5b572f);


scene.fog =
    new THREE.Fog(
        0x635e34,
        12,
        52
    );


const camera =
    new THREE.PerspectiveCamera(
        72,
        window.innerWidth /
        window.innerHeight,
        0.08,
        160
    );


camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.7
    )
);


renderer.outputEncoding =
    THREE.sRGBEncoding;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    0.75;


document.body.insertBefore(
    renderer.domElement,
    document.body.firstChild
);


/* ============================================================
   WALLPAPER TEXTURE
============================================================ */

function createWallpaperTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#b4a94f";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let x = 0;
        x < 256;
        x += 32
    ) {

        ctx.fillStyle =
            "rgba(65,58,20,0.14)";


        ctx.fillRect(
            x,
            0,
            2,
            256
        );


        for (
            let y = 0;
            y < 256;
            y += 32
        ) {

            ctx.strokeStyle =
                "rgba(65,58,20,0.23)";


            ctx.lineWidth =
                2;


            ctx.beginPath();

            ctx.moveTo(
                x + 9,
                y + 22
            );

            ctx.lineTo(
                x + 16,
                y + 9
            );

            ctx.lineTo(
                x + 23,
                y + 22
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                x + 11,
                y + 27
            );

            ctx.lineTo(
                x + 16,
                y + 18
            );

            ctx.lineTo(
                x + 21,
                y + 27
            );

            ctx.stroke();

        }

    }


    for (
        let i = 0;
        i < 3500;
        i++
    ) {

        const bright =
            Math.random() >
            0.5
                ? 255
                : 0;


        ctx.fillStyle =
            `rgba(${bright},${bright},${bright},${Math.random() * 0.025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(canvas);


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1.8,
        1.8
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   CARPET TEXTURE
============================================================ */

function createCarpetTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#514b2e";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    for (
        let i = 0;
        i < 17000;
        i++
    ) {

        const value =
            60 +
            Math.floor(
                Math.random() *
                55
            );


        ctx.fillStyle =
            `rgba(${value},${value - 7},${value - 27},0.14)`;


        ctx.fillRect(

            Math.random() *
            256,

            Math.random() *
            256,

            Math.random() *
            2 +
            0.3,

            Math.random() *
            4 +
            0.5

        );

    }


    const texture =
        new THREE.CanvasTexture(canvas);


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        30,
        30
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   CEILING TEXTURE
============================================================ */

function createCeilingTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#a39c65";


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    ctx.strokeStyle =
        "rgba(40,36,20,0.55)";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    ctx.moveTo(
        128,
        0
    );


    ctx.lineTo(
        128,
        256
    );


    ctx.moveTo(
        0,
        128
    );


    ctx.lineTo(
        256,
        128
    );


    ctx.stroke();


    for (
        let i = 0;
        i < 2200;
        i++
    ) {

        ctx.fillStyle =
            `rgba(0,0,0,${Math.random() * 0.025})`;


        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            1,
            1
        );

    }


    const texture =
        new THREE.CanvasTexture(canvas);


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        GRID_WIDTH * 1.5,
        GRID_HEIGHT * 1.5
    );


    texture.encoding =
        THREE.sRGBEncoding;


    return texture;

}


/* ============================================================
   MATERIALS
============================================================ */

const wallpaper =
    createWallpaperTexture();


const carpet =
    createCarpetTexture();


const ceilingTexture =
    createCeilingTexture();


const wallMaterial =
    new THREE.MeshStandardMaterial({

        map: wallpaper,

        color: 0xbfb45a,

        roughness: 0.94

    });


const floorMaterial =
    new THREE.MeshStandardMaterial({

        map: carpet,

        color: 0x777045,

        roughness: 1

    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        map: ceilingTexture,

        color: 0xb0a86a,

        roughness: 1

    });


const trimMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x918849,

        roughness: 0.9

    });


const lightMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xffffd1,

        emissive: 0xffef96,

        emissiveIntensity: 1.5

    });


/* ============================================================
   MAZE DATA
============================================================ */

const maze = [];


for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
) {

    maze[y] =
        [];


    for (
        let x = 0;
        x < GRID_WIDTH;
        x++
    ) {

        maze[y][x] =
            {

                visited: false,

                walls: {

                    north: true,

                    south: true,

                    east: true,

                    west: true

                }

            };

    }

}


/* ============================================================
   GENERATE MAZE
============================================================ */

function openBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;


    const dy =
        y2 - y1;


    if (
        dx === 1
    ) {

        maze[y1][x1].walls.east =
            false;


        maze[y2][x2].walls.west =
            false;

    }


    else if (
        dx === -1
    ) {

        maze[y1][x1].walls.west =
            false;


        maze[y2][x2].walls.east =
            false;

    }


    else if (
        dy === 1
    ) {

        maze[y1][x1].walls.south =
            false;


        maze[y2][x2].walls.north =
            false;

    }


    else if (
        dy === -1
    ) {

        maze[y1][x1].walls.north =
            false;


        maze[y2][x2].walls.south =
            false;

    }

}


function generateMaze() {

    const stack =
        [];


    let current =
        {
            x: 0,
            y: 0
        };


    maze[0][0].visited =
        true;


    let visited =
        1;


    const total =
        GRID_WIDTH *
        GRID_HEIGHT;


    while (
        visited <
        total
    ) {

        const options =
            [];


        const x =
            current.x;


        const y =
            current.y;


        if (
            y > 0 &&
            !maze[y - 1][x].visited
        ) {

            options.push({
                x,
                y: y - 1
            });

        }


        if (
            y <
            GRID_HEIGHT - 1 &&
            !maze[y + 1][x].visited
        ) {

            options.push({
                x,
                y: y + 1
            });

        }


        if (
            x <
            GRID_WIDTH - 1 &&
            !maze[y][x + 1].visited
        ) {

            options.push({
                x: x + 1,
                y
            });

        }


        if (
            x > 0 &&
            !maze[y][x - 1].visited
        ) {

            options.push({
                x: x - 1,
                y
            });

        }


        if (
            options.length
        ) {

            const next =
                options[
                    Math.floor(
                        Math.random() *
                        options.length
                    )
                ];


            stack.push({
                x,
                y
            });


            openBetween(
                x,
                y,
                next.x,
                next.y
            );


            current =
                next;


            maze[current.y][current.x].visited =
                true;


            visited++;

        }

        else {

            current =
                stack.pop();

        }

    }


    /* remove lots of extra walls */

    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            if (
                x <
                GRID_WIDTH - 1 &&
                Math.random() <
                WALL_REMOVE_CHANCE
            ) {

                maze[y][x].walls.east =
                    false;


                maze[y][x + 1].walls.west =
                    false;

            }


            if (
                y <
                GRID_HEIGHT - 1 &&
                Math.random() <
                WALL_REMOVE_CHANCE
            ) {

                maze[y][x].walls.south =
                    false;


                maze[y + 1][x].walls.north =
                    false;

            }

        }

    }

}


generateMaze();


/* ============================================================
   COORDINATE HELPERS
============================================================ */

function cellWorld(
    x,
    y
) {

    return {

        x:
            (
                x -
                GRID_WIDTH / 2 +
                0.5
            ) *
            CELL,

        z:
            (
                y -
                GRID_HEIGHT / 2 +
                0.5
            ) *
            CELL

    };

}


function worldCell(
    x,
    z
) {

    let cx =
        Math.floor(
            x /
            CELL +
            GRID_WIDTH /
            2
        );


    let cy =
        Math.floor(
            z /
            CELL +
            GRID_HEIGHT /
            2
        );


    cx =
        Math.max(
            0,
            Math.min(
                GRID_WIDTH - 1,
                cx
            )
        );


    cy =
        Math.max(
            0,
            Math.min(
                GRID_HEIGHT - 1,
                cy
            )
        );


    return {
        x: cx,
        y: cy
    };

}


/* ============================================================
   FLOOR
============================================================ */

const worldWidth =
    GRID_WIDTH *
    CELL;


const worldDepth =
    GRID_HEIGHT *
    CELL;


const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            worldWidth,
            worldDepth
        ),

        floorMaterial

    );


floor.rotation.x =
    -Math.PI / 2;


scene.add(
    floor
);


/* ============================================================
   CEILING
============================================================ */

const ceiling =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            worldWidth,
            worldDepth
        ),

        ceilingMaterial

    );


ceiling.rotation.x =
    Math.PI / 2;


ceiling.position.y =
    WALL_HEIGHT;


scene.add(
    ceiling
);


/* ============================================================
   WALL COLLIDERS
============================================================ */

const collisionWalls =
    [];


/* ============================================================
   WALL CREATOR
============================================================ */

function createWall(
    x,
    z,
    width,
    depth
) {

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                WALL_HEIGHT,
                depth
            ),

            wallMaterial

        );


    wall.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );


    scene.add(
        wall
    );


    collisionWalls.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2

    });


    const trim =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                0.12,
                depth +
                0.04
            ),

            trimMaterial

        );


    trim.position.set(
        x,
        0.06,
        z
    );


    scene.add(
        trim
    );

}


/* ============================================================
   BUILD WALLS
============================================================ */

for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
) {

    for (
        let x = 0;
        x < GRID_WIDTH;
        x++
    ) {

        const cell =
            maze[y][x];


        const pos =
            cellWorld(
                x,
                y
            );


        if (
            cell.walls.north
        ) {

            createWall(

                pos.x,

                pos.z -
                CELL / 2,

                CELL +
                WALL_THICKNESS,

                WALL_THICKNESS

            );

        }


        if (
            cell.walls.west
        ) {

            createWall(

                pos.x -
                CELL / 2,

                pos.z,

                WALL_THICKNESS,

                CELL +
                WALL_THICKNESS

            );

        }


        if (
            y ===
            GRID_HEIGHT - 1 &&
            cell.walls.south
        ) {

            createWall(

                pos.x,

                pos.z +
                CELL / 2,

                CELL +
                WALL_THICKNESS,

                WALL_THICKNESS

            );

        }


        if (
            x ===
            GRID_WIDTH - 1 &&
            cell.walls.east
        ) {

            createWall(

                pos.x +
                CELL / 2,

                pos.z,

                WALL_THICKNESS,

                CELL +
                WALL_THICKNESS

            );

        }

    }

}


/* ============================================================
   RANDOM SUPPORT COLUMNS
============================================================ */

function createColumn(
    x,
    z
) {

    const column =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.72,
                WALL_HEIGHT,
                0.72
            ),

            wallMaterial

        );


    column.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );


    scene.add(
        column
    );


    collisionWalls.push({

        minX: x - 0.36,

        maxX: x + 0.36,

        minZ: z - 0.36,

        maxZ: z + 0.36

    });

}


for (
    let y = 1;
    y < GRID_HEIGHT - 1;
    y += 2
) {

    for (

/* ============================================================
   MAZE NEIGHBORS
============================================================ */

function getNeighbors(
    x,
    y
) {

    const result =
        [];


    const cell =
        maze[y][x];


    if (
        !cell.walls.north &&
        y > 0
    ) {

        result.push({
            x,
            y: y - 1
        });

    }


    if (
        !cell.walls.south &&
        y <
        GRID_HEIGHT - 1
    ) {

        result.push({
            x,
            y: y + 1
        });

    }


    if (
        !cell.walls.east &&
        x <
        GRID_WIDTH - 1
    ) {

        result.push({
            x: x + 1,
            y
        });

    }


    if (
        !cell.walls.west &&
        x > 0
    ) {

        result.push({
            x: x - 1,
            y
        });

    }


    return result;

}


/* ============================================================
   FIND FAR EXIT
============================================================ */

function findFarthestCell() {

    const queue =
        [{
            x: 0,
            y: 0,
            distance: 0
        }];


    const visited =
        new Set([
            "0,0"
        ]);


    let farthest =
        queue[0];


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.distance >
            farthest.distance
        ) {

            farthest =
                current;

        }


        const neighbors =
            getNeighbors(
                current.x,
                current.y
            );


        for (
            const n of neighbors
        ) {

            const key =
                n.x +
                "," +
                n.y;


            if (
                visited.has(key)
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x: n.x,

                y: n.y,

                distance:
                    current.distance +
                    1

            });

        }

    }


    return farthest;

}

/* ============================================================
   COLLISION
============================================================ */

function hitsWall(
    x,
    z
) {

    for (
        const wall of collisionWalls
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}


/* ============================================================
   PLAYER MOVEMENT
============================================================ */

function updatePlayer(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {

        return;

    }


    let forward =
        0;


    let sideways =
        0;


    if (
        keys["KeyW"]
    ) {

        forward++;

    }


    if (
        keys["KeyS"]
    ) {

        forward--;

    }


    if (
        keys["KeyD"]
    ) {

        sideways++;

    }


    if (
        keys["KeyA"]
    ) {

        sideways--;

    }


    const moving =
        forward !== 0 ||
        sideways !== 0;


    const sprinting =

        moving &&

        forward > 0 &&

        stamina > 0 &&

        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        );


    const speed =
        sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;


    if (
        sprinting
    ) {

        stamina -=
            delta *
            21;

    }

    else {

        stamina +=
            delta *
            13;

    }


    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );


    staminaInner.style.width =
        stamina +
        "%";


    const targetFov =
        sprinting
            ? 77
            : 72;


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) *
        Math.min(
            delta * 7,
            1
        );


    camera.updateProjectionMatrix();


    if (
        !moving
    ) {

        camera.position.y +=
            (
                PLAYER_HEIGHT -
                camera.position.y
            ) *
            delta *
            8;


        return;

    }


    const length =
        Math.sqrt(

            forward *
            forward +

            sideways *
            sideways

        );


    forward /=
        length;


    sideways /=
        length;


    const sin =
        Math.sin(yaw);


    const cos =
        Math.cos(yaw);


    const moveX =

        (
            -sin *
            forward +

            cos *
            sideways
        ) *

        speed *

        delta;


    const moveZ =

        (
            -cos *
            forward -

            sin *
            sideways
        ) *

        speed *

        delta;


    const nx =
        camera.position.x +
        moveX;


    if (
        !hitsWall(
            nx,
            camera.position.z
        )
    ) {

        camera.position.x =
            nx;

    }


    const nz =
        camera.position.z +
        moveZ;


    if (
        !hitsWall(
            camera.position.x,
            nz
        )
    ) {

        camera.position.z =
            nz;

    }


    movementTime +=

        delta *

        (
            sprinting
                ? 12
                : 8
        );


    const bob =
        sprinting
            ? 0.045
            : 0.028;


    camera.position.y =
        PLAYER_HEIGHT +

        Math.sin(
            movementTime
        ) *

        bob;

}

/* ============================================================
   PATHFINDING
============================================================ */

function findPath(
    start,
    target
) {

    const queue =
        [{

            x: start.x,

            y: start.y,

            path: []

        }];


    const visited =
        new Set();


    visited.add(

        start.x +
        "," +
        start.y

    );


    while (
        queue.length
    ) {

        const current =
            queue.shift();


        if (
            current.x ===
            target.x &&
            current.y ===
            target.y
        ) {

            return current.path;

        }


        const neighbors =
            getNeighbors(
                current.x,
                current.y
            );


        for (
            const n of neighbors
        ) {

            const key =
                n.x +
                "," +
                n.y;


            if (
                visited.has(key)
            ) {

                continue;

            }


            visited.add(
                key
            );


            queue.push({

                x: n.x,

                y: n.y,

                path: [

                    ...current.path,

                    n

                ]

            });

        }

    }


    return [];

}


/* ============================================================
   MONSTER UPDATE
============================================================ */

function updateMonster(
    delta
) {

    monsterActiveTimer -=
        delta;


    if (
        monsterActiveTimer >
        0
    ) {

        return;

    }


    const playerCell =
        worldCell(

            camera.position.x,

            camera.position.z

        );


    const monsterCell =
        worldCell(

            monster.position.x,

            monster.position.z

        );


    monsterPathTimer -=
        delta;


    if (
        monsterPathTimer <=
        0
    ) {

        monsterPathTimer =
            0.55;


        monsterPath =
            findPath(

                monsterCell,

                playerCell

            );

    }


    let moving =
        false;


    if (
        monsterPath.length
    ) {

        const next =
            monsterPath[0];


        const target =
            cellWorld(
                next.x,
                next.y
            );


        const dx =
            target.x -
            monster.position.x;


        const dz =
            target.z -
            monster.position.z;


        const distance =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        if (
            distance <
            0.15
        ) {

            monsterPath.shift();

        }

        else {

            moving =
                true;


            const dirX =
                dx /
                distance;


            const dirZ =
                dz /
                distance;


            monster.position.x +=

                dirX *

                MONSTER_SPEED *

                delta;


            monster.position.z +=

                dirZ *

                MONSTER_SPEED *

                delta;


            monster.rotation.y =
                Math.atan2(
                    dirX,
                    dirZ
                ) +
                Math.PI;

        }

    }


    /* creepy movement */

    const t =
        performance.now() *
        0.001;


    const swing =
        Math.sin(
            t * 8
        ) *
        (
            moving
                ? 1
                : 0.12
        );


    monsterRig.position.y =

        Math.sin(
            t * 5
        ) *

        0.04;


    monsterRig.rotation.z =

        Math.sin(
            t * 2
        ) *

        0.025;


    monsterRig.rotation.x =

        0.06 +

        Math.sin(
            t * 2.4
        ) *

        0.015;


    leftArm.upperPivot.rotation.x =

        0.18 +

        swing *
        0.45;


    rightArm.upperPivot.rotation.x =

        0.18 -

        swing *
        0.45;


    leftLeg.upperPivot.rotation.x =

        -swing *
        0.30;


    rightLeg.upperPivot.rotation.x =

        swing *
        0.30;


    leftLeg.lowerPivot.rotation.x =

        Math.max(
            0,
            swing
        ) *
        0.20;


    rightLeg.lowerPivot.rotation.x =

        Math.max(
            0,
            -swing
        ) *
        0.20;


    monsterHead.rotation.z =

        Math.sin(
            t *
            1.6
        ) *

        0.035;


    /* danger */

    const dx =

        monster.position.x -

        camera.position.x;


    const dz =

        monster.position.z -

        camera.position.z;


    const playerDistance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    let dangerAmount =
        0;


    if (
        playerDistance <
        11
    ) {

        dangerAmount =

            1 -

            playerDistance /
            11;

    }


    danger.style.opacity =
        dangerAmount *
        0.55;


    if (
        playerDistance <
        0.9
    ) {

        loseGame();

    }

}

            window.AudioContext ||
            window.webkitAudioContext
        )();


    const master =
        audioContext.createGain();


    master.gain.value =
        0.035;


    master.connect(
        audioContext.destination
    );


    const hum =
        audioContext.createOscillator();


    hum.type =
        "sine";


    hum.frequency.value =
        60;


    hum.connect(
        master
    );


    hum.start();


    const hum2 =
        audioContext.createOscillator();


    const gain2 =
        audioContext.createGain();


    hum2.frequency.value =
        120;


    gain2.gain.value =
        0.22;


    hum2.connect(
        gain2
    );


    gain2.connect(
        master
    );


    hum2.start();

}


/* ============================================================
   START GAME
============================================================ */

function startGame() {

    if (
        !started
    ) {

        started =
            true;


        startAudio();

    }


    intro.style.display =
        "none";


    renderer.domElement.requestPointerLock();

}


enterButton.addEventListener(
    "click",
    startGame
);


/* ============================================================
   POINTER LOCK
============================================================ */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            started &&
            !gameOver &&
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        if (
            !started ||
            gameOver
        ) {

            return;

        }


        pauseText.style.display =

            document.pointerLockElement ===
            renderer.domElement

                ? "none"

                : "block";

    }
);


/* ============================================================
   WIN
============================================================ */

function winGame() {

    if (
        gameOver
    ) {

        return;

    }


    gameOver =
        true;


    document.exitPointerLock();


    endScreen.style.display =
        "flex";


    endTitle.textContent =
        "YOU ESCAPED";


    endTitle.style.color =
        "#d9ffc7";


    endSub.textContent =
        "You found a way out.";

}


/* ============================================================
   LOSE
============================================================ */

function loseGame() {

    if (
        gameOver
    ) {

        return;

    }


    gameOver =
        true;


    document.exitPointerLock();


    danger.style.opacity =
        0.85;


    setTimeout(
        () => {

            endScreen.style.display =
                "flex";


            endTitle.textContent =
                "YOU WERE FOUND";


            endTitle.style.color =
                "#942525";


            endSub.textContent =
                "Something was wandering the halls.";

        },

        300

    );

}


/* ============================================================
   RESTART
============================================================ */

restartButton.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =

            window.innerWidth /

            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


/* ============================================================
   GAME LOOP
============================================================ */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (
        started &&
        !gameOver
    ) {

        updatePlayer(
            delta
        );


        updateMonster(
            delta
        );


        updateLights(
            delta
        );


        checkExit();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
